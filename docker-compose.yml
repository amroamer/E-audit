services:
  db:
    image: postgres:16
    container_name: eaudit_db
    environment:
      POSTGRES_USER: eaudit
      POSTGRES_PASSWORD: eaudit
      POSTGRES_DB: eaudit
    ports:
      - "5433:5432"
    volumes:
      - eaudit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaudit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eaudit_pgdata:
