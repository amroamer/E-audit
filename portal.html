    const b = boxOfCtx(ctx, h.test.box);
    const nums = (doc.rows || []).map((r) => asNumber(r[vi])).filter((v) => v !== null);
    if (!nums.length) return { hypothesis_id: h.id, status: "insufficient-evidence", amount: 0,
      detail: { filename: name }, explanation: `No numeric VAT values could be read from ${name}.` };
    const total = r2(nums.reduce((a, v) => a + v, 0));
    const excess = r2(total - b.declared);
    const detail = { basis: `excess|${h.test.box}|${name}`, filename: name, listing_total: total,
      declared: b.declared, excess, rows: nums.length, materiality: b.materiality };
    if (excess > b.materiality)
      return { hypothesis_id: h.id, status: "confirmed", amount: excess, detail,
        explanation: `${name} totals ${sar2(total)} across ${nums.length} rows against ${sar2(b.declared)} declared — ${sar2(excess)} more than the return reports.` };
    if (excess < -b.materiality)
      return { hypothesis_id: h.id, status: "refuted", amount: 0, detail,
        explanation: `${name} totals ${sar2(total)}, which is less than the ${sar2(b.declared)} declared. The return is not understated on this document.` };
    return { hypothesis_id: h.id, status: "refuted", amount: 0, detail,
      explanation: `${name} totals ${sar2(total)} against ${sar2(b.declared)} declared — they agree within materiality.` };
  },

  "trial-balance-absent": (h, ctx) => {
    if ((ctx.documents || []).some((d) => /trial|balance/i.test(d.filename || "")))
      return { hypothesis_id: h.id, status: "refuted", amount: 0, detail: {},
        explanation: "A trial balance was supplied." };
    const inner = DOC_TESTS["listing-vs-declared"](h, ctx);
    if (inner.status !== "confirmed")
      return { hypothesis_id: h.id, status: "refuted", amount: 0, detail: inner.detail,
        explanation: "No trial balance was supplied, but the records submitted do not exceed the declared sales, so there is nothing to substantiate." };
    return { hypothesis_id: h.id, status: "confirmed", amount: inner.amount,
      detail: { ...inner.detail, trial_balance: "not supplied" },
      explanation: inner.explanation + " No trial balance was supplied to substantiate it." };
  },

  "secondary-activity": (h, ctx) => {
    if (!(ctx.activities || []).length)
      return { hypothesis_id: h.id, status: "insufficient-evidence", amount: 0, detail: {},
        explanation: "The registration's economic activities are not on file, so revenue cannot be tested against them." };
    const name = h.test.params.document || "";
    const doc = docBy(ctx, name);
    if (!doc) return noDoc(h, name);
    const cols = doc.columns || [], di = cols.indexOf("description"), vi = cols.indexOf("vat_amount");
    if (di < 0) return { hypothesis_id: h.id, status: "insufficient-evidence", amount: 0,
      detail: { filename: name },
      explanation: `${name} has no description column, so supplies cannot be matched to the registered activities.` };
    const words = new Set();
    ctx.activities.forEach((a) => String(a.description || "").toLowerCase().replace(/,/g, " ")
      .split(/\s+/).forEach((w) => { if (w.length > 4) words.add(w.replace(/[()-]/g, "")); }));
    if (!words.size) return { hypothesis_id: h.id, status: "insufficient-evidence", amount: 0,
      detail: {}, explanation: "The registered activities carry no descriptions to match against." };
    const outside = []; let amount = 0;
    (doc.rows || []).forEach((row, n) => {
      const text = String(row[di] || "").toLowerCase();
      if (!text.trim()) return;
      if ([...words].some((w) => text.includes(w))) return;
      const vat = asNumber(row[vi]) || 0;
      amount += vat;
      outside.push({ row: n + 1, description: row[di], vat_amount: vat });
    });
    const detail = { basis: `activity|${h.test.box}|${name}`, filename: name,
      rows_outside: outside.length, activities: ctx.activities.map((a) => a.description),
      examples: outside.slice(0, MAX_CITED) };
    if (!outside.length) return { hypothesis_id: h.id, status: "refuted", amount: 0, detail,
      explanation: "Every supply described in the listing matches a registered activity." };
    return { hypothesis_id: h.id, status: "confirmed", amount: r2(amount), detail,
      explanation: `${outside.length} line(s) in ${name} describe supplies that match none of the registered activities, carrying ${sar2(amount)} of VAT. Review whether they belong to an activity the return does not disclose.` };
  },

  "non-cooperation": (h, ctx) => {
    const outstanding = (ctx.gaps || []).filter((g) => g.kind === "missing-item");
    if (!outstanding.length) return { hypothesis_id: h.id, status: "refuted", amount: 0,
      detail: {}, explanation: "Everything requested has been supplied." };
    const labels = [...new Set(outstanding.map((g) => g.item_label).filter(Boolean))].sort();
    return { hypothesis_id: h.id, status: "confirmed", amount: 0,
      detail: { basis: "non-cooperation", outstanding: outstanding.length, items: labels },
      explanation: `${outstanding.length} requested item(s) remain outstanding` +
        (labels.length ? ` — ${labels.join(", ")}` : "") + ". Claims that depend on them cannot be substantiated." };
  },

  "auditor-figure": (h, ctx) => {
    const bad = (ctx.calculations || []).filter((c) => c.status === "disagree");
    if (!bad.length) {
      const checked = (ctx.calculations || []).length;
      return { hypothesis_id: h.id, status: "refuted", amount: 0, detail: { checked },
        explanation: checked ? `All ${checked} recorded figure(s) were reproduced from the documents they were taken from.`
                             : "No figures have been recorded on this case to check." };
    }
    const worst = bad.reduce((a, c) => (Math.abs(c.delta) > Math.abs(a.delta) ? c : a), bad[0]);
    return { hypothesis_id: h.id, status: "confirmed", amount: r2(Math.abs(worst.delta)),
      detail: { disagreements: bad.length, items: bad.slice(0, MAX_CITED) },
      explanation: `${bad.length} recorded figure(s) could not be reproduced. The largest, '${worst.label}', was recorded as ${sar2(worst.stated)} against ${sar2(worst.computed)} recomputed.` };
  },
};

/* ---- the four agents (agents/roster.py)
   Language only, plus a typed test. No agent states a figure or reaches a conclusion.
   `why` records the trigger, because "an agent proposed it" is not a defence. */
function HD(id, agent, outcome, reason, confidence, why, claim, kind, box, params) {
  return { id, agent, outcome_code: outcome || "", reason_code: reason, confidence, why, claim,
           test: { kind, box: box || "output", params: params || {} } };
}
const likeDoc = (docs, ...frags) =>
  docs.find((d) => frags.some((f) => (d.filename || "").toLowerCase().includes(f))) || null;

function agentRegulations(ctx) {
  const out = [], docs = ctx.documents || [];
  const sales = likeDoc(docs, "sales", "revenue", "output");
  const purch = likeDoc(docs, "purchase", "input", "expense");
  const notes = likeDoc(docs, "credit", "note", "debit");
  [[sales, "sale"], [purch, "purchase"]].forEach(([doc, dir]) => {
    if (!doc) return;
    out.push(HD(`RG-${dir === "sale" ? "S" : "P"}1`, "Regulations", "DOC-INVOICE", "D01", "high",
      `${doc.filename} carries ${(doc.rows || []).length} rows to test against the conditions of a valid tax invoice.`,
      "Some rows may not meet all the conditions of a valid tax invoice, which would put the documents themselves in question rather than the arithmetic.",
      "invoice-conditions", dir === "sale" ? "output" : "input", { document: doc.filename }));
  });
  if (notes)
    out.push(HD("RG-C1", "Regulations", "DOC-CREDIT", "D03", "high",
      `${notes.filename} was supplied, so the note conditions can be tested.`,
      "Some credit notes may not meet the conditions required for them to reduce the output tax already accounted for.",
      "credit-note-conditions", "output", { document: notes.filename }));
  if (purch)
    out.push(HD("RG-P2", "Regulations", "PUR-BLOCKED", "D07", "medium",
      "A purchase listing is on file, so the claimed lines can be tested against the categories on which input VAT is not recoverable.",
      "Input VAT may have been claimed on purchases the purchaser is not entitled to deduct.",
      "blocked-input", "input", { document: purch.filename }));
  return out;
}

function agentDataEntry(ctx) {
  const b = boxOfCtx(ctx, "output");
  if (Math.abs(b.unexplained) <= b.materiality) return [];
  return [
    HD("DE-01", "Data Entry", "", "A09", "high",
      "The declared figure and the figure the documents support differ by more than materiality, which is the precondition for a keying test.",
      "The declared figure may be the supported one with the decimal point in the wrong place — a keying error rather than an under-declaration.",
      "decimal-shift"),
    HD("DE-02", "Data Entry", "", "A09", "medium",
      "A transposition produces the same digits in another order, which is worth excluding before treating the difference as undeclared revenue.",
      "The declared figure may carry the supported figure's digits in a different order, which would indicate a transposition when the return was keyed.",
      "digit-transposition"),
    HD("DE-03", "Data Entry", "", "R10", "medium",
      "A declaration far outside this taxpayer's own filing range supports a keying explanation over a trading one.",
      "The declaration may be out of character for this taxpayer's own trading history, which would support a data-entry explanation over a trading one.",
      "historical-magnitude"),
  ];
}

function agentCalculation(ctx) {
  const out = [], docs = ctx.documents || [];
  const sales = likeDoc(docs, "sales", "revenue", "output");
  const pos = likeDoc(docs, "pos", "point-of-sale", "till", "bank");
  if (sales) {
    out.push(HD("CA-01", "Calculation", "SAL-HIGHER", "R01", "high",
      `${sales.filename} can be totalled and set against the declared box.`,
      "The sales the taxpayer's own listing supports may exceed the sales reported in the return.",
      "listing-vs-declared", "output", { document: sales.filename }));
    out.push(HD("CA-02", "Calculation", "SAL-UNDISCLOSED", "R01", "medium",
      "If the listing exceeds the return, the excess is either a timing difference or revenue that was never disclosed.",
      "Part of the supplies evidenced by the listing may not have been disclosed in the return at all.",
      "listing-vs-declared", "output", { document: sales.filename, undisclosed: true }));
  }
  if (pos)
    out.push(HD("CA-03", "Calculation", "SAL-POS", "R01", "high",
      `${pos.filename} is an independent record of takings and can be set against the declared box.`,
      "Takings evidenced by the point-of-sale or bank records may exceed the sales reported in the return.",
      "listing-vs-declared", "output", { document: pos.filename }));
  const bad = (ctx.calculations || []).filter((c) => c.status === "disagree");
  if (bad.length)
    out.push(HD("CA-04", "Calculation", "", "A09", "high",
      `${bad.length} figure(s) recorded on this case could not be reproduced from the documents they were said to come from.`,
      "A figure recorded during the review does not follow from the document it was taken from, and should be re-derived before it supports a conclusion.",
      "auditor-figure"));
  return out;
}

function agentEvidence(ctx) {
  const out = [], docs = ctx.documents || [];
  const purch = likeDoc(docs, "purchase", "input", "expense");
  const sales = likeDoc(docs, "sales", "revenue", "output");
  if (purch)
    out.push(HD("EV-01", "Evidence & Coverage", "PUR-NODOC", "D01", "high",
      `${purch.filename} claims input VAT line by line, so each line can be tested for the document behind it.`,
      "Input VAT may have been claimed on purchases with no supporting documentation behind them.",
      "missing-support", "input", { document: purch.filename }));
  if (sales) {
    out.push(HD("EV-02", "Evidence & Coverage", "SAL-MISMATCH", "R01", "medium",
      "The documents supplied can be set against the declared sales to see whether they describe the same population.",
      "The documents provided may not correspond to the sales declared in the return.",
      "listing-vs-declared", "output", { document: sales.filename, correspondence: true }));
    if (!likeDoc(docs, "trial", "balance", "tb"))
      out.push(HD("EV-03", "Evidence & Coverage", "SAL-NOTB", "R01", "medium",
        "No trial balance is among the documents received, so an excess over the return cannot be traced into the accounts.",
        "Sales evidenced by the records submitted may exceed those declared, with no trial balance supplied to substantiate the difference.",
        "trial-balance-absent", "output", { document: sales.filename }));
    if ((ctx.activities || []).length)
      out.push(HD("EV-04", "Evidence & Coverage", "SAL-SECONDARY", "R09", "medium",
        `The registration carries ${ctx.activities.length} economic activit${ctx.activities.length === 1 ? "y" : "ies"}, so the listing can be tested for revenue outside the disclosed ones.`,
        "The listing may contain supplies from a secondary business activity that the return does not disclose.",
        "secondary-activity", "output", { document: sales.filename }));
  }
  if ((ctx.gaps || []).some((g) => g.kind === "missing-item"))
    out.push(HD("EV-05", "Evidence & Coverage", "PUR-NOCOOP", "D01", "high",
      `${(ctx.gaps || []).filter((g) => g.kind === "missing-item").length} requested item(s) have still not been supplied.`,
      "Items requested from the taxpayer remain outstanding, and claims that depend on them cannot be substantiated.",
      "non-cooperation", "input"));
  return out;
}

const DOC_AGENTS = [agentRegulations, agentDataEntry, agentCalculation, agentEvidence];
const proposeDocuments = (ctx) => DOC_AGENTS.flatMap((a) => a(ctx));

/* ---- findings: confirmed hypotheses, worded by the vocabulary (agents/findings.py)
   `basis` is the EVIDENCE, declared by the adjudicator — trial-balance-absent delegates to
   listing-vs-declared and must share its basis or one excess is assessed twice. */
function basisOf(h, a) {
  const declared = (a.detail || {}).basis;
  if (declared) return String(declared);
  const doc = (h.test.params || {}).document || "";
  return `${h.test.kind}|${h.test.box}|${doc}`;
}
function findingsFrom(hypotheses, adjudications) {
  const by = Object.fromEntries(adjudications.map((a) => [a.hypothesis_id, a]));
  const out = [];
  hypotheses.forEach((h) => {
    const o = OUTCOMES[h.outcome_code];
    const a = by[h.id];
    if (!o || !a || a.status !== "confirmed") return;
    out.push({ code: h.outcome_code, statement: o.statement, amount: r2(a.amount || 0),
      effect: o.effect, agent: o.agent, hypothesis_id: h.id, basis: basisOf(h, a),
      why: h.why, explanation: a.explanation, detail: a.detail || {} });
  });
  return out.sort((x, y) => Math.abs(y.amount) - Math.abs(x.amount));
}
function oncePerBasis(findings, effect) {
  const largest = {};
  findings.filter((f) => f.effect === effect).forEach((f) => {
    const k = f.basis || f.hypothesis_id;
    largest[k] = Math.max(largest[k] || 0, f.amount);
  });
  return r2(Object.values(largest).reduce((a, v) => a + v, 0));
}
function exposureOf(findings) {
  const out = oncePerBasis(findings, "increases-output");
  const inp = oncePerBasis(findings, "disallows-input");
  const assessed = new Set(findings.filter((f) => f.effect !== "documentation")
    .map((f) => f.basis || f.hypothesis_id));
  const doc = oncePerBasis(findings.filter((f) => !assessed.has(f.basis || f.hypothesis_id)),
                           "documentation");
  const bases = new Set(findings.map((f) => f.basis || f.hypothesis_id));
  return { increases_output: out, disallows_input: inp, documentation_at_risk: doc,
           total: r2(out + inp), count: findings.length, distinct_bases: bases.size };
}
function groupedByBasis(findings) {
  const by = new Map();
  findings.forEach((f) => {
    const k = f.basis || f.hypothesis_id;
    const g = by.get(k) || { basis: k, amount: 0, findings: [] };
    g.amount = Math.max(g.amount, f.amount);
    g.findings.push(f);
    by.set(k, g);
  });
  return [...by.values()].sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount));
}

/* ---- the auditor's arithmetic (agents/calculation.py)
   A closed algebra. In the portal there is no model to parse a sentence, so the auditor picks
   the operation and column — which is the same path the app takes with no API key, not a
   degraded one. Python computes there; JS computes here; neither ever asks a model. */
const AGGREGATIONS = ["sum", "count", "count_distinct", "average", "max", "min"];
const FILTER_OPS = ["eq", "ne", "gt", "gte", "lt", "lte", "between", "contains", "is_blank", "not_blank"];

function passesFilter(row, cols, f) {
  const i = cols.indexOf(f.column);
  if (i < 0 || i >= row.length) return false;
  const cell = row[i];
  const isBlank = cell === null || cell === undefined || String(cell).trim() === "";
  if (f.op === "is_blank") return isBlank;
  if (f.op === "not_blank") return !isBlank;
  if (isBlank) return false;
  const dc = asDate(cell);
  if (f.op === "between" && Array.isArray(f.value) && f.value.length === 2) {
    const lo = asDate(f.value[0]), hi = asDate(f.value[1]);
    if (dc && lo && hi) return lo <= dc && dc <= hi;
    const n = asNumber(cell), a = asNumber(f.value[0]), b = asNumber(f.value[1]);
    return n !== null && a !== null && b !== null && a <= n && n <= b;
  }
  if (f.op === "contains") return String(cell).trim().toLowerCase().includes(String(f.value).trim().toLowerCase());
  const dv = asDate(f.value);
  let L, R;
  if (dc && dv) { L = dc; R = dv; }
  else {
    const nc = asNumber(cell), nv = asNumber(f.value);
    if (nc !== null && nv !== null) { L = nc; R = nv; }
    else { L = String(cell).trim().toLowerCase(); R = String(f.value).trim().toLowerCase(); }
  }
  return { eq: L === R, ne: L !== R, gt: L > R, gte: L >= R, lt: L < R, lte: L <= R }[f.op];
}

function runCalc(query, doc) {
  const name = (doc && doc.filename) || "";
  if (!AGGREGATIONS.includes(query.op))
    return { status: "not-checkable", value: null, note: `'${query.op}' is not an aggregation this engine performs.`, query: query.op, document: name, rows: [], matched: 0, scanned: 0, column: "" };
  const cols = (doc && doc.columns) || [], rows = (doc && doc.rows) || [];
  const describe = (query.op === "count" ? "count()" : `${query.op}(${query.column})`) +
    ((query.filters || []).length ? " where " + query.filters.map((f) => `${f.column} ${f.op} ${Array.isArray(f.value) ? f.value.join("–") : f.value}`).join(" and ") : "");
  if (query.op !== "count" && !query.column)
    return { status: "not-checkable", value: null, note: `${query.op} needs a column to work on.`, query: describe, document: name, rows: [], matched: 0, scanned: rows.length, column: "" };
  if (query.column && cols.indexOf(query.column) < 0)
    return { status: "not-checkable", value: null, query: describe, document: name, scanned: rows.length, matched: 0, column: query.column, rows: [],
      note: `'${query.column}' is not a column in ${name || "this document"}. Columns present: ${cols.join(", ") || "none"}.` };
  for (const f of query.filters || [])
    if (cols.indexOf(f.column) < 0)
      return { status: "not-checkable", value: null, query: describe, document: name, scanned: rows.length, matched: 0, column: query.column, rows: [],
        note: `Cannot filter on '${f.column}' — it is not a column in ${name || "this document"}.` };

  const kept = rows.filter((r) => (query.filters || []).every((f) => passesFilter(r, cols, f)));
  const idx = query.column ? cols.indexOf(query.column) : -1;
  let value;
  if (query.op === "count") value = kept.length;
  else {
    const raw = kept.map((r) => (idx < r.length ? r[idx] : null));
    if (query.op === "count_distinct")
      value = new Set(raw.filter((v) => v !== null && String(v).trim()).map((v) => String(v).trim().toLowerCase())).size;
    else {
      const nums = raw.map(asNumber).filter((v) => v !== null);
      if (!nums.length) return { status: "not-checkable", value: null, query: describe, document: name, column: query.column, matched: kept.length, scanned: rows.length, rows: [],
        note: `No numeric values in '${query.column}' for the rows selected.` };
      value = { sum: nums.reduce((a, v) => a + v, 0), average: nums.reduce((a, v) => a + v, 0) / nums.length,
                max: Math.max(...nums), min: Math.min(...nums) }[query.op];
    }
  }
  const cited = kept.slice(0, 8).map((r) => {
    const o = { row: rows.indexOf(r) + 1 };
    cols.forEach((c, i) => { if (i < r.length) o[c] = r[i]; });
    return o;
  });
  return { status: "ok", value: r2(value), matched: kept.length, scanned: rows.length,
           column: query.column || "", document: name, query: describe, rows: cited, note: "" };
}

function verifyCalc(stated, query, doc) {
  const res = runCalc(query, doc);
  if (res.status !== "ok" || res.value === null)
    return { status: "not-checkable", stated, computed: null, delta: 0, detail: res,
             explanation: res.note || "The stated method could not be reproduced." };
  const delta = r2(res.value - stated);
  const where = res.matched !== res.scanned
    ? ` over ${res.matched} of ${res.scanned} rows` : ` over all ${res.scanned} rows`;
  if (Math.abs(delta) <= TOLERANCE)
    return { status: "agree", stated, computed: res.value, delta, detail: res,
      explanation: `Recomputed ${res.query}${where} in ${res.document || "the document"} and got ${sar2(res.value)}, which agrees with the figure recorded.` };
  return { status: "disagree", stated, computed: res.value, delta, detail: res,
    explanation: `Recomputed ${res.query}${where} in ${res.document || "the document"} and got ${sar2(res.value)} against ${sar2(stated)} recorded — a difference of ${sar2(delta)}. Check whether the same rows and the same column were used.` };
}

/* the auditor's recorded calculations, per case — the portal's mutable state for this panel */
const CALCS = {};
function recordCalc(caseId, label, query, stated) {
  const docs = documentsFor(caseId);
  const doc = docs.find((d) => d.filename === query.document) || (docs.length === 1 ? docs[0] : null);
  if (!doc) {
    (CALCS[caseId] = CALCS[caseId] || []).push({
      seq: (CALCS[caseId] || []).length + 1, label, stated, computed: null, delta: 0,
      status: "not-checkable", query: "", document: query.document || "",
      explanation: docs.length
        ? `Several documents are on this case, so it is not clear which one to use. Name one of: ${docs.map((d) => d.filename).join(", ")}.`
        : "No documents have been uploaded for this case yet." });
    return;
  }
  const v = verifyCalc(stated, query, doc);
  (CALCS[caseId] = CALCS[caseId] || []).push({
    seq: (CALCS[caseId] || []).length + 1, label, stated, computed: v.computed, delta: v.delta,
    status: v.status, query: v.detail.query, document: doc.filename, explanation: v.explanation });
}
const calcsFor = (caseId) => CALCS[caseId] || [];

/* ------------------------------------------- investigation (app/agents/*)
   Agents hypothesise; the deterministic adjudicator settles. No figure in this block
   comes from anywhere but the engine. */
const CONFIDENCE_RANK = { high: 3, medium: 2, low: 1 };

function priorReturnsFor(c) {
  return DATA.returns
    .filter((r) => r.taxpayer_id === c.taxpayer_id && r.period_from < c.period_from)
    .sort((a, b) => (a.period_from < b.period_from ? -1 : 1))
    .map((r) => {
      const b = r.boxes.find((x) => x.box_code === "standard_rate_sales" && x.direction === "sale");
      return { period_from: r.period_from, vat_amount: b ? b.vat_amount : 0 };
    });
}
function priorCasesFor(c) {
  return DATA.cases.filter((o) => o.taxpayer_id === c.taxpayer_id && o.case_id !== c.case_id)
    .map((o) => ({ case_id: o.case_id, root_cause_code: o.root_cause_code }));
}

const TOLERANCE = 1.0;
const near = (a, b) => Math.abs(a - b) <= TOLERANCE;
const digitsOf = (v) => String(Math.round(Math.abs(v))).split("").sort().join("");
const boxOfCtx = (ctx, which) => (which === "output" ? ctx.recon : ctx.recon.purchase);
const sarNum = (v) => Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });

const ADJUDICATORS = {
  ...DOC_TESTS,
  "decimal-shift": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    for (const f of [10, 100, 0.1, 0.01]) {
      if (b.declared && near(b.declared * f, b.expected_vat)) {
        return { status: "confirmed", amount: r2(b.unexplained),
          detail: { declared: b.declared, factor: f, expected: b.expected_vat, product: r2(b.declared * f) },
          explanation: `Declared SAR ${sarNum(b.declared)} x ${f} = SAR ${sarNum(b.declared * f)}, which equals the expected return of SAR ${sarNum(b.expected_vat)} exactly. The difference of SAR ${sarNum(b.unexplained)} is consistent with a misplaced decimal point in the declared figure, not with unreported supplies.` };
      }
    }
    return { status: "refuted", amount: 0, detail: { declared: b.declared, expected: b.expected_vat },
      explanation: `No power-of-ten multiple of the declared SAR ${sarNum(b.declared)} reaches the expected SAR ${sarNum(b.expected_vat)}.` };
  },
  "digit-transposition": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    if (b.declared && b.expected_vat && digitsOf(b.declared) === digitsOf(b.expected_vat) && !near(b.declared, b.expected_vat))
      return { status: "confirmed", amount: r2(b.unexplained), detail: { declared: b.declared, expected: b.expected_vat },
        explanation: `The declared SAR ${sarNum(b.declared)} and the expected SAR ${sarNum(b.expected_vat)} use the same digits in a different order — the signature of a keying error rather than a missing supply.` };
    return { status: "refuted", amount: 0, detail: { declared: b.declared, expected: b.expected_vat },
      explanation: "The declared and expected figures do not share the same digits." };
  },
  "single-document": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    for (const iv of b.evidence_invoices || []) {
      if (near(Math.abs(iv.tax_amount), Math.abs(b.unexplained)) && Math.abs(b.unexplained) > 0)
        return { status: "confirmed", amount: r2(b.unexplained),
          detail: { uuid: iv.uuid, tax_amount: iv.tax_amount, issue_date: iv.issue_date },
          explanation: `The difference of SAR ${sarNum(b.unexplained)} equals exactly one document, ${iv.uuid} issued ${iv.issue_date}. A single omitted or duplicated invoice explains it.` };
    }
    return { status: "refuted", amount: 0, detail: {}, explanation: "No single document matches the difference." };
  },
  "paired-offset": (h, ctx) => {
    const o = ctx.recon.unexplained, i = ctx.recon.purchase.unexplained;
    if (Math.abs(o) > TOLERANCE && near(o, -i))
      return { status: "confirmed", amount: r2(Math.abs(o)), detail: { output_unexplained: o, input_unexplained: i },
        explanation: `The output box is out by SAR ${sarNum(o)} and the input box by SAR ${sarNum(i)} — equal and opposite. That is the signature of a misposting between the two boxes, not of a revenue loss.` };
    return { status: "refuted", amount: 0, detail: { output_unexplained: o, input_unexplained: i },
      explanation: "The two boxes' differences are not equal and opposite." };
  },
  "period-shift": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box), d = b.deferred_out || { count: 0, amount: 0 };
    if (d.amount && near(d.amount, b.unexplained))
      return { status: "confirmed", amount: r2(b.unexplained), detail: { ...d },
        explanation: `The difference of SAR ${sarNum(b.unexplained)} equals the SAR ${sarNum(d.amount)} of supplies (${d.count} documents) whose tax point falls in the next period — a timing difference, not an under-declaration.` };
    return { status: "refuted", amount: 0, detail: { ...d },
      explanation: "The difference does not match the supplies moved between periods." };
  },
  "rate-misapplication": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    const a = Number(h.test.params.from_rate ?? 15), t = Number(h.test.params.to_rate ?? 5);
    const implied = r2((b.expected_base * (a - t)) / 100);
    if (Math.abs(b.unexplained) > TOLERANCE && near(implied, b.unexplained))
      return { status: "confirmed", amount: r2(b.unexplained), detail: { base: b.expected_base, from_rate: a, to_rate: t, implied },
        explanation: `The difference of SAR ${sarNum(b.unexplained)} equals the taxable base of SAR ${sarNum(b.expected_base)} at ${a}% rather than ${t}% — a rate applied to the whole base, not a missing supply.` };
    return { status: "refuted", amount: 0, detail: { base: b.expected_base, implied },
      explanation: "The difference does not correspond to a rate difference on this base." };
  },
  recurrence: (h, ctx) => {
    const hits = ctx.priorCases.filter((c) => c.root_cause_code);
    if (hits.length) {
      const codes = [...new Set(hits.map((c) => c.root_cause_code))].sort();
      return { status: "confirmed", amount: 0,
        detail: { prior_cases: hits.map((c) => c.case_id), root_causes: codes },
        explanation: `This taxpayer has ${hits.length} prior case(s) closed with a recorded root cause (${codes.join(", ")}). The same treatment should be applied unless the facts differ.` };
    }
    return { status: "refuted", amount: 0, detail: {}, explanation: "No prior case with a recorded root cause for this taxpayer." };
  },
  "historical-magnitude": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    const hist = ctx.priorReturns.map((r) => r.vat_amount).filter((v) => v);
    if (hist.length < 2)
      return { status: "insufficient-evidence", amount: 0, detail: { prior_periods: hist.length },
        explanation: "Too few prior periods on file to judge the magnitude." };
    const typical = r2(hist.reduce((s, v) => s + v, 0) / hist.length);
    if (typical && b.declared && (b.declared < typical / 3 || b.declared > typical * 3)) {
      const dir = b.declared < typical ? "far below" : "far above";
      return { status: "confirmed", amount: 0, detail: { declared: b.declared, prior_average: typical, periods: hist.length },
        explanation: `Declared SAR ${sarNum(b.declared)} is ${dir} this taxpayer's own average of SAR ${sarNum(typical)} across ${hist.length} prior periods. The declaration is out of character for the business, which points at how the figure was entered rather than at the trading itself.` };
    }
    return { status: "refuted", amount: 0, detail: { declared: b.declared, prior_average: typical },
      explanation: "The declared figure is in line with this taxpayer's history." };
  },
};

function adjudicate(h, ctx) {
  const fn = ADJUDICATORS[h.test.kind];
  if (!fn) return { hypothesis_id: h.id, status: "insufficient-evidence", amount: 0, detail: {}, explanation: "" };
  return { hypothesis_id: h.id, ...fn(h, ctx) };
}

function proposeHypotheses(ctx) {
  const out = [];
  const material = (which) => {
    const b = boxOfCtx(ctx, which);
    return Math.abs(b.unexplained) > b.materiality;
  };
  const H = (id, agent, reason, conf, claim, kind, params) =>
    ({ id, agent, reason_code: reason, confidence: conf, claim,
       test: { kind, box: "output", params: params || {} } });
  if (material("output")) {
    out.push(H("RA-01", "Reconstruction Analyst", "T02", "medium",
      "The difference may be a timing one — supplies whose tax point falls in the next period rather than supplies that were never declared.", "period-shift"));
    out.push(H("RA-02", "Reconstruction Analyst", "R01", "medium",
      "A single omitted or duplicated document would account for the difference on its own.", "single-document"));
    out.push(H("RA-03", "Reconstruction Analyst", "R07", "low",
      "The whole taxable base may have been declared at the wrong rate.", "rate-misapplication", { from_rate: 15, to_rate: 5 }));
  }
  if (material("output") && material("input"))
    out.push(H("RA-04", "Reconstruction Analyst", "R08", "medium",
      "The two boxes may be out by equal and opposite amounts, which would point at a misposting between them rather than a loss of revenue.", "paired-offset"));
  // Data-Entry Forensics is retired: the roster's Data Entry agent is the same
  // specialist under the name the auditors gave it, and running both duplicates DE-01.
  if (ctx.priorCases.length)
    out.push(H("HP-01", "Historical Pattern", "R06", "medium",
      "This taxpayer has been audited before, and the earlier root cause may apply again — in which case the resolution already exists.", "recurrence"));
  if (material("output") && ctx.priorReturns.length >= 2)
    out.push(H("HP-02", "Historical Pattern", "R10", "medium",
      "The declared position sits outside the range this taxpayer has filed in previous periods.", "historical-magnitude"));
  return out;
}

function investigate(caseId) {
  const c = caseById(caseId);
  const recon = reconcileCase(caseId);
  const ctx = { recon, priorReturns: priorReturnsFor(c), priorCases: priorCasesFor(c),
                documents: documentsFor(caseId),
                activities: activitiesFor(caseId),
                calculations: calcsFor(caseId),
                gaps: gapsFor(caseId) };
  const entries = [];
  let seq = 0;
  const add = (round, kind, agent, payload) => entries.push({ seq: ++seq, round, kind, agent, payload });
  const difference = recon.unexplained;

  add(0, "fact", "Engine", { declared: recon.declared, expected: recon.expected_vat,
    difference, materiality: recon.materiality, state: recon.state,
    input_unexplained: recon.purchase.unexplained, deferred_out: recon.deferred_out });

  if (Math.abs(difference) <= recon.materiality && recon.purchase.state !== "potential-finding"
      && !proposeDocuments(ctx).length) {
    const conclusion = "The declared return is supported by the qualified e-invoice evidence within materiality. There is no difference to investigate.";
    add(4, "conclusion", "Case Lead", { leading: null, explained: 0, unexplained: 0, conclusion });
    return { case_id: caseId, rounds: 1, entries, hypotheses: [], adjudications: [],
             leading: null, conclusion, unexplained: 0, source: "deterministic",
             findings: [], exposure: exposureOf([]) };
  }

  const hypotheses = proposeHypotheses(ctx).concat(proposeDocuments(ctx));
  hypotheses.forEach((h) => add(1, "hypothesis", h.agent,
    { id: h.id, claim: h.claim, why: h.why || "", test: h.test.kind,
      confidence: h.confidence, outcome_code: h.outcome_code || "" }));

  const adjudications = hypotheses.map((h) => adjudicate(h, ctx));
  adjudications.forEach((a) => add(2, "adjudication", "Adjudicator",
    { id: a.hypothesis_id, status: a.status, amount: a.amount, explanation: a.explanation }));

  const byId = Object.fromEntries(hypotheses.map((h) => [h.id, h]));
  const confirmed = adjudications.filter((a) => a.status === "confirmed");
  const explanatory = confirmed.filter((a) => Math.abs(a.amount) > 0).sort((x, y) => {
    const d = Math.abs(y.amount) - Math.abs(x.amount);
    return d || CONFIDENCE_RANK[byId[y.hypothesis_id].confidence] - CONFIDENCE_RANK[byId[x.hypothesis_id].confidence];
  });
  const context = confirmed.filter((a) => Math.abs(a.amount) === 0);
  const leading = explanatory[0] || null;

  if (leading) {
    const rivals = explanatory.filter((a) => a.hypothesis_id !== leading.hypothesis_id);
    const shortfall = r2(Math.abs(difference) - Math.abs(leading.amount));
    if (rivals.length)
      add(3, "objection", "Challenger", { against: leading.hypothesis_id,
        note: "More than one hypothesis is confirmed and they claim the same difference. The auditor must choose between them: " + rivals.map((a) => a.hypothesis_id).join(", ") + "." });
    else if (shortfall > recon.materiality)
      add(3, "objection", "Challenger", { against: leading.hypothesis_id,
        note: `The leading hypothesis accounts for SAR ${sarNum(leading.amount)} of a SAR ${sarNum(difference)} difference, leaving SAR ${sarNum(shortfall)} unaccounted for — above materiality. It cannot be the whole story.` });
    else
      add(3, "objection", "Challenger", { against: leading.hypothesis_id,
        note: "No competing hypothesis survived adjudication and the leader accounts for the difference within materiality." });
  } else {
    add(3, "objection", "Challenger", { against: null,
      note: "No hypothesis was confirmed. The difference is not explained by any pattern the evidence agents can test." });
  }

  const explained = r2(leading ? Math.abs(leading.amount) : 0);
  const unexplained = r2(Math.abs(difference) - explained);
  let conclusion;
  if (!leading) {
    conclusion = `No tested pattern explains the SAR ${sarNum(unexplained)} difference. Escalate to the auditor with the ranked hypotheses for a manual line review.`;
    if (context.length) conclusion += " Supporting context: " + context.map((a) => a.explanation).join(" ");
  } else if (unexplained <= recon.materiality) {
    conclusion = `${byId[leading.hypothesis_id].agent} proposed it and the engine confirmed it: ${leading.explanation}`;
  } else {
    conclusion = `${leading.explanation} That still leaves SAR ${sarNum(unexplained)} unaccounted for, which needs a separate explanation.`;
  }
  add(4, "conclusion", "Case Lead", { leading: leading ? leading.hypothesis_id : null, explained, unexplained, conclusion });

  const found = findingsFrom(hypotheses, adjudications);
  return { case_id: caseId, rounds: 5, entries, hypotheses, adjudications,
           leading: leading ? leading.hypothesis_id : null, conclusion, unexplained,
           source: "deterministic", findings: found, exposure: exposureOf(found) };
}

/* ------------------------------------------- composite priority (priority.py) */
const WEIGHTS = { exposure: 0.40, deadline: 0.30, history: 0.20, quickwin: 0.10 };
const EXPOSURE_CEILING = 100000.0;
const SLA_WINDOW = 90;

function scoreCase(c) {
  let atStake = 0, settled = 0;
  try {
    const recon = reconcileCase(c.case_id);
    const combined = recon.combined || {};
    atStake = combined.priority_exposure != null
      ? combined.priority_exposure : Math.abs(recon.unexplained);
    // Rules do not "explain" anything — they decide what qualifies — so the only thing that
    // closes a difference after the fact is taxpayer evidence already on file.
    const difference = Math.abs(recon.difference);
    settled = difference <= 0.005 ? 1 : Math.min(recon.evidence_total / difference, 1);
  } catch (e) { atStake = 0; settled = 0; }
  const exposure = Math.min(atStake / EXPOSURE_CEILING, 1);
  const quickwin = settled;

  let days = null, deadline = 0;
  if (c.sla_due) {
    days = daysBetween(DEMO_TODAY, c.sla_due);
    deadline = Math.max(0, Math.min(1, 1 - days / SLA_WINDOW));
  }

  const priorFindings = DATA.cases.filter(
    (o) => o.taxpayer_id === c.taxpayer_id && o.case_id !== c.case_id && o.diff_tax_amt > 0
  ).length;
  const amended = DATA.returns.filter((r) => r.taxpayer_id === c.taxpayer_id && !r.current_flag).length;
  const history = Math.min(priorFindings * 0.5 + amended * 0.25, 1);

  const parts = { exposure, deadline, history, quickwin };
  const score = pyRound(Object.keys(WEIGHTS).reduce((s, k) => s + WEIGHTS[k] * parts[k], 0) * 100);

  let top = "exposure", best = -Infinity;
  for (const k of ["exposure", "deadline", "history", "quickwin"]) {
    const v = WEIGHTS[k] * parts[k];
    if (v > best) { best = v; top = k; }
  }
  const drivers = {
    exposure: "SAR " + Math.trunc(atStake).toLocaleString("en-US") + " at stake",
    deadline: days === null ? "no deadline" : days < 0 ? "past SLA deadline" : "due in " + days + " days",
    history: priorFindings ? priorFindings + " prior finding(s)" : "clean history",
    quickwin: Math.round(settled * 100) + "% already accounted for",
  };
  return {
    score,
    band: score >= 60 ? "high" : score >= 35 ? "medium" : "low",
    driver: drivers[top],
    signals: { exposure: r3(exposure), deadline: r3(deadline), history: r3(history), quickwin: r3(quickwin) },
    at_stake: r2(atStake),
    deadline_days: days,
    prior_findings: priorFindings,
  };
}
function r3(n) { return Math.round((n + 1e-9) * 1000) / 1000; }

/* ------------------------------------------- executive overview (routes.overview) */
function overviewData() {
  const cases = DATA.cases.filter((c) => c.status !== "closed");
  let exposure = 0, accounted = 0, differences = 0, supported = 0, findings = 0, review = 0;
  for (const c of cases) {
    let r;
    try { r = reconcileCase(c.case_id); } catch (e) { continue; }
    const combined = r.combined || {};
    differences += Math.abs(r.difference);
    accounted += r.evidence_total || 0;
    const state = combined.state != null ? combined.state : r.state;
    if (state === "potential-finding") {
      exposure += combined.total_exposure != null ? combined.total_exposure : Math.max(r.unexplained, 0);
      findings += 1;
    } else if (state === "unresolved") review += 1;
    else if (state === "supported") supported += 1;
  }
  const n = cases.length;
  return {
    open_cases: n,
    exposure_total: r2(exposure),
    difference_total: r2(differences),
    accounted_total: r2(accounted),
    auto_clearable: supported,
    auto_clearable_pct: n ? r4(supported / n) : 0,
    needs_action: findings + review,
    findings,
    to_review: review,
  };
}

function listCases() {
  const rows = DATA.cases
    .filter((c) => c.status !== "closed")
    .map((c) => {
      const tp = taxpayerById(c.taxpayer_id);
      return {
        case_id: c.case_id, taxpayer: tp.name, vat_no: tp.vat_no, sector: tp.sector,
        period: c.period_from + " → " + c.period_to,
        reason: c.reason, risk: c.risk, referral_priority: c.vat_priority,
        status: c.status, scenario: c.scenario, priority: scoreCase(c),
      };
    });
  rows.sort((a, b) => b.priority.score - a.priority.score);
  return rows;
}

/* ------------------------------------------- deterministic AI fallbacks (llm/verify.py)
   These are the ENGINE-authored drafts the real app shows when no API key is set.
   Nothing here is model output. */
function fbNarration(recon) {
  const steps = recon.funnel.filter((f) => f.kind === "exclude" || f.kind === "defer");
  const pop = recon.funnel.find((f) => f.kind === "population");
  const source = pop ? pop.label.toLowerCase() : "e-invoice lines on file";
  const removed = steps.map((f) =>
    f.count + " for " + f.label.toLowerCase() + (f.rule ? " (" + f.rule + ")" : "")).join("; ");
  const narrowing = steps.length
    ? "the rules set aside " + removed + ", leaving " + recon.counted_lines +
      " that qualify for this period"
    : "every one qualifies for this period";
  const ev = recon.evidence_total || 0;
  let tail;
  if (recon.state === "supported" && !ev) tail = "The two agree within materiality.";
  else if (ev) tail = "Taxpayer evidence accounts for " + sar(ev) + " of it, leaving " +
    sar(recon.unexplained) + " (" + recon.band + ").";
  else tail = "Nothing on file accounts for it (" + recon.band + ").";
  return "Of " + recon.population_lines + " " + source + ", " + narrowing + ", totalling " +
    sar(recon.expected_vat) + ". The return declares " + sar(recon.declared) +
    ", a difference of " + sar(recon.difference) + ". " + tail;
}

function fbNba(recon) {
  if (recon.state === "supported" || Math.abs(recon.unexplained) <= recon.materiality) {
    return {
      action_type: "no-action",
      document_requested: "None — the difference is within materiality.",
      addressed_to: "internal-review",
      rationale: "What qualifies for this period agrees with the declared box.",
      expected_yield: "Case can be closed as supported.",
      minimises_contact: true,
    };
  }
  return {
    action_type: "request-explanation",
    document_requested: "A written reconciliation of the difference for the period.",
    addressed_to: "taxpayer",
    rationale: "The qualifying e-invoices and the declared box do not agree, and nothing on file accounts for the difference.",
    expected_yield: "Confirms or clears the " + sar(recon.unexplained) + " still unaccounted for.",
    minimises_contact: false,
  };
}

function fbSummary(caseId) {
  const c = caseById(caseId);
  const tp = taxpayerById(c.taxpayer_id);
  const priorReturns = DATA.returns.filter((r) => r.taxpayer_id === tp.id);
  const priorCases = DATA.cases.filter((o) => o.taxpayer_id === tp.id && o.case_id !== caseId);
  const amended = priorReturns.filter((r) => !r.current_flag);
  const pts = ["Sector: " + (tp.sector || "n/a") + "; size: " + (tp.size || "n/a") +
    "; accounting basis: " + (tp.accounting_method || "n/a") + "."];
  if (amended.length) pts.push(amended.length + " amended return(s) on file.");
  if (priorCases.length) pts.push(priorCases.length + " prior audit case(s) for this taxpayer.");
  while (pts.length < 2) pts.push("Limited prior history available.");
  return {
    headline: "Auditor brief assembled from profile and prior filings (deterministic).",
    points: pts.slice(0, 5),
    risk_flags: amended.length > 1 ? ["Repeated amendments"] : [],
    prior_pattern: priorCases.length ? "Recurring adjustments across periods." : "No prior audit findings recorded.",
  };
}

function fbReport(recon) {
  const concl = recon.state === "supported"
    ? "What qualifies for this period agrees with the declared box within materiality; the case is **supported** with no further action."
    : sar(recon.unexplained) + " (" + recon.band + ") is still unaccounted for; the case is a **potential finding** pending evidence.";
  const steps = recon.funnel.filter((f) => f.kind === "exclude" || f.kind === "defer")
    .map((f) => "- " + f.label + ": " + f.count + " document(s), " + sar(f.amount) +
      (f.rule ? " [" + f.rule + "]" : "")).join("\n") ||
    "- No rule removed any document from the population.";
  const ev = (recon.evidence || []).map((e) => "- " + e.label + ": " + sar(e.amount)).join("\n");
  return "## Case summary\n" + recon.counted_lines + " of " + recon.population_lines +
    " documents qualify for " + recon.box + " in this period, totalling " +
    sar(recon.expected_vat) + ". The return declares " + sar(recon.declared) + ".\n\n" +
    "## Which documents qualify\n" + steps + "\n\n" +
    "## Comparison\n" +
    "- Expected (qualifying e-invoices): " + sar(recon.expected_vat) + "\n" +
    "- Declared (as filed): " + sar(recon.declared) + "\n" +
    "- Difference: " + sar(recon.difference) + "\n" +

}

/* How the population narrowed to the qualifying set.

   A waterfall walks deductions from one total to another, which is why the old version
   needed a "before" figure that did not exist. This says what actually happened: this many
   documents on file, these rules removed these ones for these reasons, this many are left,
   and they total this. The bars measure DOCUMENTS, not money. */
function provenanceView(d) {
  if (d.population_source !== "document") return "";
  return '<div class="provenance' + (d.population_complete ? "" : " warn") + '">' +
    '<span class="ct">source</span> Built from <b>' + esc(d.population_document) + '</b> — the ' +
    'listing the taxpayer supplied, not the Authority\u2019s e-invoice feed.' +
    (d.population_complete ? "" : '<div class="prov-caveat">' + esc(d.population_caveat) + '</div>') +
    '</div>';
}

function funnelView(d, source) {
  const start2 = d.funnel.find((f) => f.kind === "population");
  const endStep = d.funnel.find((f) => f.kind === "qualified");
  const steps = d.funnel.filter((f) => f.kind === "exclude" || f.kind === "defer");
  const max = Math.max(start2 ? start2.count : 1, 1);

  const row = (f, remaining, key) =>
    '<div class="frow clickable ' + f.kind + '" role="button" tabindex="0" ' +
    'data-drill="' + esc(source + "|" + key) + '" data-title="' + esc(f.label) + '" ' +
    'data-amount="' + f.amount + '">' +
    '<div class="fcount">' + (f.kind === "exclude" || f.kind === "defer" ? "−" : "") + f.count + '</div>' +
    '<div class="flbl">' + (f.rule ? '<span class="rc">' + esc(f.rule) + '</span>' : "") +
    esc(f.label) + '<span class="rowhint">›</span></div>' +
    '<div class="ftrack"><div class="fbar ' + f.kind + '" style="width:' +
    ((remaining / max) * 100) + '%"></div></div>' +
    '<div class="famt ' + f.kind + '">' + esc(sar(f.amount)) + '</div></div>';

  let remaining = start2 ? start2.count : 0;
  let html = '<div class="funnel">';
  if (start2) html += row(start2, remaining, "population");
  for (const f of steps) {
    remaining -= f.count;
    html += row(f, remaining, "step:" + (f.rule || f.stage));
  }
  if (endStep) html += row(endStep, endStep.count, "qualified");
  if (d.composition.length) {
    html += '<div class="fcomp">' + d.composition.map((c) =>
      '<button class="fchip" data-drill="' + esc(source + "|comp:" + c.type_code) + '" ' +
      'data-title="' + esc(c.label) + '" data-amount="' + c.amount + '">' +
      '<b>' + c.count + '</b> ' + esc(c.label.toLowerCase()) +
      '<span' + (c.amount < 0 ? ' class="neg"' : "") + '>' + (c.amount < 0 ? "−" : "") +
      esc(sar(c.amount)) + '</span></button>').join("") + '</div>';
  }
  return html + '</div>';
}

function renderMd(text) {
  const bold = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const out = [];
  let list = [];
  const flush = () => { if (list.length) { out.push("<ul>" + list.map((l) => "<li>" + bold(l) + "</li>").join("") + "</ul>"); list = []; } };
  text.split("\n").forEach((ln) => {
    if (ln.startsWith("## ")) { flush(); out.push("<h4>" + esc(ln.slice(3)) + "</h4>"); }
    else if (ln.startsWith("- ")) list.push(ln.slice(2));
    else if (ln.trim() === "") flush();
    else { flush(); out.push("<p>" + bold(ln) + "</p>"); }
  });
  flush();
  return out.join("");
}

/* ============================================================ the case lifecycle
   The portal's rule: **port what the user can change, embed what they cannot.**
   Toggling a rule or recording a taxpayer response moves the reconciliation, the priority
   and the investigation, so those are ported to JS above. The dossier, precedent and the
   seeded correspondence round cannot move here — there is no backend to upload a file to and
   no corpus to re-search — so the Python output is embedded exactly. The lifecycle rail sits
   between the two: it reads the *live* reconciliation, so it is computed here. */

function caseTabs(id, tab) {
  const T = [

    ["reconciliation", "/reconciliation", "Reconciliation", "What qualifies, and what it means"],
  ];
  return '<div class="casetabs">' + T.map(([key, suffix, label, hint]) =>
    '<a class="casetab' + (key === tab ? " active" : "") + '" href="#/cases/' +
    encodeURIComponent(id) + suffix + '"><b>' + label + '</b><small>' + hint + '</small></a>'
  ).join("") + '</div>';
}

/* Mirror of backend/app/casefile/orchestrator.py — derived from the case's own data, so it
   cannot drift from the reconciliation the same page is showing. */
function lifecycle(id) {
  const MARK = { done: "✓", active: "▶", waiting: "⧗", pending: "", skipped: "—" };
  const work = (DATA.casework || {})[id] || {};
  const loop = work.loop || { round: 0, rounds: [], blocking: 0, complete: false };
  const dossier = (DATA.dossiers || {})[id] || { sources: [], referral: {} };
  let recon = null;
  try { recon = reconcileCase(id); } catch (e) { recon = null; }

  const settled = recon && Math.abs(recon.unexplained) <= recon.materiality &&
    (!recon.purchase || recon.purchase.state !== "potential-finding");
  const held = (dossier.sources || []).filter((x) => x.held).length;
  const stages = [];

  stages.push({ key: "intake", label: "Intake", state: "done", owner: "system",
    summary: held + " of " + (dossier.sources || []).length + " internal sources on file." });

  const started = loop.round > 0;
  if (!started && settled) {
    stages.push({ key: "planning", label: "Planning", state: "skipped", owner: "auditor",
      summary: "Not needed — the internal evidence settles the case." });
    stages.push({ key: "correspondence", label: "Request & response", state: "skipped",
      owner: "taxpayer", summary: "Not needed — the taxpayer was never contacted." });
  } else if (!started) {
    stages.push({ key: "planning", label: "Planning", state: "active", owner: "auditor",
      summary: "No information request has been drafted yet.",
      next_action: "Review the plan and draft the request." });
    stages.push({ key: "correspondence", label: "Request & response", state: "pending",
      owner: "taxpayer", summary: "Not started." });
  } else {
    const cur = loop.rounds[loop.rounds.length - 1];
    stages.push({ key: "planning", label: "Planning", state: "done", owner: "auditor",
      summary: loop.rounds[0].items.length + " items requested in round 1." });
    if (loop.complete) {
      stages.push({ key: "correspondence", label: "Request & response", state: "done",
        owner: "taxpayer",
        summary: "Satisfied after " + loop.round + " round" + (loop.round === 1 ? "" : "s") + "." });
    } else if (cur.status === "issued") {
      stages.push({ key: "correspondence", label: "Request & response", state: "waiting",
        owner: "taxpayer", summary: "Round " + cur.seq + " issued; awaiting the response.",
        next_action: "Waiting on the taxpayer." });
    } else {
      stages.push({ key: "correspondence", label: "Request & response", state: "active",
        owner: "auditor",
        summary: "Round " + cur.seq + " answered, but " + loop.blocking +
          " item" + (loop.blocking === 1 ? "" : "s") + " fall short of the request.",
        next_action: "Send the drafted follow-up, or waive what is not needed." });
    }
  }

  const loopDone = settled || loop.complete;
  if (!recon) {
    stages.push({ key: "review", label: "Substantive review", state: "pending", owner: "auditor",
      summary: "No return on file to reconcile." });
  } else if (settled) {
    stages.push({ key: "review", label: "Substantive review", state: "done", owner: "auditor",
      summary: "Supported by the qualified evidence within materiality." });
  } else if (loop.complete) {
    stages.push({ key: "review", label: "Substantive review", state: "active", owner: "auditor",
      summary: money(recon.unexplained) + " unexplained with the evidence complete.",
      next_action: "Validate the leading hypothesis and reach a conclusion." });
  } else {
    stages.push({ key: "review", label: "Substantive review", state: "active", owner: "auditor",
      summary: money(recon.unexplained) + " unexplained on internal data — provisional until the " +
        "response is complete.",
      next_action: "Continue the review; do not conclude until the response is complete." });
  }

  if (loopDone && recon) {
    stages.push({ key: "closure", label: "Closure", state: "active", owner: "auditor",
      summary: "Ready to draft the audit report and the taxpayer letter.",
      next_action: "Review the drafts and approve." });
  } else {
    stages.push({ key: "closure", label: "Closure", state: "pending", owner: "auditor",
      summary: "Opens once the review can conclude." });
  }

  const current = stages.find((x) => x.state === "active" || x.state === "waiting") ||
    stages[stages.length - 1];
  return { stages: stages, current: current, MARK: MARK,
    noContact: stages.some((x) => x.key === "correspondence" && x.state === "skipped") };
}

function lifecycleRail(id) {
  const L = lifecycle(id);
  return '<div class="rail"><div class="rail-track">' +
    L.stages.map((x) => '<div class="rail-stage ' + x.state + '" title="' + esc(x.summary) +
      '"><span class="rs-mark">' + L.MARK[x.state] + '</span>' +
      '<span class="rs-label">' + esc(x.label) + '</span></div>').join("") +
    '</div><div class="rail-note">' +
    (L.noContact ? '<span class="pill pri-low">Cleared without contacting the taxpayer</span>' : "") +
    '<span class="sub"><b>' + esc(L.current.label) + '</b>' +
    (L.current.next_action ? " — " + esc(L.current.next_action) : "") +
    (L.current.owner === "taxpayer" && L.current.state === "waiting"
      ? " (waiting on the taxpayer)" : "") +
    '</span></div></div>';
}

  const fin = (b.financials || {});

      '<span class="pill">' + esc(tp.size) + '</span><span class="pill">' + esc(tp.sector) + '</span>' +

    caseTabs(caseId, "dossier") + lifecycleRail(caseId) +

    '<div class="panel"><div class="panel-head"><h2>Why this case was raised</h2>' +

    '</div><div class="panel-body"><p class="brief-head">' + esc(r.indicator_label) + '</p>' +

      'on the human side of the line.</p>' +
      ((tp.related_parties || []).length ? '<h4>Related parties</h4><ul class="acts">' +

      '<h4>Financial information held</h4>' + finTable + '</div></div>' +
    '</div>' +

    '<div class="grid-2">' +
      '<div class="panel"><div class="panel-head"><h2>Imports and exports</h2>' +
        (cus.in_period != null ? '<span class="sub">' + cus.in_period +
          ' declarations in the period</span>' : "") +
      '</div><div class="panel-body">' + cusPanel + '</div></div>' +
      '<div class="panel"><div class="panel-head"><h2>E-invoices in the period</h2>' +
        '<span class="sub">' + num(einv.count || 0) + ' documents</span></div>' +

      'once qualification rules run, is the Reconciliation tab.</p></div></div>' +
    '</div>' +

    precedentPanel(caseId) +

}

/* ------------------------------------------------------------------ precedent */
function precedentPanel(caseId) {
  const brief = (DATA.precedents || {})[caseId];
  if (!brief) return "";
  const s = brief.summary;
  const pct = (n) => (n % 1 ? n.toFixed(1) : n) + "%";
  const noF = (s.outcomes || []).find((o) => o.key === "NO_FINDING");
  const fnd = (s.outcomes || []).find((o) => o.key === "FINDING");

  const tally = (rows, warn) => '<ul class="tally">' + rows.slice(0, 4).map((r) =>
    '<li><code>' + esc(r.key) + '</code><span class="meter"><i' + (warn ? ' class="warn"' : "") +
    ' style="width:' + r.pct + '%"></i></span><b>' + pct(r.pct) + '</b></li>').join("") + '</ul>';

  return '<div class="panel"><div class="panel-head">' +
    '<div class="ai-h"><span class="chip-det">Deterministic</span><h2>Precedent</h2></div>' +
    '<span class="sub">' + s.comparable + ' comparable closed case' +
      (s.comparable === 1 ? "" : "s") + (s.widened ? " · search widened" : "") + '</span>' +
    '</div><div class="panel-body">' +
    '<p class="detail-note" style="margin-top:0">When the risk engine raised <b>' +
      esc(s.indicator_label) + '</b> before, on taxpayers of a similar sector, size and filing ' +
      'record:</p>' +
    (noF && fnd ? '<div class="outcome-bar">' +
      '<div class="ob-seg ob-clear" style="width:' + noF.pct + '%">' +
        (noF.pct >= 18 ? '<span>' + pct(noF.pct) + ' no finding</span>' : "") + '</div>' +
      '<div class="ob-seg ob-finding" style="width:' + fnd.pct + '%">' +
        (fnd.pct >= 18 ? '<span>' + pct(fnd.pct) + ' finding</span>' : "") + '</div></div>' : "") +
    '<div class="prec-grid"><div><h4>Where they were explained</h4>' +
      tally(s.explained_by || [], false) + '</div>' +
      '<div><h4>Where a finding was raised</h4>' + tally(s.caused_by || [], true) + '</div></div>' +
    '<h4>What actually closed them</h4>' +
    '<p class="detail-note" style="margin-top:0">Ranked by how often an item was the evidence ' +
      'that settled the case — not by how often it was asked for.</p>' +
    '<div class="tablescroll"><table class="inv-table"><thead><tr><th>Evidence</th>' +
      '<th style="text-align:right">Requested in</th><th style="text-align:right">Decisive in</th>' +
      '<th style="width:110px">Hit rate</th></tr></thead><tbody>' +
      (s.evidence || []).map((e) => '<tr><td>' + esc(e.label) + '</td>' +
        '<td class="mono" style="text-align:right">' + e.requested + '</td>' +
        '<td class="mono" style="text-align:right">' + e.decisive + '</td>' +
        '<td><span class="meter"><i style="width:' + e.decisive_rate + '%"></i></span>' +
        '<span class="sub"> ' + pct(e.decisive_rate) + '</span></td></tr>').join("") +
      '</tbody></table></div>' +
    '<div class="prec-facts">' +
      (s.effort && s.effort.median_rounds != null ? '<div><span class="k">Typical effort</span>' +
        '<span class="v">' + s.effort.median_rounds + ' rounds · ' +
        s.effort.median_days_to_close + ' days</span></div>' : "") +
      (s.effort && s.effort.single_round_pct != null ?
        '<div><span class="k">Closed in one round</span><span class="v">' +
        pct(s.effort.single_round_pct) + '</span></div>' : "") +
      (s.assessed && s.assessed.median != null ?
        '<div><span class="k">Median assessment</span><span class="v">' +
        money(s.assessed.median) + '</span></div>' : "") +
    '</div>' +
    (s.recurrence ? '<div class="callout warn"><b>This taxpayer is in the comparable set.</b> ' +
      (s.recurrence.findings > 0
        ? s.recurrence.cases + ' closed case(s), ' + s.recurrence.findings + ' with a finding (' +
          s.recurrence.root_causes.join(", ") + ') — ' + s.recurrence.case_ids.join(", ") +
          '. Rule the earlier cause out first.'
        : s.recurrence.cases + ' closed case(s), none of which resulted in a finding.') +
      '</div>' : "") +
    '</div></div>';
}

/* ------------------------------------------------------------------ casework */
const GAP_LABEL = {
  "missing-item": "Nothing supplied", "wrong-document": "Wrong document",
  "missing-column": "Missing column", "empty-mandatory-field": "Blank mandatory field",
  "wrong-period": "Period not covered", "arithmetic-mismatch": "Does not add up",
  "wrong-format": "Wrong format", "unrequested-document": "Not requested",
  "too-vague": "Too vague",
};
const ITEM_STATUS = { outstanding: "pri-high", received: "pri-medium", satisfied: "pri-low", waived: "" };

function letterPanel(title, draft) {
  if (!draft || !draft.text) return "";
  return '<div class="panel ai-panel"><div class="panel-head">' +
    '<div class="ai-h"><span class="ai-chip">AI</span><h2>' + esc(title) + '</h2></div>' +
    '<div class="chips">' + verifyBadge(draft.source) + '</div></div>' +
    '<div class="panel-body"><pre class="letterpre">' + esc(draft.text) + '</pre>' +
    '<p class="detail-note">A draft for the auditor to edit and approve. Nothing is sent from ' +
    'here. Every figure in the letter was established by the engine — the model may repeat one ' +
    'and may not introduce one.</p></div></div>';
}

function viewCasework(caseId) {
  const work = (DATA.casework || {})[caseId];
  if (!work) return '<div class="page"><div class="panel"><div class="notice err">No casework ' +
    'for ' + esc(caseId) + '.</div></div></div>';
  const plan = work.plan, loop = work.loop;
  const started = loop.round > 0;

  const planItems = (list, dropped) => '<div class="planlist">' + list.map((p) =>
    '<div class="planitem' + (dropped ? " dropped" : "") + '"><div class="pi-head"><b>' +
    esc(p.label) + '</b>' + (dropped ? "" : '<span class="pill">' + esc(p.kind) + '</span>' +
      (p.decisive_rate != null ? '<span class="pill pri-low">' + p.decisive_rate +
        '% decisive</span>' : "")) + '</div><p class="sub">' + esc(p.reason) + '</p>' +
    (!dropped && (p.required_columns || []).length ? '<p class="cols"><span class="k">' +
      p.required_columns.length + ' columns</span>' +
      p.required_columns.map((x) => '<code>' + esc(x) + '</code>').join("") + '</p>' : "") +
    '</div>').join("") + '</div>';

  const gapsFor = (gaps) => {
    if (!gaps.length) return '<p class="muted">Nothing outstanding — the response meets the ' +
      'request.</p>';
    const groups = {};
    const order = [];
    gaps.forEach((g) => {
      const k = g.item_label || "Other";
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(g);
    });
    return '<div class="gaps">' + order.map((k) => '<div class="gapgroup"><h4>' + esc(k) +
      '</h4>' + groups[k].map((g) => '<div class="gap ' + g.severity + '">' +
        '<span class="pill ' + (g.severity === "blocking" ? "pri-high" : "pri-medium") + '">' +
        esc(GAP_LABEL[g.kind] || g.kind) + '</span><div><p>' + esc(g.detail) + '</p>' +
        (g.citation ? '<small class="mono">' + esc(g.citation) + '</small>' : "") +
        '</div></div>').join("") + '</div>').join("") + '</div>';
  };

  const rounds = (loop.rounds || []).map((r) => {
    const docs = (loop.documents || []).filter((x) => x.round === r.seq);
    return '<div class="panel"><div class="panel-head"><h2>Round ' + r.seq + '</h2>' +
      '<div class="chips"><span class="pill ' +
        (r.status === "satisfied" ? "pri-low" : "pri-medium") + '">' + esc(r.status) + '</span>' +
        (r.issued_at ? '<span class="sub">issued ' + esc(r.issued_at) + '</span>' : "") +
        (r.answered_at ? '<span class="sub">answered ' + esc(r.answered_at) + '</span>' : "") +
      '</div></div><div class="panel-body">' +
      '<div class="tablescroll"><table class="inv-table"><thead><tr><th style="width:34px">#</th>' +
        '<th>Requested</th><th>Format</th><th>Status</th></tr></thead><tbody>' +
        r.items.map((it) => '<tr><td class="mono">' + it.seq + '</td><td><b>' + esc(it.label) +
          '</b>' + ((it.required_columns || []).length ? '<div class="sub">' +
            it.required_columns.length + ' columns: ' + it.required_columns.map(esc).join(", ") +
            '</div>' : "") + '</td><td class="mono">' + esc(it.expected_format || "—") + '</td>' +
          '<td><span class="pill ' + (ITEM_STATUS[it.status] || "") + '">' + esc(it.status) +
          '</span></td></tr>').join("") + '</tbody></table></div>' +
      '<h4>What arrived</h4>' +
      (docs.length ? '<div class="tablescroll"><table class="inv-table"><thead><tr><th>File</th>' +
        '<th>Answers</th><th style="text-align:right">Rows</th><th>Columns found</th>' +
        '<th>Covers</th></tr></thead><tbody>' + docs.map((x) => {
          const it = r.items.find((i) => i.id === x.request_item_id);
          return '<tr' + (x.superseded ? ' class="dim"' : "") + '><td class="mono">' +
            esc(x.filename) + (x.superseded ? ' <span class="sub">· superseded</span>' : "") +
            '</td><td class="sub">' + esc(it ? it.label : "not linked") + '</td>' +
            '<td class="mono" style="text-align:right">' + (x.row_count || "—") + '</td>' +
            '<td class="sub">' + esc((x.raw_headers || []).join(", ") || x.note || "—") + '</td>' +
            '<td class="mono sub">' + (x.period_from ? esc(x.period_from) + " → " +
              esc(x.period_to) : "—") + '</td></tr>';
        }).join("") + '</tbody></table></div>'
        : '<p class="muted">Nothing received for this round yet.</p>') +
      '<h4>Requested versus received' + (r.gaps.length ? ' <span class="sub">· ' + r.gaps.length +
        ' findings</span>' : "") + '</h4>' + gapsFor(r.gaps) +
      '<p class="detail-note">Column presence, blank mandatory fields, period coverage and ' +
      'whether the stated totals add up are checks, not judgement — they run deterministically, ' +
      'with no model involved. A column the taxpayer named differently is resolved, not ' +
      'reported: flagging “Invoice No.” as missing would put a false accusation in the letter ' +
      'below.</p></div></div>';
  }).join("");

  const last = (loop.rounds || [])[loop.rounds.length - 1];
  return '<div class="page">' +
    '<header class="page-head"><div><h1>Casework</h1><p class="sub">' + esc(caseId) +
      ' · what we asked for, what arrived, and what is still missing</p></div>' +
      (started ? '<div class="chips"><span class="pill ' +
        (loop.complete ? "pri-low" : "pri-high") + '">Round ' + loop.round + '</span>' +
        '<span class="pill">' + esc(loop.status) + '</span>' +
        (loop.complete ? "" : '<span class="pill pri-high">' + loop.blocking +
          ' blocking</span>') + '</div>' : "") +
    '</header>' + caseTabs(caseId, "casework") + lifecycleRail(caseId) +

    '<div class="panel"><div class="panel-head">' +
      '<div class="ai-h"><span class="chip-det">Deterministic</span><h2>What to ask for</h2></div>' +
      '<span class="sub">' + plan.items.length + ' items · ' + plan.dropped.length +
      ' dropped</span></div><div class="panel-body">' +
      (plan.notes || []).map((n) => '<p class="detail-note">' + esc(n) + '</p>').join("") +
      '<h4>Requesting</h4>' + planItems(plan.items, false) +
      (plan.dropped.length ? '<h4>Not requesting</h4>' + planItems(plan.dropped, true) +
        '<p class="detail-note">The auditors do not request information the Authority already ' +
        'holds. Here that is mechanical rather than remembered — and the reason stays visible, ' +
        'so the decision can be checked rather than trusted.</p>' : "") +
      (started ? "" : '<p class="detail-note">No request has been issued on this case. In the ' +
        'live app the auditor approves this plan and the letter is drafted from it.</p>') +
    '</div></div>' + rounds +
    (last && last.body ? letterPanel("Round " + last.seq + " — information request",
      { text: last.body, source: last.body_source }) : "") +
    (work.followup ? letterPanel("Follow-up — outstanding items only", work.followup) : "") +
    (loop.complete && started ? '<div class="callout ok"><b>The response meets the request.</b> ' +
      'Nothing blocking remains, so the substantive review can open.</div>' : "") +
  '</div>';
}
