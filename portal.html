function waterfall(d, source) {
  const max = Math.max(d.reconstructed_gross, d.declared, 1);
  const explains = d.bridge.filter((b) => b.kind === "explain").map((b) => {
    const idx = d.bridge.findIndex((x) => x.seq === b.seq);
    return { rule: b.rule, label: b.label, amount: b.amount, before: d.bridge[idx - 1].running, after: b.running };
  });
  const rows = [
    { title: "Reconstructed from e-invoices", kind: "recon", start: 0, end: d.reconstructed_gross, amount: d.reconstructed_gross, key: "gap" },
    ...explains.map((e) => ({ title: e.label, rule: e.rule, kind: "explain", start: e.after, end: e.before, amount: e.amount, key: "explain:" + e.rule })),
    { title: "Declared by the taxpayer", kind: "declared", start: 0, end: d.declared, amount: d.declared, key: "anchor" },
    { title: "Unexplained residual", kind: "residual", start: d.declared, end: d.declared + d.residual, amount: d.residual, key: "residual" },
  ];

  return '<div class="bridge">' + rows.map((r) => {
    const left = (Math.min(r.start, r.end) / max) * 100;
    const width = Math.max((Math.abs(r.end - r.start) / max) * 100, 0.5);
    const sign = r.amount < 0 ? "−" : r.kind === "residual" && r.amount > 0 ? "+" : "";
    return '<div class="brow clickable" role="button" tabindex="0" data-drill="' + esc(source + "|" + r.key) + '" ' +
      'data-title="' + esc(r.title) + '" data-amount="' + r.amount + '">' +
      '<div class="lbl">' + (r.rule ? '<span class="rc">' + esc(r.rule) + '</span>' : "") + esc(r.title) +
      '<span class="rowhint">›</span></div>' +
      '<div class="track"><div class="bar ' + r.kind + '" style="left:' + left + '%;width:' + width + '%"></div></div>' +
      '<div class="amt ' + r.kind + '">' + sign + esc(sar(r.amount)) + '</div></div>';
  }).join("") + '</div>';
}

function verifyBadge(source) {
  if (source === null) return '<span class="pill">AI writing…</span>';
  if (source === "claude" || source === "engine-override")
    return '<span class="pill pri-low" title="Every figure traces to the reconciliation engine.">✓ Figures verified</span>';
  if (source === "deterministic-fallback")
    return '<span class="pill status" title="Written by the deterministic engine — no model configured.">∑ Engine-drafted</span>';
  if (source === "pdpl-fallback")
    return '<span class="pill status" title="Hosted model not called on non-synthetic data (PDPL). The engine wrote this.">∑ Engine-drafted (PDPL)</span>';
  if (source === "blocked-refusal")
    return '<span class="pill pri-medium" title="The model declined; showing deterministic draft.">Model declined</span>';
  if (source === "api-error" || source === "stream-error")
    return '<span class="pill pri-high" title="AI call failed — check configuration.">⚠ AI unavailable — misconfigured</span>';
  return '<span class="pill pri-high">⚠ AI output withheld — deterministic draft</span>';
}

function renderMd(text) {
  const bold = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const out = [];
  let list = [];
  const flush = () => { if (list.length) { out.push("<ul>" + list.map((l) => "<li>" + bold(l) + "</li>").join("") + "</ul>"); list = []; } };
  text.split("\n").forEach((ln) => {
    if (ln.startsWith("## ")) { flush(); out.push("<h4>" + esc(ln.slice(3)) + "</h4>"); }
    else if (ln.startsWith("- ")) list.push(ln.slice(2));
    else if (ln.trim() === "") flush();
    else { flush(); out.push("<p>" + bold(ln) + "</p>"); }
  });
  flush();
  return out.join("");
}

/* ============================================================ the case lifecycle
   The portal's rule: **port what the user can change, embed what they cannot.**
   Toggling a rule or recording a taxpayer response moves the reconciliation, the priority
   and the investigation, so those are ported to JS above. The dossier, precedent and the
   seeded correspondence round cannot move here — there is no backend to upload a file to and
   no corpus to re-search — so the Python output is embedded exactly. The lifecycle rail sits
   between the two: it reads the *live* reconciliation, so it is computed here. */

function caseTabs(id, tab) {
  const T = [
    ["dossier", "", "Dossier", "What ZATCA already holds"],
    ["casework", "/casework", "Casework", "Request, response, gaps"],
    ["reconciliation", "/reconciliation", "Reconciliation", "Bridge and investigation"],
  ];
  return '<div class="casetabs">' + T.map(([key, suffix, label, hint]) =>
    '<a class="casetab' + (key === tab ? " active" : "") + '" href="#/cases/' +
    encodeURIComponent(id) + suffix + '"><b>' + label + '</b><small>' + hint + '</small></a>'
  ).join("") + '</div>';
}

/* Mirror of backend/app/casefile/orchestrator.py — derived from the case's own data, so it
   cannot drift from the reconciliation the same page is showing. */
function lifecycle(id) {
  const MARK = { done: "✓", active: "▶", waiting: "⧗", pending: "", skipped: "—" };
  const work = (DATA.casework || {})[id] || {};
  const loop = work.loop || { round: 0, rounds: [], blocking: 0, complete: false };
  const dossier = (DATA.dossiers || {})[id] || { sources: [], referral: {} };
  let recon = null;
  try { recon = reconcileCase(id); } catch (e) { recon = null; }

  const settled = recon && Math.abs(recon.residual) <= recon.materiality &&
    (!recon.purchase || recon.purchase.state !== "potential-finding");
  const held = (dossier.sources || []).filter((x) => x.held).length;
  const stages = [];

  stages.push({ key: "intake", label: "Intake", state: "done", owner: "system",
    summary: held + " of " + (dossier.sources || []).length + " internal sources on file." });

  const started = loop.round > 0;
  if (!started && settled) {
    stages.push({ key: "planning", label: "Planning", state: "skipped", owner: "auditor",
      summary: "Not needed — the internal evidence settles the case." });
    stages.push({ key: "correspondence", label: "Request & response", state: "skipped",
      owner: "taxpayer", summary: "Not needed — the taxpayer was never contacted." });
  } else if (!started) {
    stages.push({ key: "planning", label: "Planning", state: "active", owner: "auditor",
      summary: "No information request has been drafted yet.",
      next_action: "Review the plan and draft the request." });
    stages.push({ key: "correspondence", label: "Request & response", state: "pending",
      owner: "taxpayer", summary: "Not started." });
  } else {
    const cur = loop.rounds[loop.rounds.length - 1];
    stages.push({ key: "planning", label: "Planning", state: "done", owner: "auditor",
      summary: loop.rounds[0].items.length + " items requested in round 1." });
    if (loop.complete) {
      stages.push({ key: "correspondence", label: "Request & response", state: "done",
        owner: "taxpayer",
        summary: "Satisfied after " + loop.round + " round" + (loop.round === 1 ? "" : "s") + "." });
    } else if (cur.status === "issued") {
      stages.push({ key: "correspondence", label: "Request & response", state: "waiting",
        owner: "taxpayer", summary: "Round " + cur.seq + " issued; awaiting the response.",
        next_action: "Waiting on the taxpayer." });
    } else {
      stages.push({ key: "correspondence", label: "Request & response", state: "active",
        owner: "auditor",
        summary: "Round " + cur.seq + " answered, but " + loop.blocking +
          " item" + (loop.blocking === 1 ? "" : "s") + " fall short of the request.",
        next_action: "Send the drafted follow-up, or waive what is not needed." });
    }
  }

  const loopDone = settled || loop.complete;
  if (!recon) {
    stages.push({ key: "review", label: "Substantive review", state: "pending", owner: "auditor",
      summary: "No return on file to reconcile." });
  } else if (settled) {
    stages.push({ key: "review", label: "Substantive review", state: "done", owner: "auditor",
      summary: "Supported by the qualified evidence within materiality." });
  } else if (loop.complete) {
    stages.push({ key: "review", label: "Substantive review", state: "active", owner: "auditor",
      summary: money(recon.residual) + " unexplained with the evidence complete.",
      next_action: "Validate the leading hypothesis and reach a conclusion." });
  } else {
    stages.push({ key: "review", label: "Substantive review", state: "active", owner: "auditor",
      summary: money(recon.residual) + " unexplained on internal data — provisional until the " +
        "response is complete.",
      next_action: "Continue the review; do not conclude until the response is complete." });
  }

  if (loopDone && recon) {
    stages.push({ key: "closure", label: "Closure", state: "active", owner: "auditor",
      summary: "Ready to draft the audit report and the taxpayer letter.",
      next_action: "Review the drafts and approve." });
  } else {
    stages.push({ key: "closure", label: "Closure", state: "pending", owner: "auditor",
      summary: "Opens once the review can conclude." });
  }

  const current = stages.find((x) => x.state === "active" || x.state === "waiting") ||
    stages[stages.length - 1];
  return { stages: stages, current: current, MARK: MARK,
    noContact: stages.some((x) => x.key === "correspondence" && x.state === "skipped") };
}

function lifecycleRail(id) {
  const L = lifecycle(id);
  return '<div class="rail"><div class="rail-track">' +
    L.stages.map((x) => '<div class="rail-stage ' + x.state + '" title="' + esc(x.summary) +
      '"><span class="rs-mark">' + L.MARK[x.state] + '</span>' +
      '<span class="rs-label">' + esc(x.label) + '</span></div>').join("") +
    '</div><div class="rail-note">' +
    (L.noContact ? '<span class="pill pri-low">Cleared without contacting the taxpayer</span>' : "") +
    '<span class="sub"><b>' + esc(L.current.label) + '</b>' +
    (L.current.next_action ? " — " + esc(L.current.next_action) : "") +
    (L.current.owner === "taxpayer" && L.current.state === "waiting"
      ? " (waiting on the taxpayer)" : "") +
    '</span></div></div>';
}

      '<td>' + esc(x.goods) + ' <span class="sub">· HS ' + esc(x.hs_chapter) + '</span></td>' +
      '<td class="mono" style="text-align:right">' + money(x.customs_value) + '</td>' +
      '<td class="mono" style="text-align:right">' + (x.vat_paid ? money(x.vat_paid) : "—") + '</td></tr>').join("") +
    '</tbody></table></div><p class="detail-note">Held internally, so import declarations are ' +
    'never requested from the taxpayer.</p>'
    : '<p class="muted">No customs movements on file for this taxpayer.</p>';

  const einv = (b["e-invoices"] || {});
  const einvTable = '<div class="tablescroll"><table class="inv-table"><thead><tr>' +

    (einv.groups || []).map((g) => '<tr><td>' + esc(g.direction) + '</td><td class="mono">' +
      g.type_code + '</td><td>' + esc(g.status) + '</td>' +
      '<td class="mono" style="text-align:right">' + g.count + '</td>' +
      '<td class="mono" style="text-align:right">' + money(g.vat) + '</td></tr>').join("") +
    '</tbody></table></div>';

  return '<div class="page">' +
    '<header class="page-head"><div><h1>' + esc(tp.name) + '</h1><p class="sub">' +
      esc(d.case_id) + ' · ' + esc(d.period_from) + ' → ' + esc(d.period_to) + ' · ' +
      esc(d.audit_type) + ' audit</p></div><div class="chips">' +
      '<span class="pill">' + esc(tp.size) + '</span><span class="pill">' + esc(tp.sector) + '</span>' +
      (tp.importer ? '<span class="pill">Importer</span>' : "") +
      (tp.exporter ? '<span class="pill">Exporter</span>' : "") +
      (tp.pos_registered ? '<span class="pill">POS</span>' : "") +
    '</div></header>' +
    caseTabs(caseId, "dossier") + lifecycleRail(caseId) +

    '<div class="panel"><div class="panel-head"><h2>Why this case was raised</h2>' +
      (r.score != null ? '<span class="sub">Risk score ' + r.score +
        (r.threshold ? ' · threshold ' + r.threshold : "") + '</span>' : "") +
    '</div><div class="panel-body"><p class="brief-head">' + esc(r.indicator_label) + '</p>' +
      (r.narrative ? '<p class="detail-note">' + esc(r.narrative) + '</p>' : "") + signals +
      ((r.consult_first || []).length ? '<p class="detail-note"><b>Consult first:</b> ' +
        r.consult_first.map(esc).join(", ") + '. The risk engine is upstream — this is its ' +
        'output, not our reconstruction.</p>' : "") +
    '</div></div>' +

    '<div class="panel"><div class="panel-head"><h2>What ZATCA already holds</h2>' +
      '<span class="sub">' + held + ' of ' + (d.sources || []).length + ' sources on file</span>' +
    '</div><div class="panel-body">' + sources +
      '<p class="detail-note">Anything marked on file is <b>not requested from the taxpayer</b>. ' +
      'The Casework tab shows each item dropped for that reason.</p></div></div>' +

    '<div class="grid-2">' +
      '<div class="panel"><div class="panel-head"><h2>Who this taxpayer is</h2></div>' +
      '<div class="panel-body">' + kvBlock([
        ["VAT registration", '<span class="mono">' + esc(tp.vat_no) + '</span>'],
        ["Legal form", esc(tp.legal_form || tp.bp_type)],
        ["Registered", tp.registered_from ? esc(tp.registered_from) +
          (tp.registered_years ? " · " + tp.registered_years + " yrs" : "") : null],
        ["E-invoicing since", tp.einvoicing_onboarded ? esc(tp.einvoicing_onboarded) : null],
        ["Size", esc(tp.size)], ["Employees", num(tp.employees)],
        ["Branches", num(tp.branches)], ["Accounting", esc(tp.accounting_method)],
      ]) + '<h4>Registered economic activities</h4>' + acts +
      '<p class="detail-note">What the business is registered to do is the reference point for ' +
      'whether a purchase relates to the economic activity — a question the auditors put firmly ' +
      'on the human side of the line.</p>' +
      ((tp.related_parties || []).length ? '<h4>Related parties</h4><ul class="acts">' +
        tp.related_parties.map((x) => '<li>' + esc(x.name) + ' <span class="sub mono">' +
          esc(x.vat_no) + '</span><span class="pill">' + esc(x.relation) + '</span></li>').join("") +
        '</ul>' : "") +
      '</div></div>' +

      '<div class="panel"><div class="panel-head"><h2>How they have behaved</h2></div>' +
      '<div class="panel-body"><h4>Filing and payment</h4>' + kvBlock([
        ["Returns due", num(c.returns_due)], ["Returns filed", num(c.returns_filed)],
        ["Filed late", num(c.filed_late)], ["Average days late", num(c.avg_days_late)],
        ["Payments late", num(c.payments_late)],
        ["Outstanding", c.outstanding_balance ? money(c.outstanding_balance) : "None"],
      ]) + '<h4>Audit history</h4>' + priorTable +
      '<h4>Financial information held</h4>' + finTable + '</div></div>' +
    '</div>' +

    '<div class="grid-2">' +
      '<div class="panel"><div class="panel-head"><h2>Imports and exports</h2>' +
        (cus.in_period != null ? '<span class="sub">' + cus.in_period +
          ' declarations in the period</span>' : "") +
      '</div><div class="panel-body">' + cusPanel + '</div></div>' +
      '<div class="panel"><div class="panel-head"><h2>E-invoices in the period</h2>' +
        '<span class="sub">' + num(einv.count || 0) + ' documents</span></div>' +
      '<div class="panel-body">' + einvTable +
      '<p class="detail-note">A count and a sum only. What the population <i>should</i> add to, ' +
      'once qualification rules run, is the Reconciliation tab.</p></div></div>' +
    '</div>' +

    precedentPanel(caseId) +
  '</div>';
}

/* ------------------------------------------------------------------ precedent */
function precedentPanel(caseId) {
  const brief = (DATA.precedents || {})[caseId];
  if (!brief) return "";
  const s = brief.summary;
  const pct = (n) => (n % 1 ? n.toFixed(1) : n) + "%";
  const noF = (s.outcomes || []).find((o) => o.key === "NO_FINDING");
  const fnd = (s.outcomes || []).find((o) => o.key === "FINDING");

  const tally = (rows, warn) => '<ul class="tally">' + rows.slice(0, 4).map((r) =>
    '<li><code>' + esc(r.key) + '</code><span class="meter"><i' + (warn ? ' class="warn"' : "") +
    ' style="width:' + r.pct + '%"></i></span><b>' + pct(r.pct) + '</b></li>').join("") + '</ul>';

  return '<div class="panel"><div class="panel-head">' +
    '<div class="ai-h"><span class="chip-det">Deterministic</span><h2>Precedent</h2></div>' +
    '<span class="sub">' + s.comparable + ' comparable closed case' +
      (s.comparable === 1 ? "" : "s") + (s.widened ? " · search widened" : "") + '</span>' +
    '</div><div class="panel-body">' +
    '<p class="detail-note" style="margin-top:0">When the risk engine raised <b>' +
      esc(s.indicator_label) + '</b> before, on taxpayers of a similar sector, size and filing ' +
      'record:</p>' +
    (noF && fnd ? '<div class="outcome-bar">' +
      '<div class="ob-seg ob-clear" style="width:' + noF.pct + '%">' +
        (noF.pct >= 18 ? '<span>' + pct(noF.pct) + ' no finding</span>' : "") + '</div>' +
      '<div class="ob-seg ob-finding" style="width:' + fnd.pct + '%">' +
        (fnd.pct >= 18 ? '<span>' + pct(fnd.pct) + ' finding</span>' : "") + '</div></div>' : "") +
    '<div class="prec-grid"><div><h4>Where they were explained</h4>' +
      tally(s.explained_by || [], false) + '</div>' +
      '<div><h4>Where a finding was raised</h4>' + tally(s.caused_by || [], true) + '</div></div>' +
    '<h4>What actually closed them</h4>' +
    '<p class="detail-note" style="margin-top:0">Ranked by how often an item was the evidence ' +
      'that settled the case — not by how often it was asked for.</p>' +
    '<div class="tablescroll"><table class="inv-table"><thead><tr><th>Evidence</th>' +
      '<th style="text-align:right">Requested in</th><th style="text-align:right">Decisive in</th>' +
      '<th style="width:110px">Hit rate</th></tr></thead><tbody>' +
      (s.evidence || []).map((e) => '<tr><td>' + esc(e.label) + '</td>' +
        '<td class="mono" style="text-align:right">' + e.requested + '</td>' +
        '<td class="mono" style="text-align:right">' + e.decisive + '</td>' +
        '<td><span class="meter"><i style="width:' + e.decisive_rate + '%"></i></span>' +
        '<span class="sub"> ' + pct(e.decisive_rate) + '</span></td></tr>').join("") +
      '</tbody></table></div>' +
    '<div class="prec-facts">' +
      (s.effort && s.effort.median_rounds != null ? '<div><span class="k">Typical effort</span>' +
        '<span class="v">' + s.effort.median_rounds + ' rounds · ' +
        s.effort.median_days_to_close + ' days</span></div>' : "") +
      (s.effort && s.effort.single_round_pct != null ?
        '<div><span class="k">Closed in one round</span><span class="v">' +
        pct(s.effort.single_round_pct) + '</span></div>' : "") +
      (s.assessed && s.assessed.median != null ?
        '<div><span class="k">Median assessment</span><span class="v">' +
        money(s.assessed.median) + '</span></div>' : "") +
    '</div>' +
    (s.recurrence ? '<div class="callout warn"><b>This taxpayer is in the comparable set.</b> ' +
      (s.recurrence.findings > 0
        ? s.recurrence.cases + ' closed case(s), ' + s.recurrence.findings + ' with a finding (' +
          s.recurrence.root_causes.join(", ") + ') — ' + s.recurrence.case_ids.join(", ") +
          '. Rule the earlier cause out first.'
        : s.recurrence.cases + ' closed case(s), none of which resulted in a finding.') +
      '</div>' : "") +
    '</div></div>';
}

/* ------------------------------------------------------------------ casework */
const GAP_LABEL = {
  "missing-item": "Nothing supplied", "wrong-document": "Wrong document",
  "missing-column": "Missing column", "empty-mandatory-field": "Blank mandatory field",
  "wrong-period": "Period not covered", "arithmetic-mismatch": "Does not add up",
  "wrong-format": "Wrong format", "unrequested-document": "Not requested",
  "too-vague": "Too vague",
};
const ITEM_STATUS = { outstanding: "pri-high", received: "pri-medium", satisfied: "pri-low", waived: "" };

function letterPanel(title, draft) {
  if (!draft || !draft.text) return "";
  return '<div class="panel ai-panel"><div class="panel-head">' +
    '<div class="ai-h"><span class="ai-chip">AI</span><h2>' + esc(title) + '</h2></div>' +
    '<div class="chips">' + verifyBadge(draft.source) + '</div></div>' +
    '<div class="panel-body"><pre class="letterpre">' + esc(draft.text) + '</pre>' +
    '<p class="detail-note">A draft for the auditor to edit and approve. Nothing is sent from ' +
    'here. Every figure in the letter was established by the engine — the model may repeat one ' +
    'and may not introduce one.</p></div></div>';
}

function viewCasework(caseId) {
  const work = (DATA.casework || {})[caseId];
  if (!work) return '<div class="page"><div class="panel"><div class="notice err">No casework ' +
    'for ' + esc(caseId) + '.</div></div></div>';
  const plan = work.plan, loop = work.loop;
  const started = loop.round > 0;

  const planItems = (list, dropped) => '<div class="planlist">' + list.map((p) =>
    '<div class="planitem' + (dropped ? " dropped" : "") + '"><div class="pi-head"><b>' +
    esc(p.label) + '</b>' + (dropped ? "" : '<span class="pill">' + esc(p.kind) + '</span>' +
      (p.decisive_rate != null ? '<span class="pill pri-low">' + p.decisive_rate +
        '% decisive</span>' : "")) + '</div><p class="sub">' + esc(p.reason) + '</p>' +
    (!dropped && (p.required_columns || []).length ? '<p class="cols"><span class="k">' +
      p.required_columns.length + ' columns</span>' +
      p.required_columns.map((x) => '<code>' + esc(x) + '</code>').join("") + '</p>' : "") +
    '</div>').join("") + '</div>';

  const gapsFor = (gaps) => {
    if (!gaps.length) return '<p class="muted">Nothing outstanding — the response meets the ' +
      'request.</p>';
    const groups = {};
    const order = [];
    gaps.forEach((g) => {
      const k = g.item_label || "Other";
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(g);
    });
    return '<div class="gaps">' + order.map((k) => '<div class="gapgroup"><h4>' + esc(k) +
      '</h4>' + groups[k].map((g) => '<div class="gap ' + g.severity + '">' +
        '<span class="pill ' + (g.severity === "blocking" ? "pri-high" : "pri-medium") + '">' +
        esc(GAP_LABEL[g.kind] || g.kind) + '</span><div><p>' + esc(g.detail) + '</p>' +
        (g.citation ? '<small class="mono">' + esc(g.citation) + '</small>' : "") +
        '</div></div>').join("") + '</div>').join("") + '</div>';
  };

  const rounds = (loop.rounds || []).map((r) => {
    const docs = (loop.documents || []).filter((x) => x.round === r.seq);
    return '<div class="panel"><div class="panel-head"><h2>Round ' + r.seq + '</h2>' +
      '<div class="chips"><span class="pill ' +
        (r.status === "satisfied" ? "pri-low" : "pri-medium") + '">' + esc(r.status) + '</span>' +
        (r.issued_at ? '<span class="sub">issued ' + esc(r.issued_at) + '</span>' : "") +
        (r.answered_at ? '<span class="sub">answered ' + esc(r.answered_at) + '</span>' : "") +
      '</div></div><div class="panel-body">' +
      '<div class="tablescroll"><table class="inv-table"><thead><tr><th style="width:34px">#</th>' +
        '<th>Requested</th><th>Format</th><th>Status</th></tr></thead><tbody>' +
        r.items.map((it) => '<tr><td class="mono">' + it.seq + '</td><td><b>' + esc(it.label) +
          '</b>' + ((it.required_columns || []).length ? '<div class="sub">' +
            it.required_columns.length + ' columns: ' + it.required_columns.map(esc).join(", ") +
            '</div>' : "") + '</td><td class="mono">' + esc(it.expected_format || "—") + '</td>' +
          '<td><span class="pill ' + (ITEM_STATUS[it.status] || "") + '">' + esc(it.status) +
          '</span></td></tr>').join("") + '</tbody></table></div>' +
      '<h4>What arrived</h4>' +
      (docs.length ? '<div class="tablescroll"><table class="inv-table"><thead><tr><th>File</th>' +
        '<th>Answers</th><th style="text-align:right">Rows</th><th>Columns found</th>' +
        '<th>Covers</th></tr></thead><tbody>' + docs.map((x) => {
          const it = r.items.find((i) => i.id === x.request_item_id);
          return '<tr' + (x.superseded ? ' class="dim"' : "") + '><td class="mono">' +
            esc(x.filename) + (x.superseded ? ' <span class="sub">· superseded</span>' : "") +
            '</td><td class="sub">' + esc(it ? it.label : "not linked") + '</td>' +
            '<td class="mono" style="text-align:right">' + (x.row_count || "—") + '</td>' +
            '<td class="sub">' + esc((x.raw_headers || []).join(", ") || x.note || "—") + '</td>' +
            '<td class="mono sub">' + (x.period_from ? esc(x.period_from) + " → " +
              esc(x.period_to) : "—") + '</td></tr>';
        }).join("") + '</tbody></table></div>'
        : '<p class="muted">Nothing received for this round yet.</p>') +
      '<h4>Requested versus received' + (r.gaps.length ? ' <span class="sub">· ' + r.gaps.length +
        ' findings</span>' : "") + '</h4>' + gapsFor(r.gaps) +
      '<p class="detail-note">Column presence, blank mandatory fields, period coverage and ' +
      'whether the stated totals add up are checks, not judgement — they run deterministically, ' +
      'with no model involved. A column the taxpayer named differently is resolved, not ' +
      'reported: flagging “Invoice No.” as missing would put a false accusation in the letter ' +
      'below.</p></div></div>';
  }).join("");

  const last = (loop.rounds || [])[loop.rounds.length - 1];
  return '<div class="page">' +
    '<header class="page-head"><div><h1>Casework</h1><p class="sub">' + esc(caseId) +
      ' · what we asked for, what arrived, and what is still missing</p></div>' +
      (started ? '<div class="chips"><span class="pill ' +
        (loop.complete ? "pri-low" : "pri-high") + '">Round ' + loop.round + '</span>' +
        '<span class="pill">' + esc(loop.status) + '</span>' +
        (loop.complete ? "" : '<span class="pill pri-high">' + loop.blocking +
          ' blocking</span>') + '</div>' : "") +
    '</header>' + caseTabs(caseId, "casework") + lifecycleRail(caseId) +

    '<div class="panel"><div class="panel-head">' +
      '<div class="ai-h"><span class="chip-det">Deterministic</span><h2>What to ask for</h2></div>' +
      '<span class="sub">' + plan.items.length + ' items · ' + plan.dropped.length +
      ' dropped</span></div><div class="panel-body">' +
      (plan.notes || []).map((n) => '<p class="detail-note">' + esc(n) + '</p>').join("") +
      '<h4>Requesting</h4>' + planItems(plan.items, false) +
      (plan.dropped.length ? '<h4>Not requesting</h4>' + planItems(plan.dropped, true) +
        '<p class="detail-note">The auditors do not request information the Authority already ' +
        'holds. Here that is mechanical rather than remembered — and the reason stays visible, ' +
        'so the decision can be checked rather than trusted.</p>' : "") +
      (started ? "" : '<p class="detail-note">No request has been issued on this case. In the ' +
        'live app the auditor approves this plan and the letter is drafted from it.</p>') +
    '</div></div>' + rounds +
    (last && last.body ? letterPanel("Round " + last.seq + " — information request",
      { text: last.body, source: last.body_source }) : "") +
    (work.followup ? letterPanel("Follow-up — outstanding items only", work.followup) : "") +
    (loop.complete && started ? '<div class="callout ok"><b>The response meets the request.</b> ' +
      'Nothing blocking remains, so the substantive review can open.</div>' : "") +
  '</div>';
}


function viewReconciliation(caseId) {
  let d;

  catch (e) {
    return '<div class="page"><div class="panel"><div class="notice err">Could not reconcile this case — ' + esc(e.message) + '</div></div></div>';
  }
  const cstate = (d.combined && d.combined.state) || d.state;
  const inputFinding = d.combined && d.combined.input_state === "potential-finding";
  const brief = fbSummary(caseId);
  const narration = fbNarration(d);
  const nba = fbNba(d);
  const report = fbReport(d);
  const responses = responsesOf(caseId);

  const reportLines = report.split("\n");
  const shownText = reportLines.slice(0, reportShown).join("\n");
  const streaming = reportShown < reportLines.length;

  return '<div class="page">' +
    '<div class="page-head"><div><p class="eyebrow"><a href="#/">Cases</a> · ' + esc(d.case_id) + '</p>' +
    '<h1>' + esc(d.taxpayer) + '</h1></div>' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
    (inputFinding ? '<span class="pill pri-high" style="font-size:12px;padding:5px 12px" title="Input-VAT over-claim on the purchases box">+ input over-claim ' + esc(sar(d.combined.input_residual)) + '</span>' : "") +

    '<span>Residual <b style="color:' + (d.purchase.state === "potential-finding" ? "var(--high)" : "var(--low)") + '">' + esc(sar(d.purchase.residual)) + '</b></span>' +
    '</div>' + waterfall(d.purchase, "input") +
    '<div class="bridge-foot"><span class="ct">∑ computed</span> Input VAT rebuilt from cleared purchase e-invoices. On this box an over-claim — declaring more input VAT than the invoices support — is the revenue risk.</div></div>' +

    // investigation
    investigationPanel(d.case_id) +

    // next best action
    '<div class="panel ai-panel"><div class="panel-head"><div class="ai-h"><span class="ai-chip">AI</span><h2>Next best action</h2></div>' +
    verifyBadge("deterministic-fallback") + '</div><div class="ai-body">' +
    (nba.action_type === "no-action"
      ? '<p class="muted">No action — residual within materiality. ' + esc(nba.rationale) + '</p>'
      : '<div class="nba-top"><span class="pill pri-high">' + esc(nba.action_type.replace(/-/g, " ")) + '</span>' +
        '<span class="muted">to ' + esc(nba.addressed_to.replace(/-/g, " ")) + '</span>' +
        (nba.minimises_contact ? '<span class="pill pri-low">minimises contact</span>' : "") + '</div>' +
        kv([["Request", esc(nba.document_requested)], ["Expected outcome", esc(nba.expected_yield)]]) +
        '<p class="detail-note" style="margin-bottom:0">' + esc(nba.rationale) + '</p>') +
    '</div></div>' +

    // taxpayer response
    '<div class="panel"><div class="panel-head"><h2>Taxpayer response</h2>' +
    '<span class="muted">record what the taxpayer supplied — the auditor confirms the amount, the AI only describes it</span></div>' +
    '<div class="ai-body"><div class="letter">' +
    '<div class="letter-head"><span class="ai-chip">AI</span>' +
    '<span class="muted">Paste a taxpayer letter or case note — AI drafts a response for you to confirm</span></div>' +
    '<textarea class="letter-input" id="letter" rows="4" placeholder="Paste the taxpayer&#39;s letter or a case note here…">' + esc(letterText) + '</textarea>' +
    '<div class="resp-actions"><button class="btn" data-act="analyse"' + (letterText.trim() ? "" : " disabled") + '>Analyse with AI</button>' +
    '<button class="linklike" data-act="sample-letter">use sample letter</button></div>' +
    (extraction ? extractionCard(extraction) : "") +
    '<div class="resp-divider"><span>then confirm &amp; record</span></div></div>' +
    (responses.length
      ? '<div class="resp-list">' + responses.map((r) =>
          '<div class="resp-item"><div><span class="rc">' + esc(r.code) + '</span> ' + esc(r.label) +
          (r.doc_name ? '<span class="sub"> · ' + esc(r.doc_name) + '</span>' : "") + '</div>' +
          '<div class="resp-amt">−' + esc(sar(r.amount)) + '<button class="linklike" data-remove="' + r.seq + '">remove</button></div></div>').join("") +
        '</div>'
      : "") +
    '<div class="resp-form">' +
    '<input id="resp-label" placeholder="What the taxpayer provided (e.g. sales ledger showing the residual was already declared)" value="' + esc(respLabel) + '" />' +
    '<div class="resp-row"><input id="resp-amount" type="number" placeholder="Amount it accounts for (SAR)" value="' + esc(respAmount) + '" />' +
    '<input id="resp-doc" placeholder="Document name (optional)" value="' + esc(respDoc) + '" /></div>' +
    '<div class="resp-actions"><button class="btn" data-act="record"' + (respLabel.trim() && respAmount ? "" : " disabled") + '>Record response &amp; regenerate</button>' +
    '<button class="linklike" data-act="sample-resp">use sample</button></div>' +
    '</div></div></div>' +

    // draft report
    '<div class="panel ai-panel"><div class="panel-head"><div class="ai-h"><span class="ai-chip">AI</span><h2>Draft audit report</h2></div>' +
    '<span id="report-badge">' + verifyBadge(streaming ? null : "deterministic-fallback") + '</span></div>' +
    '<div class="ai-body md" id="report-body">' + (shownText ? renderMd(shownText) : '<span class="muted">Drafting…</span>') +
    (streaming ? '<span class="cursor">▍</span>' : "") + '</div></div>' +

    '</div>';
}

function investigationPanel(caseId) {
  const inv = investigate(caseId);
  const byId = Object.fromEntries(inv.hypotheses.map((h) => [h.id, h]));
  const adj = Object.fromEntries(inv.adjudications.map((a) => [a.hypothesis_id, a]));
  const pill = { confirmed: "pri-low", refuted: "status", "insufficient-evidence": "pri-medium" };

  const rows = inv.hypotheses.map((h) => {
    const a = adj[h.id] || {};
    const lead = inv.leading === h.id;
    return '<div class="hyp' + (lead ? " lead" : "") + '">' +
      '<div><div class="hid">' + esc(h.id) + '</div>' +
      (h.reason_code ? '<span class="rc">' + esc(h.reason_code) + '</span>' : "") + '</div>' +
      '<div><div class="agent">' + esc(h.agent) + (lead ? " · leading" : "") + '</div>' +
      esc(h.claim) +
      (a.explanation ? '<div class="verdict">' + esc(a.explanation) + '</div>' : "") + '</div>' +
      '<div style="text-align:right"><span class="pill ' + (pill[a.status] || "status") + '">' +
      esc((a.status || "").replace(/-/g, " ")) + '</span>' +
      (a.amount ? '<div class="amt2">' + esc(sar(a.amount)) + '</div>' : "") + '</div></div>';
  }).join("");

  const objection = inv.entries.find((e) => e.kind === "objection");
  return '<div class="panel ai-panel"><div class="panel-head">' +
    '<div class="ai-h"><span class="ai-chip">AGENTS</span><h2>Investigation</h2></div>' +
    '<span class="pill status" title="Agents propose typed tests; a deterministic adjudicator settles them. No model states a figure.">∑ Adjudicated (no AI)</span></div>' +
    '<div class="ai-body">' +
    '<p class="inv-conc">' + esc(inv.conclusion) + '</p>' +
    (inv.hypotheses.length
      ? '<div class="inv-round">Round 1–2 · ' + inv.hypotheses.length +
        ' hypotheses proposed, each settled against the engine</div>' + rows +
        (objection ? '<div class="inv-round">Round 3 · Challenger</div>' +
          '<p class="detail-note" style="margin:0">' + esc(objection.payload.note) + '</p>' : "")
      : "") +
    '</div></div>' +

    // §8's second administrative burden: the letter telling the taxpayer the outcome
    letterPanel("Draft letter to the taxpayer", ((DATA.casework || {})[caseId] || {}).verdict);
}

function extractionCard(x) {
  return '<div class="extract-card">' +
    '<div class="extract-top"><span class="pill ' + (x.explains_gap ? "pri-low" : "pri-medium") + '">' +
    esc(x.category.replace(/-/g, " ")) + '</span>' +
    '<span class="muted">confidence: ' + esc(x.confidence) + '</span>' +
    (x.source !== "claude" ? '<span class="muted">· ' + esc(x.source) + '</span>' : "") + '</div>' +
    '<p class="extract-summary">' + esc(x.summary) + '</p>' +
    (x.quote ? '<blockquote class="extract-quote">“' + esc(x.quote) + '”</blockquote>' : "") +
    kv([["Proposed amount (stated in the letter)", "<b>" + esc(sar(x.proposed_amount)) + "</b>"]]) +
    (x.caveat ? '<p class="extract-caveat">⚠ ' + esc(x.caveat) + '</p>' : "") +
    (x.proposed_amount > 0 ? '<button class="btn ghost-fill" data-act="use-extraction">Use this ↓ (fills the form to confirm)</button>' : "") +
    '<p class="extract-note">AI-extracted from the letter — a draft. Confirm or edit the amount below before recording.</p>' +
    '</div>';
}

/* ------------------------------------------------------------------ modal */
let modal = null;

function renderModal() {
  const host = document.getElementById("modal-host");
  if (!modal) { host.innerHTML = ""; document.body.style.overflow = ""; return; }
  host.innerHTML = '<div class="modal-overlay" data-close="1">' +
    '<div class="modal" role="dialog" aria-modal="true">' +
    '<div class="modal-head"><h3>' + esc(modal.title) + '</h3>' +
    '<button class="modal-close" aria-label="Close" data-close="1">×</button></div>' +
    '<div class="modal-body">' + detailBody(modal.detail, modal.amount) + '</div></div></div>';
  document.body.style.overflow = "hidden";
}

function openDrill(caseId, spec, title, amount) {
  const [source, key] = spec.split("|");
  const d = reconcileCase(caseId);
  const box = source === "input" ? d.purchase : d;
  let detail;
  if (key === "all-invoices") {
    detail = { type: "invoice-list", invoices: box.evidence_invoices, count: box.invoices_considered,
      note: "All cleared sale e-invoices used to reconstruct this box." };
    title = "Reconstructed e-invoices";
  } else if (key === "gap") detail = (box.bridge.find((b) => b.kind === "gap") || {}).detail;
  else if (key === "anchor") detail = (box.bridge.find((b) => b.kind === "anchor") || {}).detail;
  else if (key === "residual") detail = (box.bridge.find((b) => b.kind === "residual") || {}).detail;
  else if (key.startsWith("explain:")) {
    const rule = key.slice(8);
    detail = (box.bridge.find((b) => b.kind === "explain" && b.rule === rule) || {}).detail;
  }
  modal = { title, detail, amount };
  renderModal();
}

/* ------------------------------------------------------------------ router */
function currentPath() {
  const h = location.hash.replace(/^#/, "");
  return h && h.startsWith("/") ? h : "/";
}

/* /cases/<id>[/casework|/reconciliation] — a case is worked in lifecycle order */
function caseRoute(path) {
  const m = path.match(/^\/cases\/([^/]+)(?:\/(casework|reconciliation))?$/);
  return m ? { id: decodeURIComponent(m[1]), tab: m[2] || "dossier" } : null;
}

function render() {
  const path = currentPath();
  const route = caseRoute(path);
  let inner;
  if (path === "/rules") inner = viewRules();
  else if (route && route.tab === "casework") inner = viewCasework(route.id);
  else if (route && route.tab === "dossier") inner = viewDossier(route.id);
  else if (route) inner = viewReconciliation(route.id);
  else inner = viewOverview();
  root.innerHTML = shell(path, inner) + '<div id="modal-host"></div>';
  renderModal();
}

/* report "streaming" — reveals the engine-authored draft line by line, like the SSE stream.
   Patches only the report panel so typing elsewhere on the page is never interrupted. */
function startReport() {
  clearTimeout(reportTimer);
  reportGen += 1;
  const gen = reportGen;
  reportShown = 0;
  const route = caseRoute(currentPath());
  if (!route || route.tab !== "reconciliation") return;
  const lines = fbReport(reconcileCase(route.id)).split("\n");
  const step = () => {
    if (gen !== reportGen) return;
    reportShown += 1;
    const body = document.getElementById("report-body");
    const badge = document.getElementById("report-badge");
    if (!body) return;
    const streaming = reportShown < lines.length;
    body.innerHTML = renderMd(lines.slice(0, reportShown).join("\n")) + (streaming ? '<span class="cursor">▍</span>' : "");
    if (badge) badge.innerHTML = verifyBadge(streaming ? null : "deterministic-fallback");
    if (streaming) reportTimer = setTimeout(step, 55);
  };
  reportTimer = setTimeout(step, 120);
}

window.addEventListener("hashchange", () => {
  modal = null;
  extraction = null; letterText = ""; respLabel = ""; respAmount = ""; respDoc = "";
  confirmDelete = null;
  render();
  if (currentPath().startsWith("/cases/")) startReport();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal) { modal = null; renderModal(); }
});

/* ------------------------------------------------------------------ events */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-close],[data-case],[data-drill],[data-act],[data-fam],[data-sev],[data-gap],[data-kind],[data-del],[data-delask],[data-delcancel],[data-remove]");
  if (!t) return;

  if (t.hasAttribute("data-close")) {
    // the overlay closes on click; clicks inside the dialog only close via its × button
    if (e.target.closest(".modal") && !e.target.closest(".modal-close")) return;
    modal = null; renderModal(); return;
  }
  if (t.hasAttribute("data-case")) { location.hash = "#/cases/" + t.getAttribute("data-case"); return; }

  if (t.hasAttribute("data-drill")) {
    const path = currentPath();
    if (!path.startsWith("/cases/")) return;
    openDrill(decodeURIComponent(path.slice(7)), t.getAttribute("data-drill"),
      t.getAttribute("data-title") || "", t.hasAttribute("data-amount") ? Number(t.getAttribute("data-amount")) : undefined);
    return;
  }

  if (t.hasAttribute("data-fam")) { const v = t.getAttribute("data-fam"); rulesFam = rulesFam === v ? null : v; render(); return; }
  if (t.hasAttribute("data-sev")) { const v = t.getAttribute("data-sev"); rulesSev = rulesSev === v ? null : v; render(); return; }
  if (t.hasAttribute("data-gap")) { const v = t.getAttribute("data-gap"); rulesGap = rulesGap === v ? null : v; render(); return; }
  if (t.hasAttribute("data-kind")) { const v = t.getAttribute("data-kind"); rulesKind = rulesKind === v ? null : v; render(); return; }
  if (t.hasAttribute("data-delask")) { confirmDelete = t.getAttribute("data-delask"); render(); return; }
  if (t.hasAttribute("data-delcancel")) { confirmDelete = null; render(); return; }
  if (t.hasAttribute("data-del")) {
    const code = t.getAttribute("data-del");
    STATE.rules = STATE.rules.filter((r) => r.code !== code);
    confirmDelete = null; render(); return;
  }
  if (t.hasAttribute("data-remove")) {
    const seq = Number(t.getAttribute("data-remove"));
    const cid = decodeURIComponent(currentPath().slice(7));
    STATE.responses[cid] = (STATE.responses[cid] || []).filter((r) => r.seq !== seq);
    render(); startReport(); return;
  }

  const act = t.getAttribute("data-act");
  if (act === "reset") {
    if (resetState === "idle") { resetState = "confirm"; render(); return; }
    STATE = { rules: SEED_RULES.map((r) => ({ ...r })), responses: {} };
    resetState = "idle";
    render();
    return;
  }
  if (act === "sample-letter") {
    const cid = decodeURIComponent(currentPath().slice(7));
    const residual = Math.max(0, Math.round(reconcileCase(cid).residual));
    letterText = "Dear Sir/Madam,\n\nFurther to your enquiry regarding our Q1 2025 VAT return, we confirm that the " +
      "difference of SAR " + residual.toLocaleString("en-US") +
      " between your reconstruction and our declared output VAT relates to standard-rated sales that were " +
      "invoiced and delivered in December 2024 and already declared in our prior-period (Q4 2024) return. " +
      "The clearance timestamps fell in early January 2025, which is why they appear in this period's e-invoice " +
      "data. Our sales ledger and the prior return are attached as supporting evidence.\n\nRegards,\nFinance Department";
    extraction = null;
    render();
    return;
  }
  if (act === "analyse") {
    // No backend and no API key: this is exactly what llm.read_letter returns in that state.
    extraction = {
      explains_gap: false, category: "none",
      summary: "Automated reading is unavailable — review the letter and enter the amount by hand.",
      quote: "", proposed_amount: 0, confidence: "low",
      caveat: "Enter and confirm the amount manually from the letter.",
      source: "deterministic-fallback",
    };
    render();
    return;
  }
  if (act === "use-extraction") {
    if (!extraction) return;
    respLabel = extraction.summary;
    respAmount = String(Math.max(0, Math.round(extraction.proposed_amount)));
    respDoc = "taxpayer_letter.pdf";
    render();
    return;
  }
  if (act === "sample-resp") {
    const cid = decodeURIComponent(currentPath().slice(7));
    const residual = reconcileCase(cid).residual;
    respLabel = "Sales ledger provided by the taxpayer shows the residual relates to prior-period invoices already declared in an earlier return.";
    respAmount = String(Math.max(0, Math.round(residual)));
    respDoc = "sales_ledger_Q1-2025.xlsx";
    render();
    return;
  }
  if (act === "record") {
    const cid = decodeURIComponent(currentPath().slice(7));
    if (!respLabel.trim() || !respAmount) return;
    const list = STATE.responses[cid] || (STATE.responses[cid] = []);
    const seq = list.length + 1;
    list.push({ seq, code: "RESP-" + String(seq).padStart(2, "0"), label: respLabel.trim(),
      amount: Math.abs(Number(respAmount)), doc_name: respDoc.trim() });
    respLabel = ""; respAmount = ""; respDoc = "";
    render(); startReport();
    return;
  }
});

document.addEventListener("change", (e) => {
  const cb = e.target.closest("[data-toggle]");
  if (!cb) return;
  const code = cb.getAttribute("data-toggle");
  const rule = STATE.rules.find((r) => r.code === code);
  if (rule) rule.enabled = cb.checked;
  render();
});

/* keep typed values without re-rendering on every keystroke */
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "rule-q") { rulesQ = e.target.value; const pos = e.target.selectionStart; render();
    const el = document.getElementById("rule-q"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } return; }
  if (id === "letter") { letterText = e.target.value; toggleDisabled('[data-act="analyse"]', !letterText.trim()); return; }
  if (id === "resp-label") { respLabel = e.target.value; syncRecordBtn(); return; }
  if (id === "resp-amount") { respAmount = e.target.value; syncRecordBtn(); return; }
  if (id === "resp-doc") { respDoc = e.target.value; return; }
});
function toggleDisabled(sel, disabled) { const b = document.querySelector(sel); if (b) b.disabled = disabled; }
function syncRecordBtn() { toggleDisabled('[data-act="record"]', !(respLabel.trim() && respAmount)); }

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest(".brow.clickable");
  if (!row) return;
  e.preventDefault();
  row.click();
});

render();
if (currentPath().startsWith("/cases/")) startReport();
</script>
</body>
</html>
