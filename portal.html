function investigationPanel(caseId) {
  const inv = investigate(caseId);
  const byId = Object.fromEntries(inv.hypotheses.map((h) => [h.id, h]));
  const adj = Object.fromEntries(inv.adjudications.map((a) => [a.hypothesis_id, a]));
  const pill = { confirmed: "pri-low", refuted: "status", "insufficient-evidence": "pri-medium" };

  const rows = inv.hypotheses.map((h) => {
    const a = adj[h.id] || {};
    const lead = inv.leading === h.id;
    return '<div class="hyp' + (lead ? " lead" : "") + '">' +
      '<div><div class="hid">' + esc(h.id) + '</div>' +
      (h.reason_code ? '<span class="rc">' + esc(h.reason_code) + '</span>' : "") + '</div>' +
      '<div><div class="agent">' + esc(h.agent) + (lead ? " · leading" : "") + '</div>' +
      esc(h.claim) +
      // the trigger. Without it the claim is an assertion; with it, an inference the
      // auditor can check — and a finding they can defend to a taxpayer.
      (h.why ? '<div class="hyp-why"><b>Why raised</b> ' + esc(h.why) + '</div>' : "") +
      (a.explanation
        ? '<div class="verdict verdict-' + esc(a.status) + '"><b>' +
          esc({ confirmed: "confirmed", refuted: "refuted",
                "insufficient-evidence": "cannot be tested" }[a.status] || a.status) +
          '</b> — ' + esc(a.explanation) + '</div>'
        : "") +
      '<div class="hyp-test"><div><span class="k">Test run</span><code>' + esc(h.test.kind) +
      '</code><span class="sub"> on the ' + esc(h.test.box) + ' box</span></div>' +
      (Object.keys(h.test.params || {}).length
        ? '<div><span class="k">Against</span><code>' +
          esc(Object.entries(h.test.params).map(([k2, v]) => k2 + "=" + v).join(", ")) + '</code></div>'
        : "") +
      '<div><span class="k">Confidence when proposed</span>' + esc(h.confidence) + '</div>' +
      (h.outcome_code ? '<div><span class="k">Reports as</span><code>' + esc(h.outcome_code) + '</code></div>' : "") +
      '</div></div>' +
      '<div style="text-align:right"><span class="pill ' + (pill[a.status] || "status") + '">' +
      esc((a.status || "").replace(/-/g, " ")) + '</span>' +
      (a.amount ? '<div class="amt2">' + esc(sar(a.amount)) + '</div>' : "") + '</div></div>';
  }).join("");

  const objection = inv.entries.find((e) => e.kind === "objection");
  return '<div class="panel ai-panel"><div class="panel-head">' +
    '<div class="ai-h"><span class="ai-chip">AGENTS</span><h2>Investigation</h2></div>' +
    '<span class="pill status" title="Agents propose typed tests; a deterministic adjudicator settles them. No model states a figure.">∑ Adjudicated (no AI)</span></div>' +
    '<div class="ai-body">' +
    '<p class="inv-conc">' + esc(inv.conclusion) + '</p>' +
    (inv.hypotheses.length
      ? '<div class="inv-round">Round 1–2 · ' + inv.hypotheses.length +
        ' hypotheses proposed, each settled against the engine</div>' + rows +
        (objection ? '<div class="inv-round">Round 3 · Challenger</div>' +
          '<p class="detail-note" style="margin:0">' + esc(objection.payload.note) + '</p>' : "")
      : "") +
    '</div></div>' +
    findingsPanel(inv) +
    calculationsPanel(caseId) +

    // §8's second administrative burden: the letter telling the taxpayer the outcome
    letterPanel("Draft letter to the taxpayer", ((DATA.casework || {})[caseId] || {}).verdict);
}

/* ---- findings: the Authority's own wording, grouped by the evidence they rest on */
const EFFECT_LABEL = { "increases-output": "Output VAT understated",
  "disallows-input": "Input VAT not recoverable", documentation: "Documentation defect" };
const EFFECT_PILL = { "increases-output": "pri-high", "disallows-input": "pri-high",
  documentation: "pri-medium" };

function findingsPanel(inv) {
  const found = inv.findings || [];
  const head = '<div class="panel"><div class="panel-head"><h2>Findings</h2>' +
    '<span class="pill status" title="Wording is the Authority\u2019s own; every amount was computed by the engine.">∑ ' +
    (found.length ? found.length + " established" : "none established") + '</span></div>';
  if (!found.length)
    return head + '<div class="panel-note"><span class="ct">∑ computed</span> No finding was ' +
      'established from the documents supplied. Nothing here is a matter to put to the taxpayer.</div></div>';

  const e = inv.exposure || exposureOf(found);
  const tiles = '<div class="exposure">' +
    '<div class="exp"><span class="exp-l">Output VAT understated</span><b>' + esc(sar(e.increases_output)) + '</b></div>' +
    '<div class="exp"><span class="exp-l">Input VAT not recoverable</span><b>' + esc(sar(e.disallows_input)) + '</b></div>' +
    '<div class="exp total"><span class="exp-l">Proposed adjustment</span><b>' + esc(sar(e.total)) + '</b></div>' +
    (e.documentation_at_risk
      ? '<div class="exp"><span class="exp-l" title="Documentation defects on evidence that is not already producing an adjustment. Not part of the proposed adjustment.">Documentation at risk</span><b class="muted">' +
        esc(sar(e.documentation_at_risk)) + '</b></div>' : "") + '</div>';

  const body = groupedByBasis(found).map((g) => {
    const [h, ...rest] = g.findings;
    return '<div class="finding">' +
      '<div class="f-top"><span class="pill ' + (EFFECT_PILL[h.effect] || "status") + '">' +
      esc(EFFECT_LABEL[h.effect] || h.effect) + '</span><span class="rc">' + esc(h.code) + '</span>' +
      (h.amount ? '<b class="f-amt">' + esc(sar(h.amount)) + '</b>' : "") + '</div>' +
      '<div class="f-statement">' + esc(h.statement) + '</div>' +
      '<div class="f-why"><span class="k">Established because</span> ' + esc(h.explanation) + '</div>' +
      (rest.length
        ? '<div class="f-also"><span class="k">The same matter also reads as</span><ul>' +
          rest.map((r) => '<li><span class="rc">' + esc(r.code) + '</span> ' + esc(r.statement) + '</li>').join("") +
          '</ul></div>' : "") +
      '<div class="f-agent">Raised by ' + esc(h.agent) + ' · ' + esc(h.hypothesis_id) + '</div></div>';
  }).join("");

  return head + tiles + '<div class="findings">' + body + '</div>' +
    '<div class="panel-note"><span class="ct">∑ computed</span> Each statement is the ' +
    'Authority\u2019s own wording, selected by an agent and confirmed by a deterministic test. ' +
    'Where several statements describe one piece of evidence the amount is shown once — they ' +
    'are readings of a single matter, not separate amounts.</div></div>';
}

/* ---- the auditor's own arithmetic, recomputed in the browser */
function calculationsPanel(caseId) {
  const docs = documentsFor(caseId);
  const head = '<div class="panel"><div class="panel-head"><h2>Your calculations</h2>' +
    '<span class="pill status" title="Recomputed from the uploaded rows. No model does arithmetic.">∑ Recomputed from source</span></div>';
  if (!docs.length)
    return head + '<div class="panel-note"><span class="ct">∑ computed</span> No documents are ' +
      'on this case, so there is nothing to check a figure against.</div></div>';

  const doc = docs[0];
  const cols = (doc.columns || []).filter((c) => c !== "invoice_number");
  const form = '<div class="calc-form">' +
    '<input class="letter-input" id="calc-label" placeholder="What did you calculate? (e.g. total output VAT on the listing)">' +
    '<div class="calc-row">' +
    '<input class="letter-input" id="calc-amount" type="number" placeholder="The figure you got (SAR)">' +
    '<select class="letter-input calc-select" id="calc-doc">' +
    docs.map((d) => '<option value="' + esc(d.filename) + '">' + esc(d.filename) + ' (' + d.row_count + ' rows)</option>').join("") +
    '</select></div>' +
    '<div class="calc-query">' +
    '<select class="letter-input calc-select" id="calc-op">' +
    ["sum", "count", "count_distinct", "average", "max", "min"].map((o) =>
      '<option value="' + o + '">' + (o === "count" ? "count rows" : o.replace("_", " ")) + '</option>').join("") +
    '</select>' +
    '<select class="letter-input calc-select" id="calc-col">' +
    '<option value="">of which column?</option>' +
    cols.map((c) => '<option value="' + esc(c) + '"' + (c === "vat_amount" ? " selected" : "") + '>' + esc(c) + '</option>').join("") +
    '</select></div>' +
    '<button class="btn" data-calc="run">Check it against the documents</button></div>';

  const list = calcsFor(caseId).map((c) => '<div class="calc-item">' +
    '<div class="calc-item-top"><span class="pill ' +
    ({ agree: "pri-low", disagree: "pri-high", "not-checkable": "pri-medium" }[c.status] || "status") +
    '">' + esc(c.status.replace(/-/g, " ")) + '</span><b>' + esc(c.label) + '</b>' +
    '<button class="linklike" data-calcdel="' + c.seq + '">remove</button></div>' +
    '<div class="calc-figures"><span><span class="k">You recorded</span> ' + esc(sar(c.stated)) + '</span>' +
    (c.computed !== null && c.computed !== undefined ? '<span><span class="k">Recomputed</span> ' + esc(sar(c.computed)) + '</span>' : "") +
    (c.delta ? '<span class="calc-delta"><span class="k">Difference</span> ' + esc(sar(c.delta)) + '</span>' : "") +
    '</div><div class="sub">' + esc(c.explanation) + '</div>' +
    (c.query ? '<div class="sub"><span class="k">Checked</span> <code>' + esc(c.query) + '</code></div>' : "") +
    '</div>').join("");

  return head + form + (list ? '<div class="calc-list">' + list + '</div>' : "") +
    '<div class="panel-note"><span class="ct">∑ computed</span> Every figure here is recomputed ' +
    'from the uploaded rows in JavaScript, the same way the app recomputes them in Python. A ' +
    'method that cannot be reproduced is reported as such rather than approximated by a ' +
    'calculation answering a different question.</div></div>';
}

function extractionCard(x) {
  return '<div class="extract-card">' +
    '<div class="extract-top"><span class="pill ' + (x.explains_gap ? "pri-low" : "pri-medium") + '">' +
    esc(x.category.replace(/-/g, " ")) + '</span>' +
    '<span class="muted">confidence: ' + esc(x.confidence) + '</span>' +
    (x.source !== "claude" ? '<span class="muted">· ' + esc(x.source) + '</span>' : "") + '</div>' +
    '<p class="extract-summary">' + esc(x.summary) + '</p>' +
    (x.quote ? '<blockquote class="extract-quote">“' + esc(x.quote) + '”</blockquote>' : "") +
    kv([["Proposed amount (stated in the letter)", "<b>" + esc(sar(x.proposed_amount)) + "</b>"]]) +
    (x.caveat ? '<p class="extract-caveat">⚠ ' + esc(x.caveat) + '</p>' : "") +
    (x.proposed_amount > 0 ? '<button class="btn ghost-fill" data-act="use-extraction">Use this ↓ (fills the form to confirm)</button>' : "") +
    '<p class="extract-note">AI-extracted from the letter — a draft. Confirm or edit the amount below before recording.</p>' +
    '</div>';
}

/* ------------------------------------------------------------------ modal */
let modal = null;

function renderModal() {
  const host = document.getElementById("modal-host");
  if (!modal) { host.innerHTML = ""; document.body.style.overflow = ""; return; }
  host.innerHTML = '<div class="modal-overlay" data-close="1">' +
    '<div class="modal" role="dialog" aria-modal="true">' +
    '<div class="modal-head"><h3>' + esc(modal.title) + '</h3>' +
    '<button class="modal-close" aria-label="Close" data-close="1">×</button></div>' +
    '<div class="modal-body">' + detailBody(modal.detail, modal.amount) + '</div></div></div>';
  document.body.style.overflow = "hidden";
}

function openDrill(caseId, spec, title, amount) {
  const [source, key] = spec.split("|");
  const d = reconcileCase(caseId);
  const box = source === "input" ? d.purchase : d;
  let detail;
  const step = (kind) => (box.funnel.find((f) => f.kind === kind) || {}).detail;
  if (key === "all-invoices") {
    detail = { type: "invoice-list", invoices: box.evidence_invoices, count: box.invoices_considered,
      note: "Every e-invoice held for this taxpayer in this direction, before any rule is applied." };
    title = "E-invoices on file";
  } else if (key === "population") detail = step("population");
  else if (key === "qualified") detail = step("qualified");
  else if (key === "declared") detail = box.declared_detail;
  else if (key === "difference") detail = box.difference_detail;
  else if (key.startsWith("step:")) {
    const id = key.slice(5);
    detail = (box.funnel.find((f) => (f.rule || f.stage) === id) || {}).detail;
  } else if (key.startsWith("comp:")) {
    const code = Number(key.slice(5));
    detail = (box.composition.find((c) => c.type_code === code) || {}).detail;
  } else if (key.startsWith("evidence:")) {
    const code = key.slice(9);
    detail = ((box.evidence || []).find((e) => e.code === code) || {}).detail;
  }
  modal = { title, detail, amount };
  renderModal();
}

/* ------------------------------------------------------------------ router */
function currentPath() {
  const h = location.hash.replace(/^#/, "");
  return h && h.startsWith("/") ? h : "/";
}

/* /cases/<id>[/casework|/reconciliation] — a case is worked in lifecycle order */
function caseRoute(path) {
  const m = path.match(/^\/cases\/([^/]+)(?:\/(casework|reconciliation))?$/);
  return m ? { id: decodeURIComponent(m[1]), tab: m[2] || "dossier" } : null;
}

function render() {
  const path = currentPath();
  const route = caseRoute(path);
  let inner;
  if (path === "/rules") inner = viewRules();
  else if (route && route.tab === "casework") inner = viewCasework(route.id);
  else if (route && route.tab === "dossier") inner = viewDossier(route.id);
  else if (route) inner = viewReconciliation(route.id);
  else inner = viewOverview();
  root.innerHTML = shell(path, inner) + '<div id="modal-host"></div>';
  renderModal();
}

/* report "streaming" — reveals the engine-authored draft line by line, like the SSE stream.
   Patches only the report panel so typing elsewhere on the page is never interrupted. */
function startReport() {
  clearTimeout(reportTimer);
  reportGen += 1;
  const gen = reportGen;
  reportShown = 0;
  const route = caseRoute(currentPath());
  if (!route || route.tab !== "reconciliation") return;
  const lines = fbReport(reconcileCase(route.id)).split("\n");
  const step = () => {
    if (gen !== reportGen) return;
    reportShown += 1;
    const body = document.getElementById("report-body");
    const badge = document.getElementById("report-badge");
    if (!body) return;
    const streaming = reportShown < lines.length;
    body.innerHTML = renderMd(lines.slice(0, reportShown).join("\n")) + (streaming ? '<span class="cursor">▍</span>' : "");
    if (badge) badge.innerHTML = verifyBadge(streaming ? null : "deterministic-fallback");
    if (streaming) reportTimer = setTimeout(step, 55);
  };
  reportTimer = setTimeout(step, 120);
}

window.addEventListener("hashchange", () => {
  modal = null;
  extraction = null; letterText = ""; respLabel = ""; respAmount = ""; respDoc = "";
  confirmDelete = null;
  render();
  if (currentPath().startsWith("/cases/")) startReport();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal) { modal = null; renderModal(); }
});

/* ------------------------------------------------------------------ events */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-close],[data-case],[data-drill],[data-act],[data-fam],[data-sev],[data-gap],[data-kind],[data-del],[data-delask],[data-delcancel],[data-remove],[data-calc],[data-calcdel]");
  if (!t) return;

  if (t.hasAttribute("data-close")) {
    // the overlay closes on click; clicks inside the dialog only close via its × button
    if (e.target.closest(".modal") && !e.target.closest(".modal-close")) return;
    modal = null; renderModal(); return;
  }
  if (t.hasAttribute("data-case")) { location.hash = "#/cases/" + t.getAttribute("data-case"); return; }

  if (t.hasAttribute("data-calc")) {
    const route = caseRoute(currentPath());
    if (!route) return;
    const label = (document.getElementById("calc-label") || {}).value || "";
    const amount = Number((document.getElementById("calc-amount") || {}).value || 0);
    const op = (document.getElementById("calc-op") || {}).value || "sum";
    const column = (document.getElementById("calc-col") || {}).value || "";
    const docName = (document.getElementById("calc-doc") || {}).value || "";
    if (!label.trim() || !amount) return;
    recordCalc(route.id, label.trim(), { op, column, document: docName, filters: [] }, amount);
    render();
    return;
  }
  if (t.hasAttribute("data-calcdel")) {
    const route = caseRoute(currentPath());
    if (!route) return;
    const seq = Number(t.getAttribute("data-calcdel"));
    CALCS[route.id] = (CALCS[route.id] || []).filter((c) => c.seq !== seq);
    render();
    return;
  }

  if (t.hasAttribute("data-drill")) {
    // via caseRoute, not a raw slice: "/cases/<id>/reconciliation" must not carry the tab
    // suffix into the id, or every drill-down outside the default tab misses the case.
    const route = caseRoute(currentPath());
    if (!route) return;
    openDrill(route.id, t.getAttribute("data-drill"),
      t.getAttribute("data-title") || "", t.hasAttribute("data-amount") ? Number(t.getAttribute("data-amount")) : undefined);
    return;
  }

  if (t.hasAttribute("data-fam")) { const v = t.getAttribute("data-fam"); rulesFam = rulesFam === v ? null : v; render(); return; }
  if (t.hasAttribute("data-sev")) { const v = t.getAttribute("data-sev"); rulesSev = rulesSev === v ? null : v; render(); return; }
  if (t.hasAttribute("data-gap")) { const v = t.getAttribute("data-gap"); rulesGap = rulesGap === v ? null : v; render(); return; }
  if (t.hasAttribute("data-kind")) { const v = t.getAttribute("data-kind"); rulesKind = rulesKind === v ? null : v; render(); return; }
  if (t.hasAttribute("data-delask")) { confirmDelete = t.getAttribute("data-delask"); render(); return; }
  if (t.hasAttribute("data-delcancel")) { confirmDelete = null; render(); return; }
  if (t.hasAttribute("data-del")) {
    const code = t.getAttribute("data-del");
    STATE.rules = STATE.rules.filter((r) => r.code !== code);
    confirmDelete = null; render(); return;
  }
  if (t.hasAttribute("data-remove")) {
    const seq = Number(t.getAttribute("data-remove"));
    const cid = decodeURIComponent(currentPath().slice(7));
    STATE.responses[cid] = (STATE.responses[cid] || []).filter((r) => r.seq !== seq);
    render(); startReport(); return;
  }

  const act = t.getAttribute("data-act");
  if (act === "reset") {
    if (resetState === "idle") { resetState = "confirm"; render(); return; }
    STATE = { rules: SEED_RULES.map((r) => ({ ...r })), responses: {} };
    resetState = "idle";
    render();
    return;
  }
  if (act === "sample-letter") {
    const cid = decodeURIComponent(currentPath().slice(7));
    const difference = Math.max(0, Math.round(reconcileCase(cid).unexplained));
    letterText = "Dear Sir/Madam,\n\nFurther to your enquiry regarding our Q1 2025 VAT return, we confirm that the " +
      "difference of SAR " + difference.toLocaleString("en-US") +
      " between your reconstruction and our declared output VAT relates to standard-rated sales that were " +
      "invoiced and delivered in December 2024 and already declared in our prior-period (Q4 2024) return. " +
      "The clearance timestamps fell in early January 2025, which is why they appear in this period's e-invoice " +
      "data. Our sales ledger and the prior return are attached as supporting evidence.\n\nRegards,\nFinance Department";
    extraction = null;
    render();
    return;
  }
  if (act === "analyse") {
    // No backend and no API key: this is exactly what llm.read_letter returns in that state.
    extraction = {
      explains_gap: false, category: "none",
      summary: "Automated reading is unavailable — review the letter and enter the amount by hand.",
      quote: "", proposed_amount: 0, confidence: "low",
      caveat: "Enter and confirm the amount manually from the letter.",
      source: "deterministic-fallback",
    };
    render();
    return;
  }
  if (act === "use-extraction") {
    if (!extraction) return;
    respLabel = extraction.summary;
    respAmount = String(Math.max(0, Math.round(extraction.proposed_amount)));
    respDoc = "taxpayer_letter.pdf";
    render();
    return;
  }
  if (act === "sample-resp") {
    const cid = decodeURIComponent(currentPath().slice(7));
    const difference = reconcileCase(cid).unexplained;
    respLabel = "Sales ledger provided by the taxpayer shows the difference relates to prior-period invoices already declared in an earlier return.";
    respAmount = String(Math.max(0, Math.round(difference)));
    respDoc = "sales_ledger_Q1-2025.xlsx";
    render();
    return;
  }
  if (act === "record") {
    const cid = decodeURIComponent(currentPath().slice(7));
    if (!respLabel.trim() || !respAmount) return;
    const list = STATE.responses[cid] || (STATE.responses[cid] = []);
    const seq = list.length + 1;
    list.push({ seq, code: "RESP-" + String(seq).padStart(2, "0"), label: respLabel.trim(),
      amount: Math.abs(Number(respAmount)), doc_name: respDoc.trim() });
    respLabel = ""; respAmount = ""; respDoc = "";
    render(); startReport();
    return;
  }
});

document.addEventListener("change", (e) => {
  const cb = e.target.closest("[data-toggle]");
  if (!cb) return;
  const code = cb.getAttribute("data-toggle");
  const rule = STATE.rules.find((r) => r.code === code);
  if (rule) rule.enabled = cb.checked;
  render();
});

/* keep typed values without re-rendering on every keystroke */
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "rule-q") { rulesQ = e.target.value; const pos = e.target.selectionStart; render();
    const el = document.getElementById("rule-q"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } return; }
  if (id === "letter") { letterText = e.target.value; toggleDisabled('[data-act="analyse"]', !letterText.trim()); return; }
  if (id === "resp-label") { respLabel = e.target.value; syncRecordBtn(); return; }
  if (id === "resp-amount") { respAmount = e.target.value; syncRecordBtn(); return; }
  if (id === "resp-doc") { respDoc = e.target.value; return; }
});
function toggleDisabled(sel, disabled) { const b = document.querySelector(sel); if (b) b.disabled = disabled; }
function syncRecordBtn() { toggleDisabled('[data-act="record"]', !(respLabel.trim() && respAmount)); }

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest(".brow.clickable");
  if (!row) return;
  e.preventDefault();
  row.click();
});

render();
if (currentPath().startsWith("/cases/")) startReport();
</script>
