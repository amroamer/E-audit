<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E6B57'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EZC%3C/text%3E%3C/svg%3E">
  <title>ZATCA VAT Audit Agent</title>
<style>
/* ZATCA VAT Audit Agent — design system (ported verbatim from frontend/src/theme.css) */
:root{
  --brand:#0E6B57; --brand-deep:#0A4C40; --brand-tint:#E6F0EB; --gold:#A9803F;
  --bg:#EDF2EF; --surface:#FFFFFF; --surface-2:#F5F9F7;
  --ink:#14201C; --muted:#5B6A63; --faint:#8A968F; --line:#DCE6E0;
  --high:#B23A36; --high-bg:#F7E7E6; --med:#A9761E; --med-bg:#F6EDDD; --low:#2C7A58; --low-bg:#E2F0E9;
  --shadow:0 1px 2px rgba(16,40,32,.05), 0 8px 24px -14px rgba(16,40,32,.18);
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#3FB79A; --brand-deep:#2C8C76; --brand-tint:#132A23; --gold:#C9A15C;
  --bg:#0C1310; --surface:#131C18; --surface-2:#0F1713;
  --ink:#E9F1EC; --muted:#9BADA4; --faint:#6E7E76; --line:#243029;
  --high:#E4736E; --high-bg:#2A1917; --med:#D6A44E; --med-bg:#241D12; --low:#5FC496; --low-bg:#122A20;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --brand:#3FB79A; --brand-deep:#2C8C76; --brand-tint:#132A23; --gold:#C9A15C;
  --bg:#0C1310; --surface:#131C18; --surface-2:#0F1713;
  --ink:#E9F1EC; --muted:#9BADA4; --faint:#6E7E76; --line:#243029;
  --high:#E4736E; --high-bg:#2A1917; --med:#D6A44E; --med-bg:#241D12; --low:#5FC496; --low-bg:#122A20;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
h1{font-size:26px;letter-spacing:-.02em;margin:2px 0}
h2{font-size:17px;margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);margin:0 0 4px}
.muted{color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.side .brand b{font-size:15px;letter-spacing:.2px}
.side .brand small{display:block;color:var(--muted);font-size:11px}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.side nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.navlink .ic{width:18px;text-align:center;color:var(--faint)}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.active{background:var(--brand-tint);color:var(--brand-deep)}
:root[data-theme="dark"] .navlink.active{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .navlink.active{color:var(--brand)}}
.navlink.disabled{color:var(--faint);cursor:default}
.navgroup{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px}
.side-foot{padding:14px 18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px}

.main{min-width:0}
.page{max-width:1120px;margin:0 auto;padding:30px 30px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.tile .tn{font-size:28px;font-weight:750;letter-spacing:-.01em;color:var(--brand);font-variant-numeric:tabular-nums}
.tile .tl{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.35}
.tile .tnote{font-size:11px;color:var(--faint);margin-top:6px;text-transform:uppercase;letter-spacing:.5px}

/* panel + table */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.tablescroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:650;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.rowlink{cursor:pointer}
.rowlink:hover td{background:var(--surface-2)}
td .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.notice{padding:18px;color:var(--muted)}
.notice.err{color:var(--high)}

/* pills / badges */
.pill{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:999px;font-weight:650;background:var(--surface-2);color:var(--muted)}
.pill.status{background:var(--surface-2);color:var(--muted)}
.pill.pri-high{background:var(--high-bg);color:var(--high)}
.pill.pri-medium{background:var(--med-bg);color:var(--med)}
.pill.pri-low{background:var(--low-bg);color:var(--low)}
.pill.sev-high{background:var(--high-bg);color:var(--high)}
.pill.sev-medium{background:var(--med-bg);color:var(--med)}
.pill.sev-low{background:var(--low-bg);color:var(--low)}
.badge{font-size:11px;padding:4px 9px;border-radius:7px;font-weight:600}
.badge.gap-yes,.badge.gap-partial{background:var(--brand-tint);color:var(--brand-deep)}
:root[data-theme="dark"] .badge.gap-yes,:root[data-theme="dark"] .badge.gap-partial{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.gap-yes,:root:not([data-theme="light"]) .badge.gap-partial{color:var(--brand)}}
.badge.gap-partial{background:transparent;outline:1px dashed color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:-1px}
.badge.gap-no{background:var(--surface-2);color:var(--faint)}

/* controls + cards (Rulebook page) */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 20px}
.search{flex:1;min-width:220px}
.search input,.chip{font:inherit}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 14px;font-size:14px}
.search input:focus{outline:2px solid var(--brand);outline-offset:1px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on.sev-high{background:var(--high);border-color:var(--high)}
.chip.on.sev-medium{background:var(--med);border-color:var(--med)}
.chip.on.sev-low{background:var(--low);border-color:var(--low)}
.rescount{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.card.sev-high{border-left-color:var(--high)}.card.sev-medium{border-left-color:var(--med)}.card.sev-low{border-left-color:var(--low)}
.card-top{display:flex;justify-content:space-between;align-items:center}
.card .code{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--brand)}
.card .fam{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.card h3{font-size:15px;line-height:1.3;margin:0;font-weight:650;letter-spacing:-.01em}
.card-badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto}.side nav{flex-direction:row}.side .brand{border:none}.navgroup,.side-foot,.navlink.disabled{display:none}}
/* rule code chip, and the explanatory footer under a reconciliation panel */
.rc{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--brand-deep);background:var(--brand-tint);padding:2px 6px;border-radius:5px}
:root[data-theme="dark"] .rc{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .rc{color:var(--brand)}}
.panel-note{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.ct{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-right:4px}
/* drill-down affordance + modal (the funnel restyles .rowhint for its own rows) */
.rowhint{color:var(--faint);margin-left:6px;opacity:0;transition:opacity .12s;font-weight:700}
.linklike{border:none;background:none;color:var(--brand);font:inherit;font-size:13px;cursor:pointer;padding:0}
.linklike:hover{text-decoration:underline}
.modal-overlay{position:fixed;inset:0;background:rgba(8,16,13,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;z-index:100;animation:fade .15s ease}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px -20px rgba(0,0,0,.5);width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;animation:pop .16s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:17px;letter-spacing:-.01em}
.modal-close{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:19px;line-height:1;cursor:pointer}
.modal-close:hover{color:var(--ink);border-color:var(--brand)}
.modal-body{padding:18px 20px;overflow:auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 14px}
.kv>div{background:var(--surface);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kv .v{font-size:14px;font-variant-numeric:tabular-nums}
.detail-note{color:var(--muted);font-size:13.5px;line-height:1.55;margin:2px 0 14px}
.formula{display:flex;flex-direction:column;gap:5px;margin:2px 0 12px}
.formula .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.formula code{font-size:12.5px}
.rulecard{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--surface-2)}
.rc-top{display:flex;align-items:center;gap:10px}
.rc-link{margin-left:auto;font-size:12px}
.rc-title{font-weight:650;margin-top:6px;font-size:14.5px}
.rc-meta{font-size:12px;color:var(--muted);margin-top:3px}
.inv-table{font-size:12.5px;min-width:560px}
.inv-table th,.inv-table td{padding:7px 10px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
/* AI surfaces */
:root{--ai:#6d4bd8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ai:#a892ff}}
:root[data-theme="dark"]{--ai:#a892ff}
.page{display:flex;flex-direction:column;gap:22px}
.page-head{margin-bottom:0}
.tiles{margin-bottom:0}
.ai-h{display:flex;align-items:center;gap:10px}
.ai-chip{background:color-mix(in srgb,var(--ai) 15%, transparent);color:var(--ai);font-size:10px;font-weight:800;letter-spacing:.7px;padding:3px 7px;border-radius:6px}
.ai-body{padding:16px 18px;font-size:14px;line-height:1.6}
.brief-head{font-weight:600;margin:0 0 8px}
.brief-points{margin:0 0 6px;padding-left:18px}
.brief-points li{margin:3px 0}
.nba-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.nba-top .pill{text-transform:capitalize}
.ai-body.md h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--brand-deep);margin:16px 0 6px}
:root[data-theme="dark"] .ai-body.md h4{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ai-body.md h4{color:var(--brand)}}
.ai-body.md h4:first-child{margin-top:0}
.ai-body.md p{margin:6px 0}.ai-body.md ul{margin:6px 0;padding-left:18px}.ai-body.md li{margin:3px 0}
.pscore{display:inline-block;min-width:32px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 9px;border-radius:8px;cursor:help}
.pscore.pri-high{background:var(--high-bg);color:var(--high)}
.pscore.pri-medium{background:var(--med-bg);color:var(--med)}
.pscore.pri-low{background:var(--low-bg);color:var(--low)}
.resp-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.resp-item{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.5}
.resp-amt{white-space:nowrap;font-weight:650;font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:center;color:var(--low)}
.resp-form{display:flex;flex-direction:column;gap:9px}
.resp-row{display:flex;gap:9px}
.resp-row input:first-child{max-width:280px}
.resp-form input{flex:1;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:0 13px;font:inherit;font-size:13.5px}
.resp-form input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.resp-form input::placeholder{color:var(--faint)}
.resp-actions{display:flex;align-items:center;gap:16px;margin-top:3px}
.btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:10px 18px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:var(--brand-deep)}
.btn:disabled{opacity:.55;cursor:default}
.btn-ghost{background:transparent;color:var(--brand);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--brand)}
.btn-ghost.confirm{background:var(--high-bg);color:var(--high);border-color:var(--high)}
.btn-ghost:disabled{opacity:.6;cursor:default}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.foot-right{display:inline-flex;align-items:center;gap:11px}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch-track{width:34px;height:19px;border-radius:19px;background:var(--line);position:relative;transition:background .16s;flex:none}
.switch-thumb{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .16s}
.switch input:checked + .switch-track{background:var(--brand)}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(15px)}
.switch input:focus-visible + .switch-track{outline:2px solid var(--brand);outline-offset:2px}
.switch-label{font-size:12px;font-weight:600;color:var(--muted)}
.switch input:checked ~ .switch-label{color:var(--brand)}
.live-badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--ai);text-transform:uppercase;white-space:nowrap}
.card-del{width:26px;height:26px;border:1px solid var(--line);background:transparent;color:var(--faint);border-radius:7px;font-size:16px;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.card-del:hover{border-color:var(--high);color:var(--high);background:var(--high-bg)}
.del-confirm{display:inline-flex;gap:11px;align-items:center}
.linklike.danger{color:var(--high);font-weight:650}
.card.off{opacity:.6}
.card.off h3{text-decoration:line-through;text-decoration-color:var(--faint)}
.minibar{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.minibar b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;margin-left:5px}
.letter{display:flex;flex-direction:column;gap:10px}
.letter-head{display:flex;align-items:center;gap:9px;font-size:12.5px}
.letter-input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;font-size:13.5px;line-height:1.55;resize:vertical;min-height:96px;width:100%}
.letter-input:focus{outline:2px solid var(--ai);outline-offset:1px;border-color:transparent}
.letter-input::placeholder{color:var(--faint)}
.extract-card{border:1px solid var(--ai);background:color-mix(in srgb, var(--ai) 7%, transparent);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:10px}
.extract-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.extract-summary{margin:0;font-size:14px;font-weight:550;line-height:1.5;color:var(--ink)}
.extract-quote{margin:0;padding:8px 12px;border-left:3px solid var(--ai);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13px;font-style:italic;color:var(--muted)}
.extract-caveat{margin:0;font-size:12.5px;color:var(--med)}
.extract-note{margin:0;font-size:11.5px;color:var(--faint)}
.btn.ghost-fill{align-self:flex-start;background:var(--ai)}
.btn.ghost-fill:hover:not(:disabled){filter:brightness(1.08)}
.resp-divider{display:flex;align-items:center;text-align:center;gap:12px;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.resp-divider::before,.resp-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.cursor{color:var(--brand);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.modal-overlay,.modal,.cursor{animation:none!important}}

/* rule taxonomy — explanation / mistake / risk */
.card-kind{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:-2px}
.kindtag{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.kindtag.kind-explanation{background:var(--low-bg);color:var(--low)}
.kindtag.kind-mistake{background:var(--high-bg);color:var(--high)}
.kindtag.kind-risk{background:var(--med-bg);color:var(--med)}
.stagetag{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.chip.on.kind-explanation{background:var(--low);border-color:var(--low)}
.chip.on.kind-mistake{background:var(--high);border-color:var(--high)}
.chip.on.kind-risk{background:var(--med);border-color:var(--med)}
/* investigation */
.inv-conc{font-size:14px;line-height:1.6;margin:0 0 14px;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);border-left:3px solid var(--ai);background:var(--surface-2)}
.inv-round{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin:14px 0 8px}
.hyp{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;line-height:1.5}
.hyp.lead{border-color:var(--low);background:var(--low-bg)}
.hyp .hid{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--brand)}
.hyp .agent{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.hyp .verdict{font-size:12px;color:var(--muted);margin-top:5px}
.hyp .amt2{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:650;font-size:13px}
@media(max-width:640px){.hyp{grid-template-columns:1fr}}
/* scope card */
.scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px;margin:14px 0 16px}
.scope-col h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand-deep);margin:0 0 10px}
:root[data-theme="dark"] .scope-col h4{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .scope-col h4{color:var(--brand)}}
.scope-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.scope-list li{font-size:13px;line-height:1.45}
.scope-list b{font-weight:650}
.scope-list .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}

/* ---- additions for the standalone build (classes the React app used but theme.css never defined) */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.side-foot b{display:block;color:var(--muted);font-weight:650;margin-bottom:2px}
a.navlink{cursor:pointer}

/* ============================================================ case lifecycle
   Added with the dossier / casework pages. A case is worked left to right: what we already
   hold, what we ask for and chase, then what it means. */
.casetabs{display:flex;gap:8px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.casetab{display:flex;flex-direction:column;gap:1px;padding:9px 14px 11px;border-bottom:2px solid transparent;
  text-decoration:none;color:var(--muted);transition:color .15s,border-color .15s}
.casetab b{font-size:13.5px;font-weight:600}
.casetab small{font-size:11px;color:var(--faint)}
.casetab:hover{color:var(--ink)}
.casetab.active{color:var(--brand);border-bottom-color:var(--brand)}
.casetab.active b{color:var(--brand)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}}
.panel-body{padding:14px 16px 16px}
.panel-body h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand-deep);margin:18px 0 8px}
.panel-body h4:first-child{margin-top:0}
:root[data-theme="dark"] .panel-body h4{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel-body h4{color:var(--brand)}}
.chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sub{font-size:12px;color:var(--muted)}
.dim{opacity:.5}
.error{background:var(--high-bg);color:var(--high);border:1px solid var(--high);border-radius:10px;padding:10px 14px;font-size:13px}
.actions{display:flex;gap:9px;margin-top:14px}
.btn.small{padding:6px 12px;font-size:12.5px;text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--brand)}
.chip-det{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--brand-deep);
  background:var(--brand-tint);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
:root[data-theme="dark"] .chip-det{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip-det{color:var(--brand)}}
.chip-ai{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#fff;
  background:var(--gold);border-radius:5px;padding:2px 6px;margin-left:7px}

/* a horizontal proportion meter — distinct from .ftrack, the funnel's absolute-scale track */
.meter{display:inline-block;vertical-align:middle;width:74px;height:7px;border-radius:4px;background:var(--surface-2);
  border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:3px}
.meter i.warn{background:var(--high)}

.callout{border-radius:10px;padding:11px 14px;font-size:13px;margin:14px 0 0;border:1px solid var(--line);background:var(--surface-2)}
.callout.warn{background:var(--med-bg);border-color:var(--med);color:var(--ink)}
.callout.ok{background:var(--low-bg);border-color:var(--low);color:var(--ink)}
.drill{margin-top:14px}
.drill>summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--brand);padding:6px 0}

/* ---- dossier: what ZATCA already holds */
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.srccard{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2);opacity:.6}
.srccard.held{opacity:1;background:var(--surface);border-color:var(--brand)}
.srccard b{display:block;font-size:13px;font-weight:600}
.srccard small{display:block;font-size:11px;color:var(--muted)}
.srcmark{font-weight:700;color:var(--faint);line-height:1.35}
.srccard.held .srcmark{color:var(--brand)}
.acts{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.acts li{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---- precedent */
.outcome-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:0 0 16px}
.ob-seg{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:#fff;
  white-space:nowrap;transition:width .5s ease}
.ob-clear{background:var(--low)}
.ob-finding{background:var(--high)}
.prec-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:900px){.prec-grid{grid-template-columns:1fr}}
.tally{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.tally li{display:flex;align-items:center;gap:9px;font-size:12.5px}
.tally li b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.prec-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0 0}
.prec-facts>div{background:var(--surface);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.prec-facts .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.prec-facts .v{font-size:14px;font-variant-numeric:tabular-nums}

/* ---- casework: the plan */
.planlist{display:flex;flex-direction:column;gap:9px}
.planitem{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:9px;
  padding:10px 13px;background:var(--surface-2)}
.planitem.dropped{border-left-color:var(--faint);opacity:.75}
.pi-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.planitem .sub{margin:0}
.cols{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:7px 0 0}
.cols .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-right:3px}

/* ---- casework: gaps and letters */
.gaps{display:flex;flex-direction:column;gap:14px}
.gapgroup h4{margin:0 0 7px}
.gap{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface-2);margin-bottom:6px}
.gap.blocking{border-left:3px solid var(--high)}
.gap.advisory{border-left:3px solid var(--med)}
.gap p{margin:0;font-size:13px}
.gap small{display:block;color:var(--faint);font-size:11px;margin-top:3px}
.letterpre{white-space:pre-wrap;font-family:var(--sans);font-size:13px;line-height:1.6;margin:0;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;max-height:520px;overflow:auto}
.uploadbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 4px;padding:11px 13px;
  border:1px dashed var(--line);border-radius:10px;background:var(--surface-2)}
.uploadbar select,.uploadbar input[type=file]{font:inherit;font-size:12.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px}

/* ---- the lifecycle rail: where the case is, and whose move it is */
.rail{margin:0 0 18px}
.rail-track{display:flex;gap:6px;align-items:stretch}
.rail-stage{flex:1;display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--muted);min-width:0}
.rail-stage .rs-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-stage .rs-mark{font-weight:700;flex:none}
.rail-stage.done{background:var(--low-bg);border-color:var(--low);color:var(--low)}
.rail-stage.active{background:var(--surface);border-color:var(--brand);color:var(--brand);font-weight:650;
  box-shadow:0 0 0 1px var(--brand) inset}
.rail-stage.waiting{background:var(--med-bg);border-color:var(--med);color:var(--med);font-weight:650}
.rail-stage.skipped{opacity:.55;border-style:dashed}
.rail-stage.pending{opacity:.6}
.rail-note{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px}
@media(max-width:900px){.rail-track{flex-wrap:wrap}.rail-stage{flex:1 1 44%}}

/* ============================================================ the qualification funnel
   Replaces the reconciliation waterfall. The bars measure DOCUMENTS, not money: a rule does
   not subtract from a total, it decides which documents are in the box. Amounts are shown
   alongside so the auditor can see the size of what was set aside, never as a movement. */
.funnel{padding:6px 16px 4px}
.frow{display:grid;grid-template-columns:44px minmax(180px,1.25fr) 2fr 130px;align-items:center;
  gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:none}
.frow.clickable{cursor:pointer;border-radius:8px}
.frow.clickable:hover{background:var(--surface-2)}
.frow .fcount{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;
  font-weight:650;text-align:right;color:var(--ink)}
.frow.exclude .fcount,.frow.defer .fcount{color:var(--med)}
.frow.qualified .fcount{color:var(--brand)}
.frow .flbl{font-size:13.5px;display:flex;align-items:center;gap:8px;min-width:0}
.frow .flbl .rowhint{margin-left:auto;color:var(--faint);opacity:0;transition:opacity .12s}
.frow.clickable:hover .flbl .rowhint{opacity:1}
.frow .ftrack{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  overflow:hidden}
.frow .fbar{height:100%;border-radius:5px;transition:width .5s ease}
.fbar.population{background:color-mix(in srgb,var(--muted) 45%, var(--surface))}
.fbar.exclude,.fbar.defer{background:color-mix(in srgb,var(--med) 60%, var(--surface))}
.fbar.qualified{background:var(--brand-deep)}
.frow .famt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
  text-align:right;color:var(--muted)}
.frow.qualified .famt{color:var(--ink);font-weight:650;font-size:14.5px}
.frow.population{opacity:.75}
.frow.qualified{border-top:2px solid var(--line);padding-top:12px}

.fcomp{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 4px;margin-left:56px}
.fchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
.fchip:hover{border-color:var(--brand);color:var(--ink)}
.fchip b{color:var(--ink);font-variant-numeric:tabular-nums}
.fchip span{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.fchip span.neg{color:var(--high)}

/* expected − declared = difference */
.compare{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;padding:14px 16px 4px}
.cmp{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;
  font:inherit;cursor:pointer;transition:border-color .15s}
.cmp:hover{border-color:var(--brand)}
.cmp .cl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.cmp .cn{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:650;
  letter-spacing:-.02em}
.cmp .cs{font-size:11.5px;color:var(--faint)}
.cop{align-self:center;font-size:19px;color:var(--faint);font-weight:600}
.cmp.result.risk{background:var(--high-bg);border-color:var(--high)}
.cmp.result.risk .cn{color:var(--high)}
.cmp.result.ok{background:var(--low-bg);border-color:var(--low)}
.cmp.result.ok .cn{color:var(--low)}
.cmp.result.warn{background:var(--med-bg);border-color:var(--med)}
.cmp.result.warn .cn{color:var(--med)}
@media(max-width:820px){.compare{flex-direction:column}.cop{align-self:flex-start;padding-left:8px}}

/* taxpayer evidence — the only thing that accounts for a difference after qualification */
.evidence{padding:14px 16px 0}
.evidence h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand-deep);margin:0 0 8px}
:root[data-theme="dark"] .evidence h4{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .evidence h4{color:var(--brand)}}
.erow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  border-bottom:1px solid var(--line);padding:8px 0;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.erow:hover{background:var(--surface-2)}
.erow .elbl{flex:1;min-width:0}
.erow .eamt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.erow.total{cursor:default;font-weight:650;border-bottom:none;border-top:2px solid var(--line)}
.erow.total:hover{background:none}

/* ---- synced from theme.css: the post-receipt panels */
input.letter-input,select.letter-input{min-height:0}
   Intake (who they are, what arrived), the auditor's own calculations, the findings in the
   Authority's wording, and the reasoning behind each hypothesis. */
.ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--line)}
.ctx-block{background:var(--surface);padding:16px 18px}
.ctx-block h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.acts li{display:flex;align-items:center;gap:7px;font-size:13px;line-height:1.4;flex-wrap:wrap}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.kv2>div{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:600}
.causes{margin-top:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-actions{display:flex;align-items:center;gap:12px;margin-top:11px;flex-wrap:wrap}
.parsed-head{display:flex;align-items:baseline;gap:14px;margin:18px 0 10px;flex-wrap:wrap;
  padding-top:14px;border-top:1px solid var(--line)}
.parsed-item{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,background .12s}
.parsed-item:hover{background:var(--surface-2)}
.parsed-item.on{border-color:var(--brand);background:var(--brand-tint)}
:root[data-theme="dark"] .parsed-item.on{background:transparent}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .parsed-item.on{background:transparent}}
.parsed-item input{margin-top:3px;flex:none}
.parsed-item b{display:inline-flex;align-items:center;gap:8px}
.cols{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;
  cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--brand);background:var(--brand-tint)}
:root[data-theme="dark"] .dropzone:hover,:root[data-theme="dark"] .dropzone.over{background:var(--surface-2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .dropzone:hover,
  :root:not([data-theme="light"]) .dropzone.over{background:var(--surface-2)}}
.factstrip{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;background:var(--surface)}
.fact{flex:1 1 165px;min-width:165px;padding:9px 13px;display:flex;flex-direction:column;gap:3px;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact:last-child{border-right:none}
.fact-k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fact-v{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.who2{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));
  border-top:1px solid var(--line)}
.who-col{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.who-col:last-child{border-right:none}
.who-col h4{margin:0 0 10px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.actlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.actlist li{display:flex;align-items:baseline;gap:9px;font-size:13px;flex-wrap:wrap}
.isic{color:var(--muted);font-size:12px;flex:none}
.actname{flex:1;min-width:120px}
.hist-line{margin:0;font-size:13.5px;font-weight:600}
.verdict-line{margin:0;font-size:14.5px;font-weight:600;line-height:1.5}
.ag-shared{margin:0 0 10px;padding:8px 11px;border-left:3px solid var(--brand);
  background:var(--brand-tint);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--muted)}
:root[data-theme="dark"] .ag-shared{background:var(--surface-2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ag-shared{background:var(--surface-2)}}
.chase{border-top:1px solid var(--line);padding:14px 18px 16px}
.chase-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:10px;flex-wrap:wrap}
.chase-head h4{margin:0;font-size:13px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted)}
.partylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.partylist li{display:flex;flex-direction:column;gap:2px;font-size:13px;overflow-wrap:anywhere}
.soonlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;
  font-size:13px;color:var(--muted)}
.soonlist b{color:var(--text)}
.panel.soon{opacity:.85}
@media(max-width:760px){.who-col{border-right:none;border-bottom:1px solid var(--line)}}
.rep{padding:4px 18px 16px}
.rep-sec{margin-top:16px}
.rep-sec h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-deep);
  margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
:root[data-theme="dark"] .rep-sec h3{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .rep-sec h3{color:var(--brand)}}
.rep-row{display:grid;grid-template-columns:minmax(150px,26%) 1fr;gap:12px;padding:6px 0;
  border-bottom:1px solid var(--line-soft,var(--line))}
.rep-row:last-child{border-bottom:none}
.rep-k{font-weight:600;font-size:13px;color:var(--muted)}
.rep-v{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.rep-v.gap{color:#9a6b00;font-weight:600}
.rep-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:640px){.rep-row{grid-template-columns:1fr;gap:2px}}
.dropacts{display:flex;gap:9px;justify-content:center;margin-top:10px}
.btn.ghost{background:var(--surface);color:var(--brand-deep);border:1px solid var(--line);
  font-weight:600;padding:6px 13px;font-size:13px}
.btn.ghost:hover{border-color:var(--brand);background:var(--brand-tint)}
:root[data-theme="dark"] .btn.ghost{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--brand)}}
.docrow .note{color:var(--warn-deep,#9a6b00);font-weight:600}
.doclist{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.docrow{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;
  flex-direction:column;gap:4px}
.calc-tabs{display:flex;gap:8px;padding:14px 18px 0}
.calc-tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;
  font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer}
.calc-tab.on{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-tint)}

<script>
"use strict";
/* =============================================================================
   E-AUDIT — standalone portal build.

   This file is a no-backend port of the React workbench in frontend/src. The
   deterministic core (backend/app/recon_engine.py + priority.py) is re-implemented
   below in JavaScript and runs in the browser over the seeded demo data, so the
   bridge, the rule toggles and the taxpayer-response loop all still recompute live.

   The core invariant is unchanged: every number on screen is computed by the
   engine below. The AI panels show the same deterministic fallbacks the real app
   renders when no ANTHROPIC_API_KEY is configured — no model output is invented here.
   ============================================================================= */

const DATA = JSON.parse(document.getElementById("demo-data").textContent);

/* "Today" is frozen to the date the demo data was generated, so the queue always
   shows the same SLA distances a freshly seeded database would. */
const DEMO_TODAY = DATA.demo_today;

const SEED_RULES = DATA.rules.map((r) => ({ ...r }));
let STATE = { rules: SEED_RULES.map((r) => ({ ...r })), responses: {} };

// ===== ENGINE START =====  (pure port of backend/app/recon_engine.py + priority.py)
const MATERIALITY_FLOOR = 1000.0;
const MATERIALITY_PCT = 0.005;
const TYPE_LABEL = { 388: "Tax invoice", 381: "Credit note", 383: "Debit note", 386: "Prepayment" };
const CREDIT_NOTE = 381;
const BOX_OUTPUT = "output", BOX_INPUT = "input";

/* The qualification registry — JS mirror of backend/app/pipeline/rules.py.
   Rules run WHILE the lines are summed, not after: each one admits, excludes or
   reassigns a line, and only the survivors are added up. */
const STAGE_ORDER = ["population", "identity", "status", "tax-point", "category",
                     "adjustment", "aggregation", "timing", "materiality", "risk"];

const QUALIFICATION_RULES = [
  // --- structural: the population boundary, never toggleable
  {
    code: "", stage: "status", action: "exclude", reason_code: "D06",
    note: "Rejected, cancelled or superseded documents are not evidence of a supply.",
    match: (l) => l.status !== "cleared" && l.status !== "reported",
  },
  {
    code: "", stage: "category", action: "exclude", reason_code: "S01",
    note: "Not standard-rated. Zero-rated, exempt and out-of-scope boxes are outside this PoC.",
    match: (l) => l.category !== "S",
  },
  {
    code: "", stage: "category", action: "exclude", reason_code: "R07",
    note: "Standard-rated at a rate other than 15% — the 5% transitional box is out of scope.",
    match: (l) => l.category === "S" && l.rate !== 15,
  },
  // --- coded: change the expected return; toggling one in the Rulebook moves the number
  {
    code: "OUT-07", stage: "tax-point", action: "defer-next", direction: "sale",
    reason_code: "T02", label: "Clearance lag — invoices delivered in the next period",
    note: "Issued within the period but delivered in the next period (tax-point / clearance " +
      "lag) — the supply belongs to the following return.",
    match: (l, periodTo) => l.type_code !== CREDIT_NOTE && l.delivery_date && l.delivery_date > periodTo,
  },
  {
    // The sector rule from the auditor session. Supplies to a government body are commonly
    // not recognised until the invoice clears the procurement platform, which can be months
    // after the transaction period. Scoped to the counterparty — the same delay on a
    // commercial customer is not this rule, and deferring it would be wrong.
    code: "OUT-11", stage: "tax-point", action: "defer-next", direction: "sale",
    reason_code: "T02", label: "Government supplies awaiting platform approval (Etimad)",
    note: "Supplied to a government body and not yet approved on the procurement platform " +
      "at the period end — recognition, and the output VAT, fall in a later return.",
    match: (l, periodTo) => l.counterparty_class === "government" &&
      l.type_code !== CREDIT_NOTE && l.approval_date && l.approval_date > periodTo,
  },
  {
    code: "INP-09", stage: "tax-point", action: "defer-next", direction: "purchase",
    reason_code: "T02", label: "Input claimed in the wrong / a late period",
    note: "Purchase invoices delivered in the next period — the input belongs to the " +
      "following return.",
    match: (l, periodTo) => l.type_code !== CREDIT_NOTE && l.delivery_date && l.delivery_date > periodTo,
  },
  {
    code: "COR-01", stage: "adjustment", action: "admit", direction: "sale",
    reason_code: "D03", label: "Credit notes (381) netted against sales",
    excludeWhenDisabled: true,
    note: "Credit notes reduce output VAT and belong in the expected return. Disabling " +
      "COR-01 removes them from the reconstruction.",
    match: (l) => l.type_code === CREDIT_NOTE,
  },
  {
    code: "COR-02", stage: "adjustment", action: "admit", direction: "purchase",
    reason_code: "D03", label: "Supplier credit notes (381) netted against purchases",
    excludeWhenDisabled: true,
    note: "Supplier credit notes reduce recoverable input VAT and belong in the expected " +
      "return. Disabling COR-02 removes them from the reconstruction.",
    match: (l) => l.type_code === CREDIT_NOTE,
  },
];

function rulesInOrder(direction) {
  return QUALIFICATION_RULES
    .filter((r) => !r.direction || r.direction === direction)
    .slice()
    .sort((a, b) => STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage));
}

function wiredCodes() { return new Set(QUALIFICATION_RULES.filter((r) => r.code).map((r) => r.code)); }

/* Walk every line through the stages; only survivors are summed. */
function qualify(rows, direction, periodTo) {
  const ordered = rulesInOrder(direction);
  const structural = ordered.filter((r) => !r.code);
  const coded = ordered.filter((r) => r.code);
  const decide = (rule, verdict) => ({
    stage: rule.stage, rule_code: rule.code, reason_code: rule.reason_code,
    verdict, note: rule.note, label: rule.label || "",
  });
  return rows.map((row) => {
    const line = { row, inPopulation: true, admitted: true, period: "current",
                   matched: new Set(), decisions: [] };
    for (const rule of structural) {
      if (rule.match(row, periodTo)) {
        line.inPopulation = false; line.admitted = false;
        line.decisions.push(decide(rule, "excluded"));
        break;
      }
    }
    if (line.inPopulation) {
      for (const rule of coded) {
        if (!rule.match(row, periodTo)) continue;
        line.matched.add(rule.code);
        const live = ruleOn(rule.code);
        if (rule.action === "defer-next" && live) {
          line.period = "next"; line.decisions.push(decide(rule, "deferred-next")); break;
        }
        if (rule.action === "exclude" && live) {
          line.admitted = false; line.decisions.push(decide(rule, "excluded")); break;
        }
        if (rule.action === "admit") {
          if (live) { line.decisions.push(decide(rule, "admitted")); }
          else if (rule.excludeWhenDisabled) {
            line.admitted = false; line.decisions.push(decide(rule, "excluded")); break;
          }
        }
      }
    }
    line.counted = line.inPopulation && line.admitted && line.period === "current";
    return line;
  });
}

/* Sum what qualifies, and record how the population narrowed to it.

   There is no baseline here, deliberately. A pre-qualification total would have to include
   documents the rules put in another period and exclude documents the rules admit, purely so
   a waterfall could be drawn from it — it would correspond to nothing. The rules decide which
   lines are in this box for this period; the sum follows. */
const TYPE_PLURAL = { 388: "Tax invoices", 381: "Credit notes", 383: "Debit notes",
                      386: "Prepayment invoices" };

function terminalDecision(line) {
  for (let i = line.decisions.length - 1; i >= 0; i -= 1) {
    const d = line.decisions[i];
    if (d.verdict === "excluded" || d.verdict === "deferred-next") return d;
  }
  return null;
}

function compose(lines, direction) {
  const counted = lines.filter((l) => l.counted);
  const stageRank = {};
  rulesInOrder(direction).forEach((r, i) => { stageRank[r.stage] = i; });

  const groups = new Map();
  for (const line of lines) {
    if (line.counted) continue;
    const d = terminalDecision(line);
    if (!d) continue;
    const key = d.stage + "|" + d.rule_code + "|" + d.verdict;
    let g = groups.get(key);
    if (!g) {
      g = { stage: d.stage, rule: d.rule_code || null, verdict: d.verdict,
            reason_code: d.reason_code, label: d.label || d.note, note: d.note,
            count: 0, amount: 0, lines: [] };
      groups.set(key, g);
    }
    g.count += 1;
    g.amount = r2(g.amount + line.row.s_tax);
    g.lines.push(line);
  }
  const funnel = [...groups.values()].sort((a, b) => {
    const sa = stageRank[a.stage] === undefined ? 99 : stageRank[a.stage];
    const sb = stageRank[b.stage] === undefined ? 99 : stageRank[b.stage];
    if (sa !== sb) return sa - sb;
    return (a.rule || "").localeCompare(b.rule || "");
  });

  const byType = new Map();
  for (const line of counted) {
    const code = Number(line.row.type_code);
    let c = byType.get(code);
    if (!c) {
      c = { type_code: code, label: TYPE_PLURAL[code] || ("Type " + code),
            count: 0, amount: 0, lines: [] };
      byType.set(code, c);
    }
    c.count += 1;
    c.amount = r2(c.amount + line.row.s_tax);
    c.lines.push(line);
  }
  const composition = [...byType.values()].sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount));

  return {
    expected_vat: r2(counted.reduce((s2, l) => s2 + l.row.s_tax, 0)),
    expected_base: r2(counted.reduce((s2, l) => s2 + l.row.s_base, 0)),
    counted: counted.length, countedLines: counted,
    population: lines.length, populationLines: lines,
    funnel, composition,
  };
}

/* Flatten invoices to the tax-subtotal grain the pipeline qualifies. */
function lineRecords(invs, periodTo) {
  return invs.map((inv) => ({
    ...inv, category: "S", rate: 15, tax_amount: inv.s_tax, taxable_amount: inv.s_base,
    period_to: periodTo,
  }));
}

function lineInvoiceRows(lines) {
  const seen = new Map();
  for (const l of lines) {
    const row = invRow(l.row);
    if (seen.has(row.uuid)) seen.get(row.uuid).tax_amount = r2(seen.get(row.uuid).tax_amount + l.row.s_tax);
    else seen.set(row.uuid, row);
  }
  return [...seen.values()];
}

const REASON_LABEL = {
  D03: "Credit note", D06: "Technical rejection / resubmission",
  T02: "Invoice issued before the tax point", S01: "Exempt supply",
  R07: "Inconsistent tax-category coding",
};

function r2(n) { return Math.round((n + (n >= 0 ? 1 : -1) * 1e-9) * 100) / 100; }
function r4(n) { return Math.round((n + (n >= 0 ? 1 : -1) * 1e-9) * 10000) / 10000; }

/* Python's round() is half-to-even; the priority score depends on it. */
function pyRound(x) {
  const f = Math.floor(x);
  if (Math.abs(x - f - 0.5) < 1e-9) return f % 2 === 0 ? f : f + 1;
  return Math.round(x);
}

function sar(n) {
  return "SAR " + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function daysBetween(fromISO, toISO) {
  return Math.round((Date.parse(toISO) - Date.parse(fromISO)) / 86400000);
}

function rulesOf() { return STATE.rules; }
function getRule(code) { return rulesOf().find((r) => r.code === code) || null; }
function ruleOn(code) { const r = getRule(code); return !!(r && r.enabled); }
function rinfo(code) {
  const r = getRule(code);
  if (!r) return { code };
  return { code: r.code, family: r.family, title: r.title, explains_gap: r.explains_gap, severity: r.severity };
}

function invRow(inv) {
  const row = {
    uuid: inv.uuid,
    type_code: inv.type_code,
    type: TYPE_LABEL[inv.type_code] || String(inv.type_code),
    issue_date: inv.issue_date,
    delivery_date: inv.delivery_date,
    status: inv.status,
    base: r2(inv.s_base),
    tax_amount: r2(inv.s_tax),
  };
  // A line from an uploaded listing cites its file and row instead of a UUID — that is the
  // only citation a spreadsheet can offer, and it is what lets the auditor open the source.
  if (inv.source === "document") { row.document = inv.document; row.row_number = inv.row_number; }
  return row;
}

function taxpayerById(id) { return DATA.taxpayers.find((t) => t.id === id); }
function caseById(cid) { return DATA.cases.find((c) => c.case_id === cid); }
function taxpayerOf(cid) {
  const c = caseById(cid);
  return (c && taxpayerById(c.taxpayer_id)) || { name: "", vat_no: "" };
}
function lastRound(cid) {
  const rounds = (((DATA.casework || {})[cid] || {}).loop || {}).rounds || [];
  return rounds[rounds.length - 1] || null;
}
function periodOf(cid) {
  const c = caseById(cid);
  return c ? fmtLongDate(c.period_from) + " to " + fmtLongDate(c.period_to) : "";
}
const fmtLongDate = (iso) => {
  const d = new Date(String(iso) + "T00:00:00Z");
  return isNaN(d.getTime()) ? String(iso || "")
    : d.toLocaleDateString("en-GB", { day: "2-digit", month: "long", year: "numeric",
                                      timeZone: "UTC" });
};
function currentReturn(taxpayerId, periodFrom) {
  return DATA.returns.find(
    (r) => r.taxpayer_id === taxpayerId && r.period_from === periodFrom && r.current_flag
  ) || null;
}
function boxOf(ret, code, direction) {
  if (!ret) return null;
  return ret.boxes.find((b) => b.box_code === code && b.direction === direction) || null;
}
function responsesOf(caseId) { return STATE.responses[caseId] || []; }

/* ------------------------------------------- qualify, sum, compare
   Mirror of backend/app/recon_engine.py::_reconstruct. The order is the whole point and
   there is no step before it: rules decide which lines belong in this box for this period,
   the qualifying lines are summed, and that sum is what the return should have said. Nothing
   is summed and then adjusted, so there is no "apparent gap" and nothing for a rule to
   explain — a rule that fires has already changed which documents count. */
function buildBox(opts) {
  const { invs, declared, direction, boxCode, boxLabel, boxTitle, periodFrom, periodTo,
          responses, ret, dbox, invoicesConsidered, findingSign, rows, sourceLabel } = opts;

  const lines = qualify(rows || lineRecords(invs, periodTo), direction, periodTo);
  const comp = compose(lines, direction);

  const funnel = [{
    seq: 0, kind: "population", rule: null, stage: "",
    label: sourceLabel || (direction === "sale" ? "Sale e-invoices on file" : "Purchase e-invoices on file"),
    count: comp.population, amount: r2(lines.reduce((s2, l) => s2 + l.row.s_tax, 0)),
    detail: {
      type: "population",
      note: "Every line in the population under review, before any rule is applied. It is a " +
        "starting point, not a figure with meaning — the rules below decide which of these " +
        "lines belong in this box.",
      count: comp.population, invoices: lineInvoiceRows(lines),
    },
  }];
  comp.funnel.forEach((g, i) => {
    funnel.push({
      seq: i + 1,
      kind: g.verdict === "deferred-next" ? "defer" : "exclude",
      rule: g.rule, stage: g.stage, reason_code: g.reason_code,
      label: g.label, count: g.count, amount: g.amount,
      detail: {
        type: g.rule ? "rule" : "structural",
        rule: g.rule ? rinfo(g.rule) : null,
        reason_code: g.reason_code, reason_label: REASON_LABEL[g.reason_code] || "",
        stage: g.stage, verdict: g.verdict, note: g.note,
        count: g.count, total: g.amount, invoices: lineInvoiceRows(g.lines),
      },
    });
  });
  funnel.push({
    seq: funnel.length, kind: "qualified", rule: null, stage: "",
    label: "Qualify for " + monthYear(periodFrom) + " – " + monthYear(periodTo),
    count: comp.counted, amount: comp.expected_vat,
    detail: {
      type: "qualified",
      formula: "Σ TAXSUBTOTAL (tax category S @ 15%) over the lines that qualified",
      note: "The lines that survived every rule, summed. This is what the return should " +
        "have declared for this box.",
      count: comp.counted, total: comp.expected_vat,
      invoices: lineInvoiceRows(comp.countedLines),
    },
  });

  const composition = comp.composition.map((c) => ({
    type_code: c.type_code, label: c.label, count: c.count, amount: c.amount,
    detail: { type: "composition", label: c.label, count: c.count, total: c.amount,
              note: c.label + " among the lines that qualified for this box.",
              invoices: lineInvoiceRows(c.lines) },
  }));

  const difference = r2(comp.expected_vat - declared);

  const evidence = [];
  let evidenceTotal = 0;
  for (const resp of responses || []) {
    const amount = r2(Math.abs(resp.amount));
    evidenceTotal = r2(evidenceTotal + amount);
    evidence.push({
      code: resp.code, label: resp.label, amount, doc_name: resp.doc_name || "",
      detail: {
        type: "response", label: resp.label, doc_name: resp.doc_name || "",
        count: 0, total: amount, invoices: [],
        note: "Evidence provided by the taxpayer" +
          (resp.doc_name ? " — " + resp.doc_name : "") +
          ". The auditor confirmed the SAR amount it accounts for; this figure is " +
          "auditor-entered, not AI-generated.",
      },
    });
  }
  let unexplained = r2(difference - evidenceTotal * (difference >= 0 ? 1 : -1));
  if (evidenceTotal && Math.abs(unexplained) > Math.abs(difference)) unexplained = 0;
  const materiality = r2(Math.max(MATERIALITY_FLOOR, MATERIALITY_PCT * declared));

  let band, state;
  if (Math.abs(unexplained) <= materiality) {
    band = Math.abs(unexplained) <= 1 ? "noise" : "immaterial"; state = "supported";
  } else if (unexplained * findingSign > 0) { band = "material"; state = "potential-finding"; }
  else { band = "material"; state = "unresolved"; }

  const declaredDetail = {
    type: "declared", box_code: boxCode, box_label: boxLabel,
    form_number: ret ? ret.form_number : null,
    data_version: ret ? ret.data_version : null,
    submission_date: ret ? ret.submission_date : null,
    base_amount: dbox ? dbox.base_amount : null,
    vat_amount: declared, adjustment: dbox ? dbox.adjustment : 0,
    note: direction === "sale"
      ? "The output VAT the taxpayer declared for this box, from the current filed return."
      : "The input VAT the taxpayer claimed for this box, from the current filed return.",
  };
  let diffNote;
  if (state === "potential-finding" && direction === "sale")
    diffNote = "Above the materiality threshold — more output VAT qualifies for this period " +
      "than the return declares, which is a potential under-declaration. Recommended next " +
      "step: request the sales ledger covering the difference.";
  else if (state === "potential-finding")
    diffNote = "Declared input VAT exceeds what the qualifying purchase e-invoices support — " +
      "a potential over-claim of recoverable input VAT. Recommended next step: request the " +
      "purchase ledger and tax invoices.";
  else if (state === "supported")
    diffNote = "Within the materiality threshold — the declared figure agrees with what " +
      "qualifies for this period. No finding.";
  else if (direction === "sale")
    diffNote = "The return declares more output VAT than qualifies for the period — the " +
      "taxpayer may have over-declared; investigate.";
  else
    diffNote = "Declared input is below what the qualifying invoices support — the taxpayer " +
      "may have under-claimed; no revenue risk to the Authority.";
  const differenceDetail = {
    type: "difference", expected: comp.expected_vat, declared, difference,
    evidence_total: evidenceTotal, unexplained, materiality, band, state, note: diffNote,
  };

  const deferredOut = lines.filter((l) => l.inPopulation && l.period === "next");
  return {
    box: boxTitle, box_code: boxCode, declared,
    expected_vat: comp.expected_vat, expected_base: comp.expected_base,
    difference, evidence_total: evidenceTotal, evidence, unexplained,
    materiality, band, state, funnel, composition,
    declared_detail: declaredDetail, difference_detail: differenceDetail,
    invoices_considered: invoicesConsidered,
    evidence_invoices: lineInvoiceRows(lines.filter((l) => l.inPopulation)),
    population_lines: comp.population, counted_lines: comp.counted,
    deferred_out: { count: deferredOut.length,
                    amount: r2(deferredOut.reduce((s2, l) => s2 + l.row.s_tax, 0)) },
  };
}

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function monthYear(iso) {
  const [y, m] = iso.split("-");
  return MONTHS[Number(m) - 1] + " " + y;
}


/* the population under review: the taxpayer's uploaded listing when there is one, the
   e-invoice feed otherwise. Mirrors recon_engine._population. */
function populationFor(caseId, direction, periodFrom, periodTo, sector) {
  const doc = pickListing(documentsFor(caseId), direction);
  if (!doc) return { rows: null, label: "", document: "" };
  const rows = docLines(doc, direction, periodFrom, periodTo, sector);
  if (!rows.length) return { rows: null, label: "", document: "" };
  const noun = direction === "sale" ? "Sale" : "Purchase";
  return { rows, label: `${noun} lines in ${doc.filename}`, document: doc.filename };
}

function reconstructInput(caseId, tp, ret, periodFrom, periodTo) {
  const pbox = boxOf(ret, "standard_rate_purchase", "purchase");
  const invs = DATA.invoices.filter((i) => i.taxpayer_id === tp.id && i.direction === "purchase");
  const pop = populationFor(caseId, "purchase", periodFrom, periodTo, tp.ind_sector);
  return buildBox({
    invs, rows: pop.rows, sourceLabel: pop.label,
    declared: r2(pbox ? pbox.vat_amount : 0), direction: "purchase",
    boxCode: "standard_rate_purchase", boxLabel: "Standard-rated purchases",
    boxTitle: "Standard-rated purchases (input VAT)",
    periodFrom, periodTo, responses: [], ret, dbox: pbox,
    invoicesConsidered: pop.rows ? pop.rows.length
      : invs.filter((i) => i.status === "cleared" || i.status === "reported").length,
    findingSign: -1,
  });
}

/* ------------------------------------------- output VAT (standard-rated sales) */
function reconcileCase(caseId) {
  const c = caseById(caseId);
  if (!c) throw new Error("case not found");
  const tp = taxpayerById(c.taxpayer_id);
  const ret = currentReturn(tp.id, c.period_from);
  const dbox = boxOf(ret, "standard_rate_sales", "sale");
  const invs = DATA.invoices.filter((i) => i.taxpayer_id === tp.id && i.direction === "sale");

  const salePop = populationFor(caseId, "sale", c.period_from, c.period_to, tp.ind_sector);
  const result = buildBox({
    invs, rows: salePop.rows, sourceLabel: salePop.label,
    declared: r2(dbox ? dbox.vat_amount : 0), direction: "sale",
    boxCode: "standard_rate_sales", boxLabel: "Standard-rated sales",
    boxTitle: "Standard-rated sales VAT",
    periodFrom: c.period_from, periodTo: c.period_to,
    responses: responsesOf(caseId), ret, dbox,
    invoicesConsidered: salePop.rows ? salePop.rows.length : invs.length, findingSign: 1,
  });
  // Which population produced the figures. The funnel looks identical either way, so the
  // provenance has to be stated rather than left to be assumed.
  result.population_source = salePop.rows ? "document" : "e-invoice";
  result.population_document = salePop.document;
  const blocking = salePop.rows
    ? gapsFor(caseId).filter((g) => g.severity === "blocking")
        .map((g) => `${g.item_label || "Response"}: ${g.detail}`)
    : [];
  result.population_complete = !blocking.length;
  result.population_caveat = blocking.length
    ? `This figure was built from ${salePop.document}, which does not yet meet the request (${plural(blocking.length, "outstanding point")}). Treat it as a floor rather than a settled expected return until the response is complete.`
    : "";
  result.population_gaps = blocking.slice(0, 6);

  const purchase = reconstructInput(caseId, tp, ret, c.period_from, c.period_to);
  const order = { "potential-finding": 3, unresolved: 2, supported: 1 };
  const outFinding = result.state === "potential-finding" ? result.unexplained : 0;
  const inFinding = purchase.state === "potential-finding" ? Math.abs(purchase.unexplained) : 0;
  const combined = {
    total_exposure: r2(outFinding + inFinding),
    priority_exposure: r2(Math.abs(result.unexplained) + inFinding),
    state: (order[result.state] || 0) >= (order[purchase.state] || 0) ? result.state : purchase.state,
    output_state: result.state,
    input_state: purchase.state,
    output_unexplained: result.unexplained,
    input_unexplained: purchase.unexplained,
    finding_boxes: [["output", result.state], ["input", purchase.state]]
      .filter((x) => x[1] === "potential-finding").map((x) => x[0]),
  };

  return { case_id: caseId, taxpayer: tp.name, ...result, purchase, combined };
}



/* ============================================================ THE POST-RECEIPT LAYER
   Ports app/outcomes.py, app/pipeline/source.py, app/agents/{roster,document_tests,
   findings,calculation}.py. Everything here recomputes in the browser, because everything
   here moves when a rule is toggled or a figure is recorded — which is the portal's rule:
   port what the user can change, embed what they cannot. */

/* ---- the auditors' finding statements, verbatim (outcomes.py) */
const OUTCOMES = {
  "PUR-NODOC": { statement: "Purchases for which input VAT cannot be deducted due to the absence of supporting documentation.", short: "No supporting documentation", agent: "Evidence & Coverage", effect: "disallows-input" },
  "PUR-BLOCKED": { statement: "Purchases for which the purchaser is not entitled to deduct input VAT.", short: "Input VAT not deductible", agent: "Regulations", effect: "disallows-input" },
  "PUR-NOCOOP": { statement: "Purchases excluded due to the taxpayer's lack of cooperation.", short: "Lack of cooperation", agent: "Evidence & Coverage", effect: "disallows-input" },
  "DOC-INVOICE": { statement: "Failure to meet all the requirements of a valid tax invoice.", short: "Invalid tax invoice", agent: "Regulations", effect: "documentation" },
  "DOC-CREDIT": { statement: "Failure to meet the required conditions for a valid credit note.", short: "Invalid credit note", agent: "Regulations", effect: "documentation" },
  "SAL-MISMATCH": { statement: "The documents provided do not correspond to the declared sales.", short: "Documents do not correspond", agent: "Evidence & Coverage", effect: "documentation" },
  "SAL-SECONDARY": { statement: "Sales from secondary business activities that were not disclosed in the VAT return.", short: "Undisclosed secondary activity", agent: "Evidence & Coverage", effect: "increases-output" },
  "SAL-HIGHER": { statement: "Sales based on the data provided by the taxpayer are higher than the sales reported in the VAT return.", short: "Submitted sales exceed declared", agent: "Calculation", effect: "increases-output" },
  "SAL-NOTB": { statement: "Sales records submitted are higher than the sales declared in the VAT return, with no trial balance provided.", short: "Exceeds declared, no trial balance", agent: "Evidence & Coverage", effect: "increases-output" },
  "SAL-POS": { statement: "Sales based on POS records or bank statements are higher than the sales amount reported in the VAT return.", short: "POS/bank exceed declared", agent: "Calculation", effect: "increases-output" },
  "SAL-POSADJ": { statement: "Adjustment of sales subject to the standard VAT rate based on POS data.", short: "Standard-rated adjustment from POS", agent: "Calculation", effect: "increases-output" },
  "SAL-UNDISCLOSED": { statement: "Sales that were not disclosed in the VAT returns.", short: "Undisclosed sales", agent: "Calculation", effect: "increases-output" },
};

/* ---- reading numbers and dates the way taxpayers actually write them (calculation.py) */
/* "line(s)" is a note the author never finished, and these sentences reach a report and a
   taxpayer letter. Mirror of `document_tests._plural`. */
const plural = (n, word, many) => n + " " + (n === 1 ? word : (many || word + "s"));

function asNumber(v) {
  if (v === null || v === undefined || typeof v === "boolean") return null;
  if (typeof v === "number") return v;
  let s = String(v).trim();
  if (!s) return null;
  let neg = false;
  const m = s.match(/^\((.*)\)$/);
  if (m) { neg = true; s = m[1]; }
  s = s.replace(/[,\s ']/g, "").replace(/^(sar|sr)\s*/i, "").replace(/%/g, "");
  if (s.startsWith("-")) { neg = true; s = s.slice(1); }
  if (!/^\d*\.?\d+$/.test(s)) return null;
  return neg ? -parseFloat(s) : parseFloat(s);
}
function asDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
