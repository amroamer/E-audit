/* Markdown, only as far as the engine's own report actually uses it. */
function renderMd(text) {
  const out = [];
  let bullets = [];
  const flush = () => {
    if (bullets.length) {
      out.push("<ul>" + bullets.map((b) => "<li>" + inlineMd(b) + "</li>").join("") + "</ul>");
      bullets = [];
    }
  };
  String(text || "").split("\n").forEach((line) => {
    if (line.startsWith("## ")) { flush(); out.push("<h4>" + esc(line.slice(3)) + "</h4>"); }
    else if (line.startsWith("### ")) { flush(); out.push("<h4>" + esc(line.slice(4)) + "</h4>"); }
    else if (line.startsWith("- ")) bullets.push(line.slice(2));
    else if (!line.trim()) flush();
    else { flush(); out.push("<p>" + inlineMd(line) + "</p>"); }
  });
  flush();
  return out.join("");
}
function inlineMd(line) {
  return esc(line)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

/* ---- the auditor's own arithmetic, in their own words

   In the app a model turns the sentence into a query. A static file has no model, so the same
   job is done by keyword matching here. Either way the parse is SHOWN before it is trusted, and
   the arithmetic is done in code — which is the property that actually matters. */

const OP_CUES = [
  [/\b(sum|summed|total(?:led|ed)?|added up|add up|adding)\b/i, "sum"],
  [/\b(distinct|unique|different)\b/i, "count_distinct"],
  [/\b(how many|count(?:ed)?|number of)\b/i, "count"],
  [/\b(average|avg|mean)\b/i, "average"],
  [/\b(largest|highest|max(?:imum)?|biggest)\b/i, "max"],
  [/\b(smallest|lowest|min(?:imum)?)\b/i, "min"],
];
const COLUMN_CUES = [
  [/\b(vat|tax)\b/i, "vat_amount"],
  [/\b(taxable|net|base|excluding vat)\b/i, "taxable_amount"],
  [/\b(customer|client|buyer)\b/i, "customer_name"],
  [/\b(supplier|vendor|seller)\b/i, "supplier_name"],
  [/\b(rate)\b/i, "vat_rate"],
];

/* The figure they say they got, if it is in the sentence. */
function statedAmountIn(text) {
  const t = String(text);
  const m = t.match(/(?:got|is|was|of|=|:|totall?ing)\s*(?:sar\s*)?([\d][\d,]*(?:\.\d+)?)/i)
    || t.match(/sar\s*([\d][\d,]*(?:\.\d+)?)/i)
    || t.match(/([\d]{1,3}(?:,[\d]{3})+(?:\.\d+)?)/);
  return m ? asNumber(m[1]) : null;
}

/* A clause this parser cannot turn into a filter. Its presence means the sentence is not a bare
   aggregation, so the reading is wrong even when the operation and column are obvious --
   totalling the whole file and then reporting the auditor's *correct* January figure as a
   disagreement is the most expensive thing this panel can do. Mirror of
   `agents/calc_language.CONDITION_RE`. */
const CONDITION_RE = new RegExp(
  "\\b(only|just the|where|excluding|except|apart from|other than|without the|" +
  "greater than|more than|over|above|less than|below|under|between|at least|" +
  "before|after|up to|dated|during|in january|in february|in march|in april|in may|in june|" +
  "in july|in august|in september|in october|in november|in december|" +
  "first (?:month|quarter|half)|second (?:month|quarter|half)|" +
  "per (?:month|customer|supplier)|by (?:month|customer|supplier)|blank|missing|empty)\\b", "i");

function parseMethod(text, docs) {
  const t = String(text || "");
  const low = t.toLowerCase();
  const op = (OP_CUES.find(([re]) => re.test(t)) || [])[1] || "";
  const doc =
    docs.find((d) => low.includes((d.filename || "").toLowerCase())) ||
    docs.find((d) => {
      const stem = (d.filename || "").split(/[._\-]/)[0].toLowerCase();
      return stem.length > 3 && low.includes(stem);
    }) ||
    (docs.length === 1 ? docs[0] : null);
  const cols = (doc && doc.columns) || [];
  // A plain count is over rows, and the executor ignores the column for it.
  let column = op === "count" ? "" :
    (cols.find((c) => low.includes(c.replace(/_/g, " "))) ||
     cols.find((c) => low.includes(c)) || "");
  if (!column && op && op !== "count") {
    for (const [re, name] of COLUMN_CUES) {
      if (re.test(t) && cols.includes(name)) { column = name; break; }
    }
  }
  if (!op) {
    return { op: "", column: "", document: "", filters: [], checkable: false,
             understood: "No calculation was recognised in that description \u2014 say whether " +
                         "it was a total, a count or an average." };
  }
  if (op !== "count" && !column) {
    return { op, column: "", document: (doc && doc.filename) || "", filters: [],
             checkable: false,
             understood: "Read as a " + op.replace("_", " ") + ", but no column in the documents " +
                         "on file matches the description." };
  }
  if (CONDITION_RE.test(t)) {
    return { op, column, document: (doc && doc.filename) || "", filters: [], checkable: false,
             understood: "That method sets a condition on which rows to include, which this " +
                         "reading cannot apply on its own." };
  }
  const said = op === "count" ? "count the rows" : op.replace("_", " ") + " of " + column;
  return { op, column, document: (doc && doc.filename) || "", filters: [], checkable: true,
           understood: said + (doc ? " in " + doc.filename : "") };
}

function investigationPanel(caseId) {
  const inv = investigate(caseId);
  const adj = Object.fromEntries(inv.adjudications.map((a) => [a.hypothesis_id, a]));
  const pill = { confirmed: "pri-high", refuted: "pri-low",
                 "insufficient-evidence": "pri-medium" };

  // Grouped by agent: fourteen rows in a flat list is unreadable, four agents is not.
  // The four named agents lead; the two checks that predate them follow, so the roster the
  // audit team agreed is what the eye lands on first.
  const ORDER = ["Regulations", "Data Entry", "Calculation", "Evidence & Coverage"];
  const byAgent = [];
  inv.hypotheses.forEach((h) => {
    let g = byAgent.find((x) => x.agent === h.agent);
    if (!g) { g = { agent: h.agent, items: [] }; byAgent.push(g); }
    g.items.push(h);
  });
  byAgent.sort((a, b) => {
    const ia = ORDER.indexOf(a.agent), ib = ORDER.indexOf(b.agent);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  const namedCount = byAgent.filter((g) => ORDER.includes(g.agent)).length;

  /* The badge says what happened, not a bare fraction. "2 of 3 confirmed" leaves an auditor
     asking what the third one was; naming the untested one is the answer, because "insufficient
     evidence" is a real verdict here -- a column that is not in the file cannot be tested, and
     saying so beats a confident answer computed from nothing. */
  const tally = (verdicts) => {
    const n = (v) => verdicts.filter((x) => x === v).length;
    const conf = n("confirmed"), ruled = n("refuted"), untested = n("insufficient-evidence");
    const parts = [];
    if (conf) parts.push(conf + " stood up");
    if (ruled) parts.push(ruled + " ruled out");
    if (untested) parts.push(untested + " could not be tested");
    return { text: parts.join(" · ") || "nothing to test", confirmed: conf };
  };

  const groups = byAgent.map((g, gi) => {
    const verdicts = g.items.map((h) => (adj[h.id] || {}).status);
    const t = tally(verdicts);
    const nConf = t.confirmed;
    // Several confirmed checks can rest on one document. Saying so is the point the auditors
    // made: a matter with more than one reason behind it is still one matter, and the amount
    // beside it is counted once.
    const bases = new Set(g.items
      .filter((h) => (adj[h.id] || {}).status === "confirmed")
      .map((h) => ((adj[h.id] || {}).detail || {}).basis)
      .filter(Boolean));
    const shared = nConf > 1 && bases.size === 1
      ? '<p class="ag-shared">All ' + nConf + ' rest on the same records, so they describe one ' +
        'matter read ' + nConf + ' ways &mdash; not ' + nConf + ' separate amounts.</p>' : "";
    const lead = gi === namedCount && namedCount < byAgent.length
      ? '<p class="detail-note" style="margin:18px 0 10px">Other checks the engine runs ' +
        'alongside the four agents.</p>' : "";
    return lead + '<div class="agentgroup">' +
      '<div class="ag-head"><h4>' + esc(g.agent) + '</h4>' +
      '<span class="sub">' + esc(AGENT_BLURB[g.agent] || "") + '</span>' +
      '<span class="pill ' + (nConf ? "pri-high" : "pri-low") + '" title="' +
      esc(g.items.length + " check" + (g.items.length === 1 ? "" : "s") + " run") + '">' +
      esc(t.text) + '</span></div>' + shared +
      g.items.map((h) => {
        const a = adj[h.id] || {};
        return '<div class="checkrow">' +
          '<div class="cr-verdict"><span class="pill ' + (pill[a.status] || "status") + '">' +
          esc(VERDICT_WORD[a.status] || a.status || "") + '</span>' +
          (a.amount ? '<div class="amt2">' + esc(sar(a.amount)) + '</div>' : "") + '</div>' +
          '<div class="cr-body">' +
          '<div class="cr-claim">' + esc(h.claim) + '</div>' +
          (h.why ? '<div class="cr-line"><span class="k">Why we looked</span>' + esc(h.why) +
            '</div>' : "") +
          (a.explanation ? '<div class="cr-line"><span class="k">What we found</span>' +
            esc(a.explanation) + '</div>' : "") +
          '</div></div>';
      }).join("") + '</div>';
  }).join("");

  return findingsPanel(inv) +
    '<div class="panel"><div class="panel-head"><h2>How the agents got there</h2>' +
    '<span class="pill status" title="Agents propose; a deterministic check settles each one. ' +
    'No model states a figure.">&#8721; ' + inv.hypotheses.length + ' checks run</span></div>' +
    '<div class="ai-body"><p class="inv-conc">' + esc(inv.conclusion) + '</p>' +
    groups +
    '<p class="detail-note" style="margin:14px 0 0">Every line above says what the agent saw, ' +
    'what it therefore tested, and what the engine concluded &mdash; so a finding can be ' +
    'defended to the taxpayer rather than asserted.</p>' +
    '</div></div>';
}

/* ================================================ the audit report, on the Authority's template

   Port of `reporting/audit_report.py` and `reporting/render.py`. The second of the two outputs
   the auditors asked for: the email, and the report.

   A field the case cannot answer says which kind of gap it is rather than being filled from a
   guess -- `[not held]` for something ZATCA holds in another system, `[for the auditor to
   complete]` for a judgement the tool has no business making. A report that quietly dropped
   them would look finished when it is not. */
const NOT_HELD = "[not held]";
const FOR_AUDITOR = "[for the auditor to complete]";
const CREATION_REASONS = "Risk Engine, Whistleblowers report, Report from OGAs, " +
  "Internal referral, Other";
const CASE_TYPES = "Comprehensive Audit, Limited Scope Audit, Refund Audit";
const TAX_TYPES = "VAT, Excise Tax, CIT, WHT";

const F = (label, value, note) => ({ label, value: value === "" || value == null ? NOT_HELD : value,
                                     note: note || "",
                                     held: !(value === NOT_HELD || value === FOR_AUDITOR ||
                                             value === "" || value == null) });

function priorityBand(score) { return score >= 60 ? "1" : (score >= 35 ? "2" : "3"); }

function auditReport(caseId) {
  const c = caseById(caseId);
  const tp = taxpayerOf(caseId);
  const recon = reconcileCase(caseId);
  const inv = investigate(caseId);
  const findings = inv.findings || [];
  const e = inv.exposure || exposureOf(findings);
  const score = (scoreCase(c) || {}).score || 0;
  const check = checkResponse(caseId);
  const docs = documentsFor(caseId);
  const round = lastRound(caseId);
  const period = periodOf(caseId);

  // ---- what was asked for and what arrived
  const lines = [];
  const items = (round && round.items) || [];
  if (items.length) {
    lines.push("Requested:");
    items.forEach((i) => lines.push("  - " + i.label));
  }
  if (docs.length) {
    lines.push("Obtained:");
    docs.forEach((d) => lines.push("  - " + d.filename + " (" +
      (d.row_count || (d.rows || []).length) + " rows, " + (d.columns || []).length +
      " columns)"));
  } else lines.push("Obtained: nothing was received.");
  const blocking = check.gaps.filter((g) => g.severity === "blocking");
  if (blocking.length) {
    lines.push("Outstanding at the date of this report (" + blocking.length + "):");
    blocking.slice(0, 10).forEach((g) =>
      lines.push("  - " + (g.item_label || "Response") + ": " + g.detail));
  }

  // ---- what the review did, and what it established
  const box = recon.box_label || "Standard-rated sales VAT";
  const activities = ["The review was conducted on the documents supplied by the taxpayer."];
  if (recon.population_document) {
    activities.push((recon.population_lines || 0) + " lines were read from " +
      recon.population_document + " and tested against the conditions for inclusion in " +
      box + " for the period.");
  }
  activities.push("The records that qualify total " + sar2(recon.expected_vat) + " against " +
    sar2(recon.declared) + " declared, a difference of " + sar2(recon.difference) + ".");
  activities.push("Four automated checks were then run over the records received — the " +
    "conditions the law sets for a document, keying and transposition errors, the totals the " +
    "records support against those declared, and whether there is supporting evidence behind " +
    "what was claimed. Each proposal was settled against the source records; the findings " +
    "below are those that were confirmed.");
  if (blocking.length) {
    activities.push("NOTE: the records supplied do not yet meet the terms of the request. The " +
      "figures above should be treated as a floor rather than a settled position.");
  }

  // ---- the findings, each amount stated once
  const found = [];
  const seen = {};
  findings.forEach((f) => {
    const basis = f.basis || f.hypothesis_id;
    const first = !seen[basis];
    seen[basis] = true;
    found.push((first ? "- " : "  Also characterised as: ") + f.statement +
      (f.amount && first ? " " + sar2(f.amount) + "." : ""));
    if (first && f.explanation) found.push("    Basis: " + f.explanation);
  });

  const assessment = [
    "Output VAT understated: " + sar2(e.increases_output),
    "Input VAT not recoverable: " + sar2(e.disallows_input),
  ];
  if (e.documentation_at_risk) {
    assessment.push("Documentation defects on records not already carrying an adjustment: " +
      sar2(e.documentation_at_risk) + " — not part of the proposed adjustment.");
  }
  assessment.push("Total proposed adjustment: " + sar2(e.total), "",
    "Each amount is stated once. Where several findings describe the same records, the amount " +
    "is counted against the records and not against each finding.");

  return {
    title: "Audit report", case_id: caseId, taxpayer: tp.name,
    sections: [
      { title: "Taxpayer information", fields: [
        F("Taxpayer name", tp.name),
        F("Taxpayer TIN", tp.vat_no),
        F("Taxpayer contact details", NOT_HELD,
          "Telephone, address and e-mail are not among the sources this proof-of-concept holds."),
      ] },
      { title: "Audit Case information", fields: [
        F("Audit Case ID", caseId),
        F("Audit Creation Date", c.referral_date || NOT_HELD),
        F("Case Creation Reason", "Risk Engine", "One of: " + CREATION_REASONS),
        F("Date Audit closed", c.status === "closed" ? DEMO_TODAY : FOR_AUDITOR),
        F("Priority", priorityBand(score),
          "Composite score " + score + "/100 — exposure, deadline, history, quick-win."),
        F("Priority risk", priorityBand(score),
          "The template carries this alongside Priority. The case holds one composite score, " +
          "so both are derived from it rather than one being invented."),
        F("Audit Case Type", (c.audit_type || "desk") === "desk" ? "Limited Scope Audit"
  : String(c.audit_type), "One of: " + CASE_TYPES),
        F("Tax type", "VAT", "One of: " + TAX_TYPES),
        F("Audit Case Tax Period", period),
        F("Confidential Audit", "No"),
        F("Risk Confidentiality", "No"),
        F("Place of conduct of Audit", "Desk audit — conducted on documents supplied"),
        F("Address of Audit location", "Not applicable — desk audit"),
        F("Meeting date", FOR_AUDITOR),
        F("Field audit report date", "Not applicable — no field visit was made",
          "Should be attached to this if separate."),
      ] },
      { title: "Assigned Audit Team information", fields: [
        F("Audit Manager", NOT_HELD), F("Audit Supervisor", NOT_HELD),
        F("Audit Officer", NOT_HELD),
      ] },
      { title: "Taxpayer documentation", fields: [
        F("Documents required/obtained", lines.length ? lines.join("\n") : NOT_HELD),
      ] },
      { title: "Audit Outcome", fields: [
        F("Audit objectives", "To establish whether the VAT declared for " + period +
          " is supported by the records the taxpayer holds, and to quantify any difference."),
        F("Description of Audit activities", activities.join("\n")),
        F("Audit Findings", found.length ? found.join("\n")
          : "No matter was established from the records supplied."),
        F("Audit Recommendations", findings.length
          ? "Put the findings above to the taxpayer in writing and invite representations " +
            "before any assessment is raised. Where a finding rests on a defect in the records " +
            "rather than on the figures, request the underlying documents."
          : "No further action is proposed on this period."),
        F("Rulings", FOR_AUDITOR,
          "Note details of any rulings given to the taxpayer, verbally or in writing. If none, " +
          "state 'none'."),
        F("Assessment", assessment.join("\n"),
          "Provide details on the proposed assessment measures and justify each measure " +
          "separately; also provide justification if no measures were proposed."),
        F("Penalties imposed", FOR_AUDITOR),
        F("Future Audits", findings.length
          ? "Findings raised on this period: " +
            Array.from(new Set(findings.map((f) => f.code))).sort().join(", ") + ".\n" +
            "Worth re-testing in the next period to establish whether the cause was corrected." +
            (blocking.length ? "\nThe response to the information request was incomplete; " +
              "consider whether a field visit is warranted if the pattern repeats." : "")
          : "Nothing on this period suggests a further audit.",
          "List any issues that may be relevant to future audits."),
      ] },
      { title: "Risk feedback", fields: [
        F("Indicators", c.risk || "OUTPUT_UNDERDECLARED"),
        F("Indicator response description", findings.length
          ? "The referral is borne out. " + plural(findings.length, "finding") + (findings.length === 1 ? " was" : " were") + " established " +
            "from the records supplied."
          : "The referral is not borne out by the records supplied."),
        F("Under reporting driver", findings.length
          ? "Output VAT understated and input VAT over-recovered" : "None established"),
        F("Under reporting reason", findings.length ? findings[0].statement : "None established"),
        F("Primary source of evidence", recon.population_document
          ? "Records supplied by the taxpayer (" + recon.population_document + ")"
          : "E-invoice records held by the Authority"),
      ] },
    ],
  };
}

function reportValueHtml(text) {
  let out = esc(String(text == null ? "" : text));
  [NOT_HELD, FOR_AUDITOR].forEach((marker) => {
    out = out.split(esc(marker)).join('<span class="gap">' + esc(marker) + "</span>");
  });
  return out;
}

function reportHtml(report, forWord) {
  const total = report.sections.reduce((n, s) => n + s.fields.length, 0);
  const filled = report.sections.reduce(
    (n, s) => n + s.fields.filter((f) => f.held).length, 0);
  const body = report.sections.map((s) =>
    "<h2>" + esc(s.title) + "</h2><table>" + s.fields.map((f) =>
      '<tr><td class="k">' + esc(f.label) + '</td><td class="v">' + reportValueHtml(f.value) +
      (f.note ? '<span class="note">' + esc(f.note) + "</span>" : "") + "</td></tr>"
    ).join("") + "</table>").join("");
  const button = forWord ? "" :
    '<p class="noprint"><button onclick="window.print()" style="font:inherit;padding:6pt 14pt;' +
    'border:1px solid #0f5c4a;background:#0f5c4a;color:#fff;border-radius:4px;cursor:pointer">' +
    "Print / Save as PDF</button></p>";
  return "<!DOCTYPE html>\n<html><head><meta charset=\"utf-8\">" +
    "<title>" + esc(report.title) + " — " + esc(report.case_id) + "</title>" +
    "<style>" + REPORT_STYLE + "</style></head><body>" +
    "<h1>" + esc(report.title) + "</h1>" +
    '<p class="sub">' + esc(report.taxpayer) + " · " + esc(report.case_id) +
    " · prepared " + esc(fmtLongDate(DEMO_TODAY)) + "</p>" +
    '<p class="sub">' + filled + " of " + total + " fields are answered from the case. " +
    (total - filled) + " still need the auditor or another ZATCA system.</p>" + button + body +
    '<p class="foot">Every figure in this report was computed by the audit engine from the ' +
    "documents on the case file. Fields marked as outstanding were left for a person to " +
    "complete rather than filled from an assumption.</p></body></html>";
}

function reportFilename(report, ext) {
  const stem = ("Audit_report_" + report.case_id + "_" +
    String(report.taxpayer || "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, ""))
    .slice(0, 90);
  return stem + "_" + DEMO_TODAY + "." + ext;
}

function downloadReport(caseId, how) {
  const report = auditReport(caseId);
  if (how === "print") {
    const w = window.open("", "_blank");
    if (!w) return;
    w.document.write(reportHtml(report, false));
    w.document.close();
    return;
  }
  const blob = new Blob(["﻿" + reportHtml(report, true)],
                        { type: "application/msword" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = reportFilename(report, "doc");
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    ).join("") + "</div>").join("");
  return '<div class="panel"><div class="panel-head"><h2>Audit report</h2>' +
    '<span class="rep-acts"><span class="pill status">' + filled + " of " + total +

}

let modal = null;

function renderModal() {

  host.innerHTML = '<div class="modal-overlay" data-close="1">' +

function openDrill(caseId, spec, title, amount) {
  const [source, key] = spec.split("|");
  const d = reconcileCase(caseId);
  const box = source === "input" ? d.purchase : d;
  let detail;
  const step = (kind) => (box.funnel.find((f) => f.kind === kind) || {}).detail;
  if (key === "all-invoices") {
    detail = { type: "invoice-list", invoices: box.evidence_invoices, count: box.invoices_considered,
      note: "Every e-invoice held for this taxpayer in this direction, before any rule is applied." };
    title = "E-invoices on file";
  } else if (key === "population") detail = step("population");
  else if (key === "qualified") detail = step("qualified");
  else if (key === "declared") detail = box.declared_detail;
  else if (key === "difference") detail = box.difference_detail;
  else if (key.startsWith("step:")) {
    const id = key.slice(5);
    detail = (box.funnel.find((f) => (f.rule || f.stage) === id) || {}).detail;
  } else if (key.startsWith("comp:")) {
    const code = Number(key.slice(5));
    detail = (box.composition.find((c) => c.type_code === code) || {}).detail;
  } else if (key.startsWith("evidence:")) {
    const code = key.slice(9);
    detail = ((box.evidence || []).find((e) => e.code === code) || {}).detail;
  }
  modal = { title, detail, amount };
  renderModal();
}


/* ---- reading a dropped spreadsheet, with no backend and no library
   The auditors send .xlsx, and a demo that could only read .csv would ask them to convert
   every file before it could say anything. So the workbook is opened here.

   An .xlsx is a zip of XML. The browser already carries both halves: DecompressionStream
   inflates the entries, DOMParser reads them. No library is loaded and nothing is uploaded --
   the file never leaves the machine, which is the point of a standalone build. */
function parseCsv(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => String(c).trim()));
}

  description: "description", details: "description",
  "taxable amount": "taxable_amount", taxable_amount: "taxable_amount", net: "taxable_amount",
  "vat rate": "vat_rate", vat_rate: "vat_rate", rate: "vat_rate",
  "vat amount": "vat_amount", vat_amount: "vat_amount", vat: "vat_amount", tax: "vat_amount",
  "delivery date": "delivery_date", delivery_date: "delivery_date",
  "invoice no": "invoice_number", invoice_no: "invoice_number", "inv no": "invoice_number",
  "document number": "invoice_number", "doc no": "invoice_number", "serial": "invoice_number",
  "tax invoice number": "invoice_number", "tax invoice no": "invoice_number",
  "customer tin": "customer_vat_number", "customer vat": "customer_vat_number",
  "buyer vat number": "customer_vat_number", "customer vat no": "customer_vat_number",
  "supplier tin": "supplier_vat_number", "supplier vat": "supplier_vat_number",
  "seller vat number": "supplier_vat_number", "supplier vat no": "supplier_vat_number",
  "net amount": "taxable_amount", "amount excluding vat": "taxable_amount",
  "taxable value": "taxable_amount", "value excluding vat": "taxable_amount",
  "vat value": "vat_amount", "tax amount": "vat_amount", "output vat": "vat_amount",
  "input vat": "vat_amount", "vat sar": "vat_amount", "vat amount sar": "vat_amount",
  "tax rate": "vat_rate", "vat %": "vat_rate", "rate %": "vat_rate",
  "note date": "note_date", note_date: "note_date",
  "note number": "note_number", note_number: "note_number", "credit note no": "note_number",
  "original invoice number": "original_invoice_number",
  "original invoice no": "original_invoice_number",
  "reference invoice": "original_invoice_number", "against invoice": "original_invoice_number",
  reason: "reason", "reason for issue": "reason",
};
/* A taxpayer writes "Invoice No.", "VAT Amount (SAR)", "Net amount*". The abbreviation dots,
   the unit in brackets and the footnote marker are noise, and leaving them in produces
   `invoice_no` where every check downstream is looking for `invoice_number`. */
const canonHeader = (h) => {
  const k = String(h == null ? "" : h)
    .replace(/\([^)]*\)/g, " ")          // "(SAR)", "(excl. VAT)"
    .replace(/[.*#:_-]+/g, " ")          // abbreviation dots, footnote marks, separators
    .replace(/\s+/g, " ").trim().toLowerCase();
  if (HEADER_ALIASES[k]) return HEADER_ALIASES[k];
  const squashed = k.replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
  return HEADER_ALIASES[squashed] || squashed;
};

/* ---------------------------------------------------------------- .xlsx, natively
   A zip archive: end-of-central-directory record, then one central-directory entry per file,
   each pointing at a local header and a deflated payload. Only the four entries a workbook
   needs are inflated, so a large file with many sheets does not cost what it looks like. */
async function inflateRaw(bytes) {
  if (typeof DecompressionStream !== "function") throw new Error("no-inflate");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzip(buffer) {
  const b = new Uint8Array(buffer);
  const view = new DataView(b.buffer, b.byteOffset, b.byteLength);
  // The central directory is found from the end: its record is last and carries no fixed offset.
  let eocd = -1;
  for (let i = b.length - 22; i >= 0 && i > b.length - 66000; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("not-a-zip");
  const count = view.getUint16(eocd + 10, true);
  let at = view.getUint32(eocd + 16, true);

  const entries = {};
  for (let n = 0; n < count && at + 46 <= b.length; n++) {
    if (view.getUint32(at, true) !== 0x02014b50) break;
    const method = view.getUint16(at + 10, true);
    const compressed = view.getUint32(at + 20, true);
    const nameLen = view.getUint16(at + 28, true);
    const extraLen = view.getUint16(at + 30, true);
    const commentLen = view.getUint16(at + 32, true);
    const localAt = view.getUint32(at + 42, true);
    const name = new TextDecoder().decode(b.subarray(at + 46, at + 46 + nameLen));
    entries[name] = { method, compressed, localAt };
    at += 46 + nameLen + extraLen + commentLen;
  }

  const read = async (name) => {
    const e = entries[name];
    if (!e) return null;
    // The local header repeats the name and extra-field lengths; the payload follows them.
    const nameLen = view.getUint16(e.localAt + 26, true);
    const extraLen = view.getUint16(e.localAt + 28, true);
    const start = e.localAt + 30 + nameLen + extraLen;
    const raw = b.subarray(start, start + e.compressed);
    const out = e.method === 0 ? raw : await inflateRaw(raw);
    return new TextDecoder().decode(out);
  };
  return { names: Object.keys(entries), read };
}

/* A1 -> 0-based column. "AB7" is column 27. */
function a1Column(ref) {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}

/* Excel keeps dates as days since 1899-12-30 (its leap-year bug included). A date cell read as
   45663 is useless to a period check, so it is converted where the style says it is a date. */
function excelSerialToDate(serial) {
  const ms = Math.round((Number(serial) - 25569) * 86400 * 1000);
  const d = new Date(ms);
  return isNaN(d.getTime()) ? String(serial) : d.toISOString().slice(0, 10);
}

const _xmlDoc = (text) => new DOMParser().parseFromString(text, "application/xml");

function sharedStringsFrom(xml) {
  if (!xml) return [];
  return Array.from(_xmlDoc(xml).getElementsByTagName("si")).map((si) =>
    // Rich text splits a string across several <t> runs; joining them recovers the cell.
    Array.from(si.getElementsByTagName("t")).map((t) => t.textContent).join(""));
}

/* Which style ids format their cell as a date. Excel's built-in date formats are ids 14-22 and
   45-47; anything else has to be recognised from the format string itself. */
function dateStyleIds(xml) {
  const ids = new Set();
  if (!xml) return ids;
  const doc = _xmlDoc(xml);
  const dateFormats = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 45, 46, 47]);
  Array.from(doc.getElementsByTagName("numFmt")).forEach((f) => {
    const code = (f.getAttribute("formatCode") || "").toLowerCase();
    if (/[dmy]/.test(code) && !/[#0]/.test(code.replace(/\[[^\]]*\]/g, ""))) {
      dateFormats.add(Number(f.getAttribute("numFmtId")));
    }
  });
  const cellXfs = doc.getElementsByTagName("cellXfs")[0];
  if (!cellXfs) return ids;
  Array.from(cellXfs.getElementsByTagName("xf")).forEach((xf, i) => {
    if (dateFormats.has(Number(xf.getAttribute("numFmtId")))) ids.add(i);
  });
  return ids;
}

async function readXlsx(buffer) {
  const zip = await unzip(buffer);
  const shared = sharedStringsFrom(await zip.read("xl/sharedStrings.xml"));
  const dateStyles = dateStyleIds(await zip.read("xl/styles.xml"));

  // The first sheet in the workbook's own order, not the first file alphabetically.
  const sheetNames = zip.names.filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a, b) => Number(a.match(/(\d+)/)[1]) - Number(b.match(/(\d+)/)[1]));
  if (!sheetNames.length) throw new Error("no-sheet");
  const doc = _xmlDoc(await zip.read(sheetNames[0]));

  const grid = [];
  Array.from(doc.getElementsByTagName("row")).forEach((row) => {
    const cells = [];
    Array.from(row.getElementsByTagName("c")).forEach((c) => {
      const at = a1Column(c.getAttribute("r") || "");
      const type = c.getAttribute("t") || "";
      const style = Number(c.getAttribute("s") || -1);
      let value = "";
      if (type === "inlineStr") {
        value = Array.from(c.getElementsByTagName("t")).map((t) => t.textContent).join("");
      } else {
        const v = c.getElementsByTagName("v")[0];
        const raw = v ? v.textContent : "";
        if (type === "s") value = shared[Number(raw)] ?? "";
        else if (raw === "") value = "";
        else if (dateStyles.has(style)) value = excelSerialToDate(raw);
        else value = isNaN(Number(raw)) ? raw : Number(raw);
      }
      if (at >= 0) { while (cells.length < at) cells.push(""); cells[at] = value; }
      else cells.push(value);
    });
    grid.push(cells);
  });
  return grid.filter((r) => r.some((c) => String(c ?? "").trim() !== ""));
}

/* ---- a grid becomes a document
   A taxpayer's file rarely starts with its header row: there is a company name, a title, a
   period. So the header is the first row that looks like one, and everything above it is
   preamble rather than data. Guessing row 1 would turn a title into six column names. */
function findHeaderRow(grid) {
  const looksLikeHeader = (row) => {
    const filled = row.filter((c) => String(c ?? "").trim() !== "");
    if (filled.length < 2) return false;
    const textual = filled.filter((c) => typeof c !== "number" && !/^\d+(\.\d+)?$/.test(String(c)));
    if (textual.length < filled.length * 0.7) return false;
    return filled.some((c) => canonHeader(c) in CANON_TARGETS)
        || filled.length >= 3;
  };
  for (let i = 0; i < Math.min(grid.length, 12); i++) if (looksLikeHeader(grid[i])) return i;
  return 0;
}

/* Every canonical name the completeness check and the agents look for. A header row is
   recognised by hitting one of these, which is what stops a title row being read as one. */
const CANON_TARGETS = {
  invoice_date: 1, invoice_number: 1, customer_name: 1, supplier_name: 1,
  customer_vat_number: 1, supplier_vat_number: 1, description: 1, taxable_amount: 1,
  vat_rate: 1, vat_amount: 1, delivery_date: 1, note_number: 1, original_invoice_number: 1,
};

/* A trailing "Total" line is the taxpayer's own stated total, not another invoice. Summing it
   with the rows would double the file; dropping it silently would lose the one figure the
   completeness check tests the rows against. */
function splitStatedTotal(columns, rows) {
  const totals = {};
  if (!rows.length) return { rows, totals };
  const last = rows[rows.length - 1];
  const label = String(last[0] ?? "").trim().toLowerCase();
  const blankish = last.filter((c) => String(c ?? "").trim() !== "").length <= Math.max(2, columns.length - 2);
  if (/^(total|totals|grand total|sum)\b/.test(label) && blankish) {
    columns.forEach((name, i) => {
      const n = asNumber(last[i]);
      if (n !== null && name) totals[name] = n;
    });
    return { rows: rows.slice(0, -1), totals };
  }
  return { rows, totals };
}

function documentFromGrid(filename, grid) {
  if (!grid.length) {
    return { filename, columns: [], rows: [], row_count: 0, stated_totals: {},
             note: "The file has no readable rows." };
  }
  const headerAt = findHeaderRow(grid);
  const columns = (grid[headerAt] || []).map(canonHeader);
  const split = splitStatedTotal(columns, grid.slice(headerAt + 1));
  return {
    filename, columns, rows: split.rows, row_count: split.rows.length,
    stated_totals: split.totals, received_at: DEMO_TODAY,
    preamble: headerAt > 0 ? headerAt : 0,
  };
}

/* One file in, one document out -- whatever its extension. */
async function ingestFile(file) {
  const name = file.name || "document";
  try {
    if (/\.(xlsx|xlsm)$/i.test(name)) {
      return documentFromGrid(name, await readXlsx(await file.arrayBuffer()));
    }
    if (/\.(csv|tsv)$/i.test(name)) {
      return documentFromGrid(name, parseCsv(await file.text()));
    }
    if (/\.xls$/i.test(name)) {
      return { filename: name, columns: [], rows: [], row_count: 0, stated_totals: {},
               note: "The old .xls format is a binary workbook. Re-save it as .xlsx or .csv." };
    }
    return { filename: name, columns: [], rows: [], row_count: 0, stated_totals: {},
             note: "Not a spreadsheet -- it is on the case file, but there is nothing to read." };
  } catch (err) {
    const why = String((err && err.message) || err);
    return {
      filename: name, columns: [], rows: [], row_count: 0, stated_totals: {},
      note: why === "no-inflate"
        ? "This browser cannot unzip a workbook. Chrome, Edge, Safari 16.4+ and Firefox 113+ can."
        : "The workbook could not be read (" + why + "). A .csv of the same sheet will work.",
    };
  }
}

/* Folders: the auditors said the response can arrive as one. A dropped directory arrives as
   entries rather than files, so it is walked; the picker uses webkitdirectory instead. */
async function filesFromEntry(entry, out) {
  if (!entry) return out;
  if (entry.isFile) {
    await new Promise((res) => entry.file((f) => { out.push(f); res(); }, res));
    return out;
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res) => reader.readEntries(res, () => res([])));
      if (!batch.length) break;
      for (const child of batch) await filesFromEntry(child, out);
    }
  }
  return out;
}

async function filesFromDrop(dataTransfer) {
  const items = Array.from((dataTransfer && dataTransfer.items) || []);
  const entries = items
    .map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null))
    .filter(Boolean);
  if (!entries.length) return Array.from((dataTransfer && dataTransfer.files) || []);
  const out = [];
  for (const e of entries) await filesFromEntry(e, out);
  return out;
}

const SPREADSHEET_RE = /\.(xlsx|xlsm|xls|csv|tsv)$/i;

async function ingestAll(caseId, files) {
  // A folder carries a .DS_Store and a ~$lock file too. Only the spreadsheets are read; the
  // rest are not reported as unreadable documents, because nobody meant to send them.
  const wanted = files.filter((f) => SPREADSHEET_RE.test(f.name || "")
    && !/^~\$|^\./.test((f.name || "").split("/").pop()));
  if (!wanted.length) return;
  const docs = await Promise.all(wanted.map(ingestFile));
  const bucket = (EXTRA_DOCS[caseId] = EXTRA_DOCS[caseId] || []);
  docs.forEach((d, i) => { d.uploaded = true; d.seq = bucket.length + i + 1; });
  bucket.push(...docs);
  render();
}

function pickSpreadsheet(caseId, folder) {
  const input = document.createElement("input");
  input.type = "file";
  if (folder) { input.webkitdirectory = true; input.setAttribute("webkitdirectory", ""); }
  else input.accept = ".csv,.tsv,.xlsx,.xlsm";
  input.multiple = true;
  input.addEventListener("change", () => { ingestAll(caseId, Array.from(input.files || [])); });
  input.click();
}

/* ---------------------------------------------------------------- job one, recomputed
   "Did we get what we asked for?" has to move when a document arrives, or the panel is a
   photograph rather than a check. This is `requests/completeness.py` ported: the same checks,
   the same wording, the same severities, run over whatever is on the case right now.

   Every check here is deterministic on purpose. Whether a column is present, whether a
   mandatory field is blank, whether the dates cover the period, whether the taxpayer's own
   stated total equals the rows beneath it -- none of that is judgement, so none of it waits
   for a model. */
const COVERAGE_SLACK_DAYS = 3;
const FOOTING_TOLERANCE = 1.0;
const MAX_CITED_GAP_ROWS = 8;

/* 'customer_vat_number' -> 'Customer VAT number'. Snake_case is the checker's vocabulary, not
   the taxpayer's: a letter asking for 'customer_vat_number' reads like a database error.
   Mirror of requests/extract.py::display, acronym set included. */
const UPPER_WORDS = new Set(["vat", "isic", "hs", "pos", "id", "no"]);
const displayCol = (c) => {
  const words = String(c == null ? "" : c).split("_").filter((w) => w !== "");
  if (!words.length) return String(c == null ? "" : c);
  return words.map((w, i) => UPPER_WORDS.has(w) ? w.toUpperCase()
    : (i === 0 ? w.charAt(0).toUpperCase() + w.slice(1) : w)).join(" ");
};

function asDateish(v) {
  if (v === null || v === undefined || v === "") return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

const dayCount = (a, b) => Math.round((a - b) / 86400000);
const fmtDay = (d) => d.toLocaleDateString("en-GB",
  { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });

/* The dated span of a file, read from whichever date column it carries. A listing that names
   no date cannot be tested for coverage, and saying nothing beats guessing at the period. */
function documentPeriod(doc) {
  const cols = doc.columns || [];
  const at = cols.findIndex((c) => /date$/.test(c) || c === "date");
  if (at < 0) return { from: null, to: null };
  const dates = (doc.rows || []).map((r) => asDateish(r[at])).filter(Boolean);
  if (!dates.length) return { from: null, to: null };
  return { from: new Date(Math.min(...dates)), to: new Date(Math.max(...dates)) };
}

function gapsForItem(item, doc) {
  const gaps = [];
  const push = (kind, detail, citation, severity) => gaps.push({
    kind, detail, citation: citation || "", severity: severity || "blocking",
    item_label: item.label, request_item_id: item.id, source: "deterministic",
  });
  const cols = doc.columns || [];
  const present = new Set(cols);
  const required = (item.required_columns || []).map(canonHeader);
  const fmt = (doc.format || (doc.filename || "").split(".").pop() || "file").toLowerCase();

  // ---- is this even the document we asked for?
  if (required.length && cols.length) {
    const hit = required.filter((c) => present.has(c)).length / required.length;
    if (hit < 0.5) {
      push("wrong-document",
           "Only " + Math.round(hit * 100) + "% of the requested columns are present.",
           "header row");
      return gaps;   // no point reporting each missing column of the wrong file
    }
  }

  // ---- the columns that were asked for
  required.forEach((c) => {
    if (!present.has(c)) {
      push("missing-column",
           "The '" + displayCol(c) + "' column was requested but is not in the file.",
           "header row of " + fmt);
    }
  });

  // ---- present, but blank on rows where it was mandatory
  const rows = doc.rows || [];
  (item.mandatory_columns || []).map(canonHeader).forEach((c) => {
    if (!present.has(c)) return;          // already reported above
    const at = cols.indexOf(c);
    const blank = [];
    rows.forEach((r, i) => {
      const v = r[at];
      if (v === null || v === undefined || String(v).trim() === "") blank.push(i + 1);
    });
    if (blank.length) {
      const more = blank.length > MAX_CITED_GAP_ROWS
        ? " (+" + (blank.length - MAX_CITED_GAP_ROWS) + " more)" : "";
      push("empty-mandatory-field",
           "'" + displayCol(c) + "' must be completed on every row, but is empty in " +
           blank.length + " of " + rows.length + " rows.",
           "rows " + blank.slice(0, MAX_CITED_GAP_ROWS).join(", ") + more);
    }
  });

  // ---- does it cover the period that was asked for?
  const want = String(item.period || "").split("→").map((s) => asDateish(s.trim()));
  const span = documentPeriod(doc);
  if (want[0] && want[1] && span.from && span.to) {
    if (dayCount(want[0], span.from) > COVERAGE_SLACK_DAYS) {
      push("wrong-period",
           "The file starts at " + fmtDay(span.from) + ", before the period requested (" +
           fmtDay(want[0]) + "). Rows outside the period were supplied.",
           "earliest dated row", "advisory");
    }
    if (dayCount(want[1], span.to) > COVERAGE_SLACK_DAYS) {
      push("wrong-period",
           "The file stops at " + fmtDay(span.to) + " but the period requested runs to " +
           fmtDay(want[1]) + " — " + dayCount(want[1], span.to) + " days are not covered.",
           "latest dated row");
    }
  }

  // ---- does the taxpayer's own total equal the rows beneath it?
  Object.keys(doc.stated_totals || {}).forEach((key) => {
    const col = canonHeader(key);
    const at = cols.indexOf(col);
    if (at < 0) return;
    const stated = asNumber(doc.stated_totals[key]);
    if (stated === null) return;
    let sum = 0;
    rows.forEach((r) => { const n = asNumber(r[at]); if (n !== null) sum += n; });
    const diff = Math.round((stated - sum) * 100) / 100;
    if (Math.abs(diff) > FOOTING_TOLERANCE) {
      push("arithmetic-mismatch",
           "The stated total for '" + displayCol(col) + "' is " + sar2(stated) +
           ", but the rows sum to " + sar2(sum) + " — a difference of " + sar2(diff) + ".",
           "totals row vs " + rows.length + " data rows");
    }
  });
  return gaps;
}

/* A sales analysis and a purchase analysis share six of their eight columns: date, number,
   description, taxable amount, rate, VAT. Only the counterparty tells them apart. So a file
   naming suppliers is never placed against an item that asked for customers, whatever its
   overlap score -- otherwise a purchase listing answers the sales request, and every figure
   after that is drawn from the wrong side of the return. */
function conflictingSide(required, present) {
  const wants = (side) => required.some((c) => c.indexOf(side) === 0);
  const has = (side) => Array.from(present).some((c) => c.indexOf(side) === 0);
  return (wants("customer") && has("supplier") && !has("customer"))
      || (wants("supplier") && has("customer") && !has("supplier"));
}

/* Which document answers which request item.
   An uploaded file is matched on how well its columns fit the item, not on its name -- a
   taxpayer names files whatever they like, and "Book1.xlsx" still has to be placeable. */
function matchDocuments(items, docs) {
  const byItem = new Map();
  const spare = [];
  docs.forEach((d) => {
    if (d.request_item_id != null) {
      byItem.set(d.request_item_id, (byItem.get(d.request_item_id) || []).concat(d));
    } else spare.push(d);
  });
  spare.forEach((d) => {
    const cols = new Set(d.columns || []);
    let best = null, bestScore = 0;
    items.forEach((it) => {
      const req = (it.required_columns || []).map(canonHeader);
      if (!req.length || conflictingSide(req, cols)) return;
      const score = req.filter((c) => cols.has(c)).length / req.length;
      if (score > bestScore) { best = it; bestScore = score; }
    });
    if (best && bestScore >= 0.5) {
      byItem.set(best.id, (byItem.get(best.id) || []).concat(d));
    } else d._unplaced = true;
  });
  return { byItem, unplaced: spare.filter((d) => d._unplaced) };
}

/* The latest file against an item is the one that counts. A taxpayer answering a chase resends
   the corrected sheet; re-checking the superseded one would keep reporting gaps they have
   already fixed, and the loop could never close. */
function latestOf(docs) {
  return docs.reduce((a, b) => {
    // A file dropped in during this session is the current answer by construction: the auditor
    // has just put it on the case, whatever date the seeded response carries. Comparing the
    // two by date would let a demo fixture outrank the file the user is looking at.
    if (!!a.uploaded !== !!b.uploaded) return b.uploaded ? b : a;
    const da = String(a.received_at || ""), db = String(b.received_at || "");
    if (db > da) return b;
    if (db < da) return a;
    return (b.seq || b.id || 0) >= (a.seq || a.id || 0) ? b : a;
  });
}

function checkResponse(caseId) {
  const cw = (DATA.casework || {})[caseId] || {};
  const loop = cw.loop || {};
  const round = (loop.rounds || [])[(loop.rounds || []).length - 1] || {};
  const items = round.items || [];
  const docs = (loop.documents || []).filter((d) => !d.superseded)
    .concat(EXTRA_DOCS[caseId] || []);
  if (!items.length) return { gaps: [], complete: false, checked: docs.length, items: 0 };

  const { byItem, unplaced } = matchDocuments(items, docs);
  const gaps = [];
  items.forEach((item) => {
    if (item.status === "waived") return;
    const supplied = byItem.get(item.id) || [];
    if (!supplied.length) {
      gaps.push({ kind: "missing-item", severity: "blocking", item_label: item.label,
                  request_item_id: item.id, source: "deterministic",
                  detail: "Nothing was supplied for '" + item.label + "'." });
      return;
    }
    const doc = latestOf(supplied);
    if (!(doc.columns || []).length) {
      gaps.push({ kind: "wrong-format", severity: "blocking", item_label: item.label,
                  request_item_id: item.id, source: "deterministic",
                  detail: "'" + item.label + "' was requested as a tabular analysis, but the " +
                          "file supplied has no readable table." +
                          (doc.note ? " " + doc.note : "") });
      return;
    }
    gaps.push(...gapsForItem(item, doc));
  });
  unplaced.forEach((d) => {
    gaps.push({ kind: "unrequested-document", severity: "advisory", item_label: "Other",
                source: "deterministic",
                detail: "'" + d.filename + "' was supplied but does not answer any item on " +
                        "the request. It may be a misfiled response, or evidence worth " +
                        "reading anyway." });
  });
  return {
    gaps, items: items.length, checked: docs.length,
    complete: !gaps.some((g) => g.severity === "blocking"),
  };
}

/* The chase, rewritten from whatever is outstanding now. `agents/correspondence.fb_followup`
   ported: same structure, same sentences. It has to be redrawn rather than embedded, because
   the gaps above it move the moment a document lands. */
function draftFollowup(caseId, gaps) {
  const c = caseById(caseId);
  const tp = taxpayerOf(caseId);
  const round = lastRound(caseId);
  const due = (round && round.due_at) ? fmtLongDate(round.due_at)
    : "the date stated in the request";
  const out = [
    tp.name,
    "VAT registration number " + tp.vat_no,
    "",
    "Subject: Outstanding information \u2014 VAT period " + periodOf(caseId),
    "",
    "Dear Sir or Madam,",
    "",
    "Thank you for the information supplied. On review, the following remains outstanding or " +
    "does not meet the terms of the original request. Items already supplied in full are not " +
    "repeated here.",
    "",
  ];
  const order = [];
  const groups = {};
  gaps.forEach((g) => {
    const k = g.item_label || "Other";
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(g);
  });
  order.forEach((label, i) => {
    out.push((i + 1) + ". " + label);
    groups[label].forEach((g) => {
      out.push("   - " + g.detail + (g.citation ? " (" + g.citation + ")" : ""));
    });
    out.push("");
  });
  out.push("Please supply the outstanding items by " + due + ".", "",
           "Yours faithfully,", SIGNOFF);
  return { text: out.join("\n"), mode: "deterministic", source: "deterministic-fallback",
           verified: true, violations: [] };
}

/* ------------------------------------------------------------------ router */
function currentPath() {
  const h = location.hash.replace(/^#/, "");
  return h && h.startsWith("/") ? h : "/";
}

/* /cases/<id>[/casework|/reconciliation] — a case is worked in lifecycle order */
function caseRoute(path) {
  const m = path.match(/^\/cases\/([^/]+)(?:\/(casework|reconciliation))?$/);
  return m ? { id: decodeURIComponent(m[1]), tab: m[2] || "dossier" } : null;
}

function render() {
  const path = currentPath();
  const route = caseRoute(path);
  let inner;
  if (path === "/rules") inner = viewRules();
  else if (route && route.tab === "casework") inner = viewCasework(route.id);
  else if (route && route.tab === "dossier") inner = viewDossier(route.id);
  else if (route) inner = viewReconciliation(route.id);
  else inner = viewOverview();
  root.innerHTML = shell(path, inner) + '<div id="modal-host"></div>';
  renderModal();
}

window.addEventListener("hashchange", () => {
  modal = null;
  render();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modal) { modal = null; renderModal(); }
});

/* ------------------------------------------------------------------ events */
document.addEventListener("dragover", (e) => {
  if (e.target.closest("[data-drop]")) { e.preventDefault(); e.target.closest("[data-drop]").classList.add("over"); }
});
document.addEventListener("dragleave", (e) => {
  const z = e.target.closest("[data-drop]");
  if (z) z.classList.remove("over");
});
document.addEventListener("drop", (e) => {
  const zone = e.target.closest("[data-drop]");
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove("over");
  const route = caseRoute(currentPath());
  if (!route) return;
  // Read the entries before the event is recycled -- dataTransfer is not valid after an await.
  filesFromDrop(e.dataTransfer).then((files) => ingestAll(route.id, files));
});

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-close],[data-report],[data-pick],[data-case],[data-drill],[data-act],[data-fam],[data-sev],[data-gap],[data-kind],[data-del],[data-delask],[data-delcancel],[data-remove],[data-calc],[data-calcdel],[data-email],[data-drop]");
  if (!t) return;

  if (t.hasAttribute("data-close")) {
    // the overlay closes on click; clicks inside the dialog only close via its × button
    if (e.target.closest(".modal") && !e.target.closest(".modal-close")) return;
    modal = null; renderModal(); return;
  }
  if (t.hasAttribute("data-case")) { location.hash = "#/cases/" + t.getAttribute("data-case"); return; }

  if (t.hasAttribute("data-email")) {
    const route = caseRoute(currentPath());
    if (!route) return;
    const box = document.getElementById("req-email");
    if (t.getAttribute("data-email") === "sample") {
      if (box) box.value = SAMPLE_REQUEST_EMAIL;
      return;
    }
    const text = (box || {}).value || "";
    if (!text.trim()) return;
    SENT_EMAIL[route.id] = text.trim();
    render();
    return;
  }
  if (t.hasAttribute("data-report")) {
    const route = caseRoute(currentPath());
    if (route) downloadReport(route.id, t.getAttribute("data-report"));
    return;
  }
  if (t.hasAttribute("data-remove")) {
    const route = caseRoute(currentPath());
    const name = t.getAttribute("data-remove");
    if (route && EXTRA_DOCS[route.id]) {
      EXTRA_DOCS[route.id] = EXTRA_DOCS[route.id].filter((d) => d.filename !== name);
      render();
    }
    return;
  }
  if (t.hasAttribute("data-pick")) {
    const route = caseRoute(currentPath());
    if (route) pickSpreadsheet(route.id, t.getAttribute("data-pick") === "folder");
    return;
  }
  if (t.hasAttribute("data-drop")) {
    const route = caseRoute(currentPath());
    if (!route) return;
    pickSpreadsheet(route.id);
    return;
  }

  if (t.hasAttribute("data-calc")) {
    const route = caseRoute(currentPath());
    if (!route) return;
    const text = (document.getElementById("calc-text") || {}).value || "";
    if (!text.trim()) return;
    const docs = ((((DATA.casework || {})[route.id] || {}).loop || {}).documents || [])
      .filter((x) => !x.superseded).concat(EXTRA_DOCS[route.id] || []);
    recordCalcFromText(route.id, text.trim(), docs);
    render();
    return;
  }
  if (t.hasAttribute("data-calcdel")) {
    const route = caseRoute(currentPath());
    if (!route) return;
    const seq = Number(t.getAttribute("data-calcdel"));
    CALCS[route.id] = (CALCS[route.id] || []).filter((c) => c.seq !== seq);
    render();
    return;
  }

  if (t.hasAttribute("data-drill")) {
    // via caseRoute, not a raw slice: "/cases/<id>/reconciliation" must not carry the tab
    // suffix into the id, or every drill-down outside the default tab misses the case.
    const route = caseRoute(currentPath());
    if (!route) return;
    openDrill(route.id, t.getAttribute("data-drill"),
      t.getAttribute("data-title") || "", t.hasAttribute("data-amount") ? Number(t.getAttribute("data-amount")) : undefined);
    return;
  }

  if (t.hasAttribute("data-fam")) { const v = t.getAttribute("data-fam"); rulesFam = rulesFam === v ? null : v; render(); return; }
  if (t.hasAttribute("data-sev")) { const v = t.getAttribute("data-sev"); rulesSev = rulesSev === v ? null : v; render(); return; }
  if (t.hasAttribute("data-gap")) { const v = t.getAttribute("data-gap"); rulesGap = rulesGap === v ? null : v; render(); return; }
  if (t.hasAttribute("data-kind")) { const v = t.getAttribute("data-kind"); rulesKind = rulesKind === v ? null : v; render(); return; }

  const act = t.getAttribute("data-act");
  if (act === "reset") {
    if (resetState === "idle") { resetState = "confirm"; render(); return; }
    STATE = { rules: SEED_RULES.map((r) => ({ ...r })), responses: {} };
    resetState = "idle";
    render();
    return;
  }
});

document.addEventListener("change", (e) => {
  const cb = e.target.closest("[data-toggle]");
  if (!cb) return;
  const code = cb.getAttribute("data-toggle");
  const rule = STATE.rules.find((r) => r.code === code);
  if (rule) rule.enabled = cb.checked;
  render();
});


document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest(".frow.clickable");
  if (!row) return;
  e.preventDefault();
  row.click();
});

render();
</script>
