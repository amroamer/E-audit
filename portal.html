<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ZATCA VAT Audit Agent</title>
<style>
/* ZATCA VAT Audit Agent — design system (ported verbatim from frontend/src/theme.css) */
:root{
  --brand:#0E6B57; --brand-deep:#0A4C40; --brand-tint:#E6F0EB; --gold:#A9803F;
  --bg:#EDF2EF; --surface:#FFFFFF; --surface-2:#F5F9F7;
  --ink:#14201C; --muted:#5B6A63; --faint:#8A968F; --line:#DCE6E0;
  --high:#B23A36; --high-bg:#F7E7E6; --med:#A9761E; --med-bg:#F6EDDD; --low:#2C7A58; --low-bg:#E2F0E9;
  --shadow:0 1px 2px rgba(16,40,32,.05), 0 8px 24px -14px rgba(16,40,32,.18);
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#3FB79A; --brand-deep:#2C8C76; --brand-tint:#132A23; --gold:#C9A15C;
  --bg:#0C1310; --surface:#131C18; --surface-2:#0F1713;
  --ink:#E9F1EC; --muted:#9BADA4; --faint:#6E7E76; --line:#243029;
  --high:#E4736E; --high-bg:#2A1917; --med:#D6A44E; --med-bg:#241D12; --low:#5FC496; --low-bg:#122A20;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --brand:#3FB79A; --brand-deep:#2C8C76; --brand-tint:#132A23; --gold:#C9A15C;
  --bg:#0C1310; --surface:#131C18; --surface-2:#0F1713;
  --ink:#E9F1EC; --muted:#9BADA4; --faint:#6E7E76; --line:#243029;
  --high:#E4736E; --high-bg:#2A1917; --med:#D6A44E; --med-bg:#241D12; --low:#5FC496; --low-bg:#122A20;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
h1{font-size:26px;letter-spacing:-.02em;margin:2px 0}
h2{font-size:17px;margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);margin:0 0 4px}
.muted{color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--line)}
.side .brand b{font-size:15px;letter-spacing:.2px}
.side .brand small{display:block;color:var(--muted);font-size:11px}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.side nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.navlink .ic{width:18px;text-align:center;color:var(--faint)}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.active{background:var(--brand-tint);color:var(--brand-deep)}
:root[data-theme="dark"] .navlink.active{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .navlink.active{color:var(--brand)}}
.navlink.disabled{color:var(--faint);cursor:default}
.navgroup{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px}
.side-foot{padding:14px 18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px}

.main{min-width:0}
.page{max-width:1120px;margin:0 auto;padding:30px 30px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.tile .tn{font-size:28px;font-weight:750;letter-spacing:-.01em;color:var(--brand);font-variant-numeric:tabular-nums}
.tile .tl{font-size:13px;color:var(--ink);margin-top:4px;line-height:1.35}
.tile .tnote{font-size:11px;color:var(--faint);margin-top:6px;text-transform:uppercase;letter-spacing:.5px}

/* panel + table */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.tablescroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:650;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.rowlink{cursor:pointer}
.rowlink:hover td{background:var(--surface-2)}
td .sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.notice{padding:18px;color:var(--muted)}
.notice.err{color:var(--high)}

/* pills / badges */
.pill{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:999px;font-weight:650}
.pill.status{background:var(--surface-2);color:var(--muted)}
.pill.pri-high{background:var(--high-bg);color:var(--high)}
.pill.pri-medium{background:var(--med-bg);color:var(--med)}
.pill.pri-low{background:var(--low-bg);color:var(--low)}
.pill.sev-high{background:var(--high-bg);color:var(--high)}
.pill.sev-medium{background:var(--med-bg);color:var(--med)}
.pill.sev-low{background:var(--low-bg);color:var(--low)}
.badge{font-size:11px;padding:4px 9px;border-radius:7px;font-weight:600}
.badge.gap-yes,.badge.gap-partial{background:var(--brand-tint);color:var(--brand-deep)}
:root[data-theme="dark"] .badge.gap-yes,:root[data-theme="dark"] .badge.gap-partial{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.gap-yes,:root:not([data-theme="light"]) .badge.gap-partial{color:var(--brand)}}
.badge.gap-partial{background:transparent;outline:1px dashed color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:-1px}
.badge.gap-no{background:var(--surface-2);color:var(--faint)}

/* controls + cards (Rulebook page) */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 20px}
.search{flex:1;min-width:220px}
.search input,.chip{font:inherit}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 14px;font-size:14px}
.search input:focus{outline:2px solid var(--brand);outline-offset:1px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on.sev-high{background:var(--high);border-color:var(--high)}
.chip.on.sev-medium{background:var(--med);border-color:var(--med)}
.chip.on.sev-low{background:var(--low);border-color:var(--low)}
.rescount{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.card.sev-high{border-left-color:var(--high)}.card.sev-medium{border-left-color:var(--med)}.card.sev-low{border-left-color:var(--low)}
.card-top{display:flex;justify-content:space-between;align-items:center}
.card .code{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--brand)}
.card .fam{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.card h3{font-size:15px;line-height:1.3;margin:0;font-weight:650;letter-spacing:-.01em}
.card-badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto}.side nav{flex-direction:row}.side .brand{border:none}.navgroup,.side-foot,.navlink.disabled{display:none}}
/* reconciliation bridge */
.bridge{padding:18px;display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:280px 1fr 140px;align-items:center;gap:14px}
.brow .lbl{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px;line-height:1.3}
.rc{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--brand-deep);background:var(--brand-tint);padding:2px 6px;border-radius:5px}
:root[data-theme="dark"] .rc{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .rc{color:var(--brand)}}
.track{position:relative;height:28px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.bar{position:absolute;top:3px;bottom:3px;border-radius:4px;min-width:2px;transition:width .5s ease, left .5s ease}
.bar.recon{background:var(--brand-deep)}
.bar.declared{background:var(--brand)}
.bar.explain{background:color-mix(in srgb,var(--muted) 50%, var(--surface))}
.bar.residual{background:var(--high)}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:650}
.amt.recon{color:var(--brand-deep)}.amt.declared{color:var(--brand)}.amt.explain{color:var(--muted)}.amt.residual{color:var(--high)}
:root[data-theme="dark"] .amt.recon{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .amt.recon{color:var(--brand)}}
.bridge-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.ct{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-right:4px}
@media(max-width:760px){.brow{grid-template-columns:1fr auto;gap:4px 12px}.track{grid-column:1/-1;order:3}}
/* clickable bridge rows + drill-down modal */
.brow.clickable{cursor:pointer;border-radius:8px;padding:2px 6px;margin:0 -6px;transition:background .12s}
.brow.clickable:hover{background:var(--surface-2)}
.brow.clickable:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.rowhint{color:var(--faint);margin-left:6px;opacity:0;transition:opacity .12s;font-weight:700}
.brow.clickable:hover .rowhint,.brow.clickable:focus-visible .rowhint{opacity:1}
.linklike{border:none;background:none;color:var(--brand);font:inherit;font-size:13px;cursor:pointer;padding:0}
.linklike:hover{text-decoration:underline}
.modal-overlay{position:fixed;inset:0;background:rgba(8,16,13,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;z-index:100;animation:fade .15s ease}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px -20px rgba(0,0,0,.5);width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;animation:pop .16s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:17px;letter-spacing:-.01em}
.modal-close{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:19px;line-height:1;cursor:pointer}
.modal-close:hover{color:var(--ink);border-color:var(--brand)}
.modal-body{padding:18px 20px;overflow:auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 14px}
.kv>div{background:var(--surface);padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kv .v{font-size:14px;font-variant-numeric:tabular-nums}
.detail-note{color:var(--muted);font-size:13.5px;line-height:1.55;margin:2px 0 14px}
.formula{display:flex;flex-direction:column;gap:5px;margin:2px 0 12px}
.formula .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.formula code{font-size:12.5px}
.rulecard{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--surface-2)}
.rc-top{display:flex;align-items:center;gap:10px}
.rc-link{margin-left:auto;font-size:12px}
.rc-title{font-weight:650;margin-top:6px;font-size:14.5px}
.rc-meta{font-size:12px;color:var(--muted);margin-top:3px}
.inv-table{font-size:12.5px;min-width:560px}
.inv-table th,.inv-table td{padding:7px 10px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
/* AI surfaces */
:root{--ai:#6d4bd8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ai:#a892ff}}
:root[data-theme="dark"]{--ai:#a892ff}
.page{display:flex;flex-direction:column;gap:22px}
.page-head{margin-bottom:0}
.tiles{margin-bottom:0}
.ai-h{display:flex;align-items:center;gap:10px}
.ai-chip{background:color-mix(in srgb,var(--ai) 15%, transparent);color:var(--ai);font-size:10px;font-weight:800;letter-spacing:.7px;padding:3px 7px;border-radius:6px}
.ai-body{padding:16px 18px;font-size:14px;line-height:1.6}
.brief-head{font-weight:600;margin:0 0 8px}
.brief-points{margin:0 0 6px;padding-left:18px}
.brief-points li{margin:3px 0}
.nba-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.nba-top .pill{text-transform:capitalize}
.ai-body.md h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--brand-deep);margin:16px 0 6px}
:root[data-theme="dark"] .ai-body.md h4{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ai-body.md h4{color:var(--brand)}}
.ai-body.md h4:first-child{margin-top:0}
.ai-body.md p{margin:6px 0}.ai-body.md ul{margin:6px 0;padding-left:18px}.ai-body.md li{margin:3px 0}
.pscore{display:inline-block;min-width:32px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 9px;border-radius:8px;cursor:help}
.pscore.pri-high{background:var(--high-bg);color:var(--high)}
.pscore.pri-medium{background:var(--med-bg);color:var(--med)}
.pscore.pri-low{background:var(--low-bg);color:var(--low)}
.resp-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.resp-item{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.5}
.resp-amt{white-space:nowrap;font-weight:650;font-variant-numeric:tabular-nums;display:flex;gap:12px;align-items:center;color:var(--low)}
.resp-form{display:flex;flex-direction:column;gap:9px}
.resp-row{display:flex;gap:9px}
.resp-row input:first-child{max-width:280px}
.resp-form input{flex:1;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:0 13px;font:inherit;font-size:13.5px}
.resp-form input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.resp-form input::placeholder{color:var(--faint)}
.resp-actions{display:flex;align-items:center;gap:16px;margin-top:3px}
.btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:10px 18px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:var(--brand-deep)}
.btn:disabled{opacity:.55;cursor:default}
.btn-ghost{background:transparent;color:var(--brand);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--brand)}
.btn-ghost.confirm{background:var(--high-bg);color:var(--high);border-color:var(--high)}
.btn-ghost:disabled{opacity:.6;cursor:default}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.foot-right{display:inline-flex;align-items:center;gap:11px}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch-track{width:34px;height:19px;border-radius:19px;background:var(--line);position:relative;transition:background .16s;flex:none}
.switch-thumb{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .16s}
.switch input:checked + .switch-track{background:var(--brand)}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(15px)}
.switch input:focus-visible + .switch-track{outline:2px solid var(--brand);outline-offset:2px}
.switch-label{font-size:12px;font-weight:600;color:var(--muted)}
.switch input:checked ~ .switch-label{color:var(--brand)}
.live-badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--ai);text-transform:uppercase;white-space:nowrap}
.card-del{width:26px;height:26px;border:1px solid var(--line);background:transparent;color:var(--faint);border-radius:7px;font-size:16px;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.card-del:hover{border-color:var(--high);color:var(--high);background:var(--high-bg)}
.del-confirm{display:inline-flex;gap:11px;align-items:center}
.linklike.danger{color:var(--high);font-weight:650}
.card.off{opacity:.6}
.card.off h3{text-decoration:line-through;text-decoration-color:var(--faint)}
.minibar{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.minibar b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;margin-left:5px}
.letter{display:flex;flex-direction:column;gap:10px}
.letter-head{display:flex;align-items:center;gap:9px;font-size:12.5px}
.letter-input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;font-size:13.5px;line-height:1.55;resize:vertical;min-height:96px;width:100%}
.letter-input:focus{outline:2px solid var(--ai);outline-offset:1px;border-color:transparent}
.letter-input::placeholder{color:var(--faint)}
.extract-card{border:1px solid var(--ai);background:color-mix(in srgb, var(--ai) 7%, transparent);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:10px}
.extract-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.extract-summary{margin:0;font-size:14px;font-weight:550;line-height:1.5;color:var(--ink)}
.extract-quote{margin:0;padding:8px 12px;border-left:3px solid var(--ai);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13px;font-style:italic;color:var(--muted)}
.extract-caveat{margin:0;font-size:12.5px;color:var(--med)}
.extract-note{margin:0;font-size:11.5px;color:var(--faint)}
.btn.ghost-fill{align-self:flex-start;background:var(--ai)}
.btn.ghost-fill:hover:not(:disabled){filter:brightness(1.08)}
.resp-divider{display:flex;align-items:center;text-align:center;gap:12px;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.resp-divider::before,.resp-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.cursor{color:var(--brand);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.modal-overlay,.modal,.cursor{animation:none!important}}

/* rule taxonomy — explanation / mistake / risk */
.card-kind{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:-2px}
.kindtag{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.kindtag.kind-explanation{background:var(--low-bg);color:var(--low)}
.kindtag.kind-mistake{background:var(--high-bg);color:var(--high)}
.kindtag.kind-risk{background:var(--med-bg);color:var(--med)}
.stagetag{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.chip.on.kind-explanation{background:var(--low);border-color:var(--low)}
.chip.on.kind-mistake{background:var(--high);border-color:var(--high)}
.chip.on.kind-risk{background:var(--med);border-color:var(--med)}
/* investigation */
.inv-conc{font-size:14px;line-height:1.6;margin:0 0 14px;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);border-left:3px solid var(--ai);background:var(--surface-2)}
.inv-round{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin:14px 0 8px}
.hyp{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;line-height:1.5}
.hyp.lead{border-color:var(--low);background:var(--low-bg)}
.hyp .hid{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--brand)}
.hyp .agent{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.hyp .verdict{font-size:12px;color:var(--muted);margin-top:5px}
.hyp .amt2{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:650;font-size:13px}
/* scope card */
.scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px;margin:14px 0 16px}
.scope-col h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand-deep);margin:0 0 10px}
:root[data-theme="dark"] .scope-col h4{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .scope-col h4{color:var(--brand)}}
.scope-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.scope-list li{font-size:13px;line-height:1.45}
.scope-list b{font-weight:650}
.scope-list .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}

/* ---- additions for the standalone build (classes the React app used but theme.css never defined) */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.side-foot b{display:block;color:var(--muted);font-weight:650;margin-bottom:2px}
a.navlink{cursor:pointer}
</style>
</head>

    code: "", stage: "category", action: "exclude", reason_code: "S01",
    note: "Not standard-rated. Zero-rated, exempt and out-of-scope boxes are outside this PoC.",
    match: (l) => l.category !== "S",
  },
  {
    code: "", stage: "category", action: "exclude", reason_code: "R07",
    note: "Standard-rated at a rate other than 15% — the 5% transitional box is out of scope.",
    match: (l) => l.category === "S" && l.rate !== 15,
  },
  // --- coded: change the expected return; toggling one in the Rulebook moves the number
  {
    code: "OUT-07", stage: "tax-point", action: "defer-next", direction: "sale",
    reason_code: "T02", label: "Clearance lag — invoices delivered in the next period",
    note: "Issued within the period but delivered in the next period (tax-point / clearance " +
      "lag) — the supply belongs to the following return.",
    match: (l, periodTo) => l.type_code !== CREDIT_NOTE && l.delivery_date && l.delivery_date > periodTo,
  },
  {
    code: "INP-09", stage: "tax-point", action: "defer-next", direction: "purchase",
    reason_code: "T02", label: "Input claimed in the wrong / a late period",
    note: "Purchase invoices delivered in the next period — the input belongs to the " +
      "following return.",
    match: (l, periodTo) => l.type_code !== CREDIT_NOTE && l.delivery_date && l.delivery_date > periodTo,
  },
  {
    code: "COR-01", stage: "adjustment", action: "admit", direction: "sale",
    reason_code: "D03", label: "Credit notes (381) netted against sales",
    excludeWhenDisabled: true,
    note: "Credit notes reduce output VAT and belong in the expected return. Disabling " +
      "COR-01 removes them from the reconstruction.",
    match: (l) => l.type_code === CREDIT_NOTE,
  },
  {
    code: "COR-02", stage: "adjustment", action: "admit", direction: "purchase",
    reason_code: "D03", label: "Supplier credit notes (381) netted against purchases",
    excludeWhenDisabled: true,
    note: "Supplier credit notes reduce recoverable input VAT and belong in the expected " +
      "return. Disabling COR-02 removes them from the reconstruction.",
    match: (l) => l.type_code === CREDIT_NOTE,
  },
];

function rulesInOrder(direction) {
  return QUALIFICATION_RULES
    .filter((r) => !r.direction || r.direction === direction)
    .slice()
    .sort((a, b) => STAGE_ORDER.indexOf(a.stage) - STAGE_ORDER.indexOf(b.stage));
}

function wiredCodes() { return new Set(QUALIFICATION_RULES.filter((r) => r.code).map((r) => r.code)); }

/* Walk every line through the stages; only survivors are summed. */
function qualify(rows, direction, periodTo) {
  const ordered = rulesInOrder(direction);
  const structural = ordered.filter((r) => !r.code);
  const coded = ordered.filter((r) => r.code);
  return rows.map((row) => {
    const line = { row, inPopulation: true, admitted: true, period: "current", matched: new Set() };
    for (const rule of structural) {
      if (rule.match(row, periodTo)) { line.inPopulation = false; line.admitted = false; break; }
    }
    if (line.inPopulation) {
      for (const rule of coded) {
        if (!rule.match(row, periodTo)) continue;
        line.matched.add(rule.code);
        const live = ruleOn(rule.code);
        if (rule.action === "defer-next" && live) { line.period = "next"; break; }
        if (rule.action === "exclude" && live) { line.admitted = false; break; }
        if (rule.action === "admit" && !live && rule.excludeWhenDisabled) {
          line.admitted = false; break;
        }
      }
    }
    line.counted = line.inPopulation && line.admitted && line.period === "current";
    return line;
  });
}

/* base + Σ rows === expected, by construction. */
function compose(lines, direction) {
  const pop = lines.filter((l) => l.inPopulation);
  const coded = rulesInOrder(direction).filter((r) => r.code);
  const netting = new Set(coded.filter((r) => r.excludeWhenDisabled).map((r) => r.code));
  const baseLines = pop.filter((l) => ![...l.matched].some((c) => netting.has(c)));
  const rows = [];
  for (const rule of coded) {
    const owned = pop.filter((l) => l.matched.has(rule.code));
    if (!owned.length || !ruleOn(rule.code)) continue;
    const sum = owned.reduce((s, l) => s + l.row.s_tax, 0);
    const amount = r2(rule.excludeWhenDisabled ? sum : -sum);
    if (Math.abs(amount) <= 0.005) continue;
    rows.push({
      rule: rule.code, stage: rule.stage, reason_code: rule.reason_code,
      verdict: rule.action === "defer-next" ? "deferred-next" : "admitted",
      label: rule.label, note: rule.note, amount, count: owned.length, lines: owned,
    });
  }
  const counted = lines.filter((l) => l.counted);
  return {
    base_vat: r2(baseLines.reduce((s, l) => s + l.row.s_tax, 0)),
    baseLines, rows,
    expected_vat: r2(counted.reduce((s, l) => s + l.row.s_tax, 0)),
    expected_base: r2(counted.reduce((s, l) => s + l.row.s_base, 0)),
    counted: counted.length, population: pop.length,
  };
}

/* Flatten invoices to the tax-subtotal grain the pipeline qualifies. */
function lineRecords(invs, periodTo) {
  return invs.map((inv) => ({
    ...inv, category: "S", rate: 15, tax_amount: inv.s_tax, taxable_amount: inv.s_base,
    period_to: periodTo,
  }));
}

function lineInvoiceRows(lines) {
  const seen = new Map();
  for (const l of lines) {
    const row = invRow(l.row);
    if (seen.has(row.uuid)) seen.get(row.uuid).tax_amount = r2(seen.get(row.uuid).tax_amount + l.row.s_tax);
    else seen.set(row.uuid, row);
  }
  return [...seen.values()];
}

/* Build the bridge items + drill-down details from what the rules did to the lines. */
function explainFrom(comp) {
  const items = [];
  const details = {};
  for (const r of comp.rows) {
    items.push([r.rule, r.label, r.amount]);
    details[r.rule] = {
      type: "rule", rule: rinfo(r.rule),
      reason_code: r.reason_code, reason_label: REASON_LABEL[r.reason_code] || "",
      stage: r.stage, verdict: r.verdict, note: r.note,
      count: r.count, total: r.amount, invoices: lineInvoiceRows(r.lines),
    };
  }
  return [items, details];
}

const REASON_LABEL = {
  D03: "Credit note", D06: "Technical rejection / resubmission",
  T02: "Invoice issued before the tax point", S01: "Exempt supply",
  R07: "Inconsistent tax-category coding",
};

function r2(n) { return Math.round((n + (n >= 0 ? 1 : -1) * 1e-9) * 100) / 100; }
function r4(n) { return Math.round((n + (n >= 0 ? 1 : -1) * 1e-9) * 10000) / 10000; }

/* Python's round() is half-to-even; the priority score depends on it. */
function pyRound(x) {
  const f = Math.floor(x);
  if (Math.abs(x - f - 0.5) < 1e-9) return f % 2 === 0 ? f : f + 1;
  return Math.round(x);
}

function sar(n) {
  return "SAR " + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function daysBetween(fromISO, toISO) {
  return Math.round((Date.parse(toISO) - Date.parse(fromISO)) / 86400000);
}

function rulesOf() { return STATE.rules; }
function getRule(code) { return rulesOf().find((r) => r.code === code) || null; }
function ruleOn(code) { const r = getRule(code); return !!(r && r.enabled); }
function rinfo(code) {
  const r = getRule(code);
  if (!r) return { code };
  return { code: r.code, family: r.family, title: r.title, explains_gap: r.explains_gap, severity: r.severity };
}

function invRow(inv) {
  return {
    uuid: inv.uuid,
    type_code: inv.type_code,
    type: TYPE_LABEL[inv.type_code] || String(inv.type_code),
    issue_date: inv.issue_date,
    delivery_date: inv.delivery_date,
    status: inv.status,
    base: r2(inv.s_base),
    tax_amount: r2(inv.s_tax),
  };
}

function taxpayerById(id) { return DATA.taxpayers.find((t) => t.id === id); }
function caseById(cid) { return DATA.cases.find((c) => c.case_id === cid); }
function currentReturn(taxpayerId, periodFrom) {
  return DATA.returns.find(
    (r) => r.taxpayer_id === taxpayerId && r.period_from === periodFrom && r.current_flag
  ) || null;
}
function boxOf(ret, code, direction) {
  if (!ret) return null;
  return ret.boxes.find((b) => b.box_code === code && b.direction === direction) || null;
}
function responsesOf(caseId) { return STATE.responses[caseId] || []; }

/* ------------------------------------------- input VAT (standard-rated purchases) */
function reconstructInput(tp, ret, periodTo) {
  const pbox = boxOf(ret, "standard_rate_purchase", "purchase");
  const declared = r2(pbox ? pbox.vat_amount : 0);

  const invs = DATA.invoices.filter((i) => i.taxpayer_id === tp.id && i.direction === "purchase");
  const considered = invs.filter((i) => i.status === "cleared" || i.status === "reported").length;

  const lines = qualify(lineRecords(invs, periodTo), "purchase", periodTo);
  const comp = compose(lines, "purchase");
  const gross = comp.base_vat;
  const apparentGap = r2(gross - declared);

  const [items, explainDetail] = explainFrom(comp);

  const residual = r2(comp.expected_vat - declared);
  const explainedTotal = r2(apparentGap - residual);
  const explainedPct = apparentGap ? r4(explainedTotal / apparentGap) : null;
  const materiality = r2(Math.max(MATERIALITY_FLOOR, MATERIALITY_PCT * declared));

  let band, state;
  if (Math.abs(residual) <= materiality) { band = Math.abs(residual) <= 1 ? "noise" : "immaterial"; state = "supported"; }
  else if (residual < 0) { band = "material"; state = "potential-finding"; }
  else { band = "material"; state = "unresolved"; }

  const reconDetail = {
    type: "reconstruction",
    formula: "Σ TAXSUBTOTAL (tax category S @ 15%) over qualified purchase lines",
    note: "Standard-rated input VAT rebuilt line by line from the taxpayer's e-invoices. Each " +
      "line was qualified before it was summed; the rows below are the lines that entered the baseline.",
    count: comp.baseLines.length, total: gross, invoices: lineInvoiceRows(comp.baseLines),
  };
  const declaredDetail = {
    type: "declared", box_code: "standard_rate_purchase", box_label: "Standard-rated purchases",
    form_number: ret ? ret.form_number : null,
    data_version: ret ? ret.data_version : null,
    submission_date: ret ? ret.submission_date : null,
    base_amount: pbox ? pbox.base_amount : null,
    vat_amount: declared, adjustment: pbox ? pbox.adjustment : 0,
    note: "The input VAT the taxpayer claimed for this box, from the current filed return.",
  };
  let resNote;
  if (state === "potential-finding")
    resNote = "Declared input VAT exceeds what the qualified purchase e-invoices support — a potential over-claim of recoverable input VAT. Recommended next step: request the purchase ledger and tax invoices covering the residual.";
  else if (state === "supported")
    resNote = "Within the materiality threshold — the declared return is supported by the qualified e-invoice evidence. No finding.";
  else
    resNote = "Declared input is below what the invoices support — the taxpayer may have under-claimed recoverable input VAT; no revenue risk to the Authority.";
  const residualDetail = { type: "residual", amount: residual, materiality, band, state, note: resNote };

  const bridge = [{ seq: 0, kind: "anchor", rule: null, label: "Declared input (as filed)", amount: declared, running: declared, detail: declaredDetail }];
  let running = r2(declared + apparentGap);
  bridge.push({ seq: 1, kind: "gap", rule: null, label: "Reconstructed from purchase e-invoices", amount: apparentGap, running, detail: reconDetail });
  items.forEach((it, idx) => {
    running = r2(running + it[2]);
    bridge.push({ seq: idx + 2, kind: "explain", rule: it[0], label: it[1], amount: it[2], running, detail: explainDetail[it[0]] });
  });
  bridge.push({ seq: items.length + 2, kind: "residual", rule: null, label: "Unexplained residual", amount: residual, running, detail: residualDetail });

  const deferredOut = lines.filter((l) => l.inPopulation && l.period === "next");
  return {
    box: "Standard-rated purchases (input VAT)",
    declared, reconstructed_gross: gross, apparent_gap: apparentGap,
    explained_total: explainedTotal, explained_pct: explainedPct,
    residual, materiality, band, state, bridge,
    invoices_considered: considered,
    evidence_invoices: lineInvoiceRows(lines.filter((l) => l.inPopulation)),
    expected_vat: comp.expected_vat, expected_base: comp.expected_base,
    population_lines: comp.population, counted_lines: comp.counted,
    deferred_out: { count: deferredOut.length, amount: r2(deferredOut.reduce((s2, l) => s2 + l.row.s_tax, 0)) },
  };
}

/* ------------------------------------------- output VAT (standard-rated sales) */
function reconcileCase(caseId) {
  const c = caseById(caseId);
  if (!c) throw new Error("case not found");
  const tp = taxpayerById(c.taxpayer_id);
  const ret = currentReturn(tp.id, c.period_from);
  const dbox = boxOf(ret, "standard_rate_sales", "sale");
  const declared = r2(dbox ? dbox.vat_amount : 0);

  const invs = DATA.invoices.filter((i) => i.taxpayer_id === tp.id && i.direction === "sale");

  const lines = qualify(lineRecords(invs, c.period_to), "sale", c.period_to);
  const comp = compose(lines, "sale");
  const grossPos = comp.base_vat;
  const apparentGap = r2(grossPos - declared);

  const [items, explainDetail] = explainFrom(comp);

  // auditor-confirmed evidence is not a line decision — it applies after qualification
  const responses = responsesOf(caseId);
  for (const r of responses) items.push([r.code, r.label, r2(-Math.abs(r.amount))]);

  const responseTotal = r2(responses.reduce((s2, r) => s2 - Math.abs(r.amount), 0));
  const residual = r2(comp.expected_vat + responseTotal - declared);
  const explainedTotal = r2(apparentGap - residual);
  const explainedPct = apparentGap ? r4(explainedTotal / apparentGap) : null;
  const materiality = r2(Math.max(MATERIALITY_FLOOR, MATERIALITY_PCT * declared));

  let band, state;
  if (Math.abs(residual) <= materiality) { band = Math.abs(residual) <= 1 ? "noise" : "immaterial"; state = "supported"; }
  else if (residual > 0) { band = "material"; state = "potential-finding"; }
  else { band = "material"; state = "unresolved"; }

  const reconDetail = {
    type: "reconstruction",
    formula: "Σ TAXSUBTOTAL (tax category S @ 15%) over qualified sale lines",
    note: "Standard-rated output VAT rebuilt line by line from the taxpayer's e-invoices. Each " +
      "line was qualified before it was summed; the rows below are the lines that entered the baseline.",
    count: comp.baseLines.length, total: grossPos, invoices: lineInvoiceRows(comp.baseLines),
  };
  for (const r of responses) {
    explainDetail[r.code] = {
      type: "response", label: r.label, doc_name: r.doc_name, count: 0,
      total: r2(-Math.abs(r.amount)), invoices: [],
      note: "Evidence provided by the taxpayer" + (r.doc_name ? " — " + r.doc_name : "") +
        ". The auditor confirmed the SAR amount it accounts for; this figure is auditor-entered, not AI-generated.",
    };
  }
  const declaredDetail = {
    type: "declared",
    form_number: ret ? ret.form_number : null,
    data_version: ret ? ret.data_version : null,
    submission_date: ret ? ret.submission_date : null,
    box_code: "standard_rate_sales", box_label: "Standard-rated sales",
    base_amount: dbox ? dbox.base_amount : null,
    vat_amount: declared, adjustment: dbox ? dbox.adjustment : 0,
    note: "The output VAT the taxpayer declared for this box, from the current filed return.",
  };
  let resNote;
  if (state === "potential-finding")
    resNote = "Above the materiality threshold and unexplained by any rule — a potential under-declaration of output VAT. Recommended next step: request the sales ledger covering the residual to confirm.";
  else if (state === "supported")
    resNote = "Within the materiality threshold — the declared return is supported by the qualified e-invoice evidence. No finding.";
  else
    resNote = "Material negative residual — the taxpayer may have over-declared; investigate.";
  const residualDetail = { type: "residual", amount: residual, materiality, band, state, note: resNote };

  const bridge = [{ seq: 0, kind: "anchor", rule: null, label: "Declared (as filed)", amount: declared, running: declared, detail: declaredDetail }];
  let running = r2(declared + apparentGap);
  bridge.push({ seq: 1, kind: "gap", rule: null, label: "Reconstructed from e-invoices", amount: apparentGap, running, detail: reconDetail });
  items.forEach((it, idx) => {
    running = r2(running + it[2]);
    bridge.push({ seq: idx + 2, kind: "explain", rule: it[0], label: it[1], amount: it[2], running, detail: explainDetail[it[0]] });
  });
  bridge.push({ seq: items.length + 2, kind: "residual", rule: null, label: "Unexplained residual", amount: residual, running, detail: residualDetail });

  const purchase = reconstructInput(tp, ret, c.period_to);
  const order = { "potential-finding": 3, unresolved: 2, supported: 1 };
  const outFinding = state === "potential-finding" ? residual : 0;
  const inFinding = purchase.state === "potential-finding" ? Math.abs(purchase.residual) : 0;
  const combined = {
    total_exposure: r2(outFinding + inFinding),
    priority_exposure: r2(Math.abs(residual) + inFinding),
    state: (order[state] || 0) >= (order[purchase.state] || 0) ? state : purchase.state,
    output_state: state,
    input_state: purchase.state,
    output_residual: residual,
    input_residual: purchase.residual,
    finding_boxes: [["output", state], ["input", purchase.state]].filter((x) => x[1] === "potential-finding").map((x) => x[0]),
  };

  return {
    case_id: caseId,
    taxpayer: tp.name,
    box: "Standard-rated sales VAT",
    declared,
    reconstructed_gross: grossPos,
    apparent_gap: apparentGap,
    explained_total: explainedTotal,
    explained_pct: explainedPct,
    residual, materiality, band, state, bridge,
    invoices_considered: invs.length,
    evidence_invoices: lineInvoiceRows(lines.filter((l) => l.inPopulation)),
    expected_vat: comp.expected_vat, expected_base: comp.expected_base,
    population_lines: comp.population, counted_lines: comp.counted,
    deferred_out: (() => { const d = lines.filter((l) => l.inPopulation && l.period === "next");
      return { count: d.length, amount: r2(d.reduce((s2, l) => s2 + l.row.s_tax, 0)) }; })(),
    purchase,
    combined,
  };
}


/* ------------------------------------------- investigation (app/agents/*)
   Agents hypothesise; the deterministic adjudicator settles. No figure in this block
   comes from anywhere but the engine. */
const CONFIDENCE_RANK = { high: 3, medium: 2, low: 1 };

function priorReturnsFor(c) {
  return DATA.returns
    .filter((r) => r.taxpayer_id === c.taxpayer_id && r.period_from < c.period_from)
    .sort((a, b) => (a.period_from < b.period_from ? -1 : 1))
    .map((r) => {
      const b = r.boxes.find((x) => x.box_code === "standard_rate_sales" && x.direction === "sale");
      return { period_from: r.period_from, vat_amount: b ? b.vat_amount : 0 };
    });
}
function priorCasesFor(c) {
  return DATA.cases.filter((o) => o.taxpayer_id === c.taxpayer_id && o.case_id !== c.case_id)
    .map((o) => ({ case_id: o.case_id, root_cause_code: o.root_cause_code }));
}

const TOLERANCE = 1.0;
const near = (a, b) => Math.abs(a - b) <= TOLERANCE;
const digitsOf = (v) => String(Math.round(Math.abs(v))).split("").sort().join("");
const boxOfCtx = (ctx, which) => (which === "output" ? ctx.recon : ctx.recon.purchase);
const sarNum = (v) => Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });

const ADJUDICATORS = {
  "decimal-shift": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    for (const f of [10, 100, 0.1, 0.01]) {
      if (b.declared && near(b.declared * f, b.expected_vat)) {
        return { status: "confirmed", amount: r2(b.residual),
          detail: { declared: b.declared, factor: f, expected: b.expected_vat, product: r2(b.declared * f) },
          explanation: `Declared SAR ${sarNum(b.declared)} x ${f} = SAR ${sarNum(b.declared * f)}, which equals the expected return of SAR ${sarNum(b.expected_vat)} exactly. The difference of SAR ${sarNum(b.residual)} is consistent with a misplaced decimal point in the declared figure, not with unreported supplies.` };
      }
    }
    return { status: "refuted", amount: 0, detail: { declared: b.declared, expected: b.expected_vat },
      explanation: `No power-of-ten multiple of the declared SAR ${sarNum(b.declared)} reaches the expected SAR ${sarNum(b.expected_vat)}.` };
  },
  "digit-transposition": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    if (b.declared && b.expected_vat && digitsOf(b.declared) === digitsOf(b.expected_vat) && !near(b.declared, b.expected_vat))
      return { status: "confirmed", amount: r2(b.residual), detail: { declared: b.declared, expected: b.expected_vat },
        explanation: `The declared SAR ${sarNum(b.declared)} and the expected SAR ${sarNum(b.expected_vat)} use the same digits in a different order — the signature of a keying error rather than a missing supply.` };
    return { status: "refuted", amount: 0, detail: { declared: b.declared, expected: b.expected_vat },
      explanation: "The declared and expected figures do not share the same digits." };
  },
  "single-document": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    for (const iv of b.evidence_invoices || []) {
      if (near(Math.abs(iv.tax_amount), Math.abs(b.residual)) && Math.abs(b.residual) > 0)
        return { status: "confirmed", amount: r2(b.residual),
          detail: { uuid: iv.uuid, tax_amount: iv.tax_amount, issue_date: iv.issue_date },
          explanation: `The difference of SAR ${sarNum(b.residual)} equals exactly one document, ${iv.uuid} issued ${iv.issue_date}. A single omitted or duplicated invoice explains it.` };
    }
    return { status: "refuted", amount: 0, detail: {}, explanation: "No single document matches the difference." };
  },
  "paired-offset": (h, ctx) => {
    const o = ctx.recon.residual, i = ctx.recon.purchase.residual;
    if (Math.abs(o) > TOLERANCE && near(o, -i))
      return { status: "confirmed", amount: r2(Math.abs(o)), detail: { output_residual: o, input_residual: i },
        explanation: `The output box is out by SAR ${sarNum(o)} and the input box by SAR ${sarNum(i)} — equal and opposite. That is the signature of a misposting between the two boxes, not of a revenue loss.` };
    return { status: "refuted", amount: 0, detail: { output_residual: o, input_residual: i },
      explanation: "The two boxes' differences are not equal and opposite." };
  },
  "period-shift": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box), d = b.deferred_out || { count: 0, amount: 0 };
    if (d.amount && near(d.amount, b.residual))
      return { status: "confirmed", amount: r2(b.residual), detail: { ...d },
        explanation: `The difference of SAR ${sarNum(b.residual)} equals the SAR ${sarNum(d.amount)} of supplies (${d.count} documents) whose tax point falls in the next period — a timing difference, not an under-declaration.` };
    return { status: "refuted", amount: 0, detail: { ...d },
      explanation: "The difference does not match the supplies moved between periods." };
  },
  "rate-misapplication": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    const a = Number(h.test.params.from_rate ?? 15), t = Number(h.test.params.to_rate ?? 5);
    const implied = r2((b.expected_base * (a - t)) / 100);
    if (Math.abs(b.residual) > TOLERANCE && near(implied, b.residual))
      return { status: "confirmed", amount: r2(b.residual), detail: { base: b.expected_base, from_rate: a, to_rate: t, implied },
        explanation: `The difference of SAR ${sarNum(b.residual)} equals the taxable base of SAR ${sarNum(b.expected_base)} at ${a}% rather than ${t}% — a rate applied to the whole base, not a missing supply.` };
    return { status: "refuted", amount: 0, detail: { base: b.expected_base, implied },
      explanation: "The difference does not correspond to a rate difference on this base." };
  },
  recurrence: (h, ctx) => {
    const hits = ctx.priorCases.filter((c) => c.root_cause_code);
    if (hits.length) {
      const codes = [...new Set(hits.map((c) => c.root_cause_code))].sort();
      return { status: "confirmed", amount: 0,
        detail: { prior_cases: hits.map((c) => c.case_id), root_causes: codes },
        explanation: `This taxpayer has ${hits.length} prior case(s) closed with a recorded root cause (${codes.join(", ")}). The same treatment should be applied unless the facts differ.` };
    }
    return { status: "refuted", amount: 0, detail: {}, explanation: "No prior case with a recorded root cause for this taxpayer." };
  },
  "historical-magnitude": (h, ctx) => {
    const b = boxOfCtx(ctx, h.test.box);
    const hist = ctx.priorReturns.map((r) => r.vat_amount).filter((v) => v);
    if (hist.length < 2)
      return { status: "insufficient-evidence", amount: 0, detail: { prior_periods: hist.length },
        explanation: "Too few prior periods on file to judge the magnitude." };
    const typical = r2(hist.reduce((s, v) => s + v, 0) / hist.length);
    if (typical && b.declared && (b.declared < typical / 3 || b.declared > typical * 3)) {
      const dir = b.declared < typical ? "far below" : "far above";
      return { status: "confirmed", amount: 0, detail: { declared: b.declared, prior_average: typical, periods: hist.length },
        explanation: `Declared SAR ${sarNum(b.declared)} is ${dir} this taxpayer's own average of SAR ${sarNum(typical)} across ${hist.length} prior periods. The declaration is out of character for the business, which points at how the figure was entered rather than at the trading itself.` };
    }
    return { status: "refuted", amount: 0, detail: { declared: b.declared, prior_average: typical },
      explanation: "The declared figure is in line with this taxpayer's history." };
  },
};

function adjudicate(h, ctx) {
  const fn = ADJUDICATORS[h.test.kind];
  if (!fn) return { hypothesis_id: h.id, status: "insufficient-evidence", amount: 0, detail: {}, explanation: "" };
  return { hypothesis_id: h.id, ...fn(h, ctx) };
}

function proposeHypotheses(ctx) {
  const out = [];
  const material = (which) => {
    const b = boxOfCtx(ctx, which);
    return Math.abs(b.residual) > b.materiality;
  };
  const H = (id, agent, reason, conf, claim, kind, params) =>
    ({ id, agent, reason_code: reason, confidence: conf, claim,
       test: { kind, box: "output", params: params || {} } });
  if (material("output")) {
    out.push(H("RA-01", "Reconstruction Analyst", "T02", "medium",
      "The difference may be a timing one — supplies whose tax point falls in the next period rather than supplies that were never declared.", "period-shift"));
    out.push(H("RA-02", "Reconstruction Analyst", "R01", "medium",
      "A single omitted or duplicated document would account for the difference on its own.", "single-document"));
    out.push(H("RA-03", "Reconstruction Analyst", "R07", "low",
      "The whole taxable base may have been declared at the wrong rate.", "rate-misapplication", { from_rate: 15, to_rate: 5 }));
  }
  if (material("output") && material("input"))
    out.push(H("RA-04", "Reconstruction Analyst", "R08", "medium",
      "The two boxes may be out by equal and opposite amounts, which would point at a misposting between them rather than a loss of revenue.", "paired-offset"));
  if (material("output")) {
    out.push(H("DE-01", "Data-Entry Forensics", "A09", "high",
      "The declared figure may be the expected one with the decimal point in the wrong place — a keying error rather than an under-declaration.", "decimal-shift"));
    out.push(H("DE-02", "Data-Entry Forensics", "A09", "medium",
      "The declared figure may carry the expected figure's digits in a different order, which would indicate a transposition when the return was keyed.", "digit-transposition"));
    out.push(H("DE-03", "Data-Entry Forensics", "R10", "medium",
      "The declaration may be out of character for this taxpayer's own trading history, which would support a data-entry explanation over a trading one.", "historical-magnitude"));
  }
  if (ctx.priorCases.length)
    out.push(H("HP-01", "Historical Pattern", "R06", "medium",
      "This taxpayer has been audited before, and the earlier root cause may apply again — in which case the resolution already exists.", "recurrence"));
  if (material("output") && ctx.priorReturns.length >= 2)
    out.push(H("HP-02", "Historical Pattern", "R10", "medium",
      "The declared position sits outside the range this taxpayer has filed in previous periods.", "historical-magnitude"));
  return out;
}

function investigate(caseId) {
  const c = caseById(caseId);
  const recon = reconcileCase(caseId);
  const ctx = { recon, priorReturns: priorReturnsFor(c), priorCases: priorCasesFor(c) };
  const entries = [];
  let seq = 0;
  const add = (round, kind, agent, payload) => entries.push({ seq: ++seq, round, kind, agent, payload });
  const residual = recon.residual;

  add(0, "fact", "Engine", { declared: recon.declared, expected: recon.expected_vat,
    difference: residual, materiality: recon.materiality, state: recon.state,
    input_residual: recon.purchase.residual, deferred_out: recon.deferred_out });

  if (Math.abs(residual) <= recon.materiality && recon.purchase.state !== "potential-finding") {
    const conclusion = "The declared return is supported by the qualified e-invoice evidence within materiality. There is no difference to investigate.";
    add(4, "conclusion", "Case Lead", { leading: null, explained: 0, unexplained: 0, conclusion });
    return { case_id: caseId, rounds: 1, entries, hypotheses: [], adjudications: [],
             leading: null, conclusion, unexplained: 0, source: "deterministic" };
  }

  const hypotheses = proposeHypotheses(ctx);
  hypotheses.forEach((h) => add(1, "hypothesis", h.agent,
    { id: h.id, claim: h.claim, test: h.test.kind, confidence: h.confidence }));

  const adjudications = hypotheses.map((h) => adjudicate(h, ctx));
  adjudications.forEach((a) => add(2, "adjudication", "Adjudicator",
    { id: a.hypothesis_id, status: a.status, amount: a.amount, explanation: a.explanation }));

  const byId = Object.fromEntries(hypotheses.map((h) => [h.id, h]));
  const confirmed = adjudications.filter((a) => a.status === "confirmed");
  const explanatory = confirmed.filter((a) => Math.abs(a.amount) > 0).sort((x, y) => {
    const d = Math.abs(y.amount) - Math.abs(x.amount);
    return d || CONFIDENCE_RANK[byId[y.hypothesis_id].confidence] - CONFIDENCE_RANK[byId[x.hypothesis_id].confidence];
  });
  const context = confirmed.filter((a) => Math.abs(a.amount) === 0);
  const leading = explanatory[0] || null;

  if (leading) {
    const rivals = explanatory.filter((a) => a.hypothesis_id !== leading.hypothesis_id);
    const shortfall = r2(Math.abs(residual) - Math.abs(leading.amount));
    if (rivals.length)
      add(3, "objection", "Challenger", { against: leading.hypothesis_id,
        note: "More than one hypothesis is confirmed and they claim the same difference. The auditor must choose between them: " + rivals.map((a) => a.hypothesis_id).join(", ") + "." });
    else if (shortfall > recon.materiality)
      add(3, "objection", "Challenger", { against: leading.hypothesis_id,
        note: `The leading hypothesis accounts for SAR ${sarNum(leading.amount)} of a SAR ${sarNum(residual)} difference, leaving SAR ${sarNum(shortfall)} unaccounted for — above materiality. It cannot be the whole story.` });
    else
      add(3, "objection", "Challenger", { against: leading.hypothesis_id,
        note: "No competing hypothesis survived adjudication and the leader accounts for the difference within materiality." });
  } else {
    add(3, "objection", "Challenger", { against: null,
      note: "No hypothesis was confirmed. The difference is not explained by any pattern the evidence agents can test." });
  }

  const explained = r2(leading ? Math.abs(leading.amount) : 0);
  const unexplained = r2(Math.abs(residual) - explained);
  let conclusion;
  if (!leading) {
    conclusion = `No tested pattern explains the SAR ${sarNum(residual)} difference. Escalate to the auditor with the ranked hypotheses for a manual line review.`;
    if (context.length) conclusion += " Supporting context: " + context.map((a) => a.explanation).join(" ");
  } else if (unexplained <= recon.materiality) {
    conclusion = `${byId[leading.hypothesis_id].agent} proposed it and the engine confirmed it: ${leading.explanation}`;
  } else {
    conclusion = `${leading.explanation} That still leaves SAR ${sarNum(unexplained)} unaccounted for, which needs a separate explanation.`;
  }
  add(4, "conclusion", "Case Lead", { leading: leading ? leading.hypothesis_id : null, explained, unexplained, conclusion });

  return { case_id: caseId, rounds: 5, entries, hypotheses, adjudications,
           leading: leading ? leading.hypothesis_id : null, conclusion, unexplained, source: "deterministic" };
}

/* ------------------------------------------- composite priority (priority.py) */
const WEIGHTS = { exposure: 0.40, deadline: 0.30, history: 0.20, quickwin: 0.10 };
const EXPOSURE_CEILING = 100000.0;
const SLA_WINDOW = 90;

function scoreCase(c) {
  let residual = 0, explained = 0;
  try {
    const recon = reconcileCase(c.case_id);
    const combined = recon.combined || {};
    residual = combined.priority_exposure != null ? combined.priority_exposure : Math.abs(recon.residual);
    explained = recon.explained_pct || 0;
  } catch (e) { residual = 0; explained = 0; }
  const exposure = Math.min(residual / EXPOSURE_CEILING, 1);
  const quickwin = explained;

  let days = null, deadline = 0;
  if (c.sla_due) {
    days = daysBetween(DEMO_TODAY, c.sla_due);
    deadline = Math.max(0, Math.min(1, 1 - days / SLA_WINDOW));
  }

  const priorFindings = DATA.cases.filter(
    (o) => o.taxpayer_id === c.taxpayer_id && o.case_id !== c.case_id && o.diff_tax_amt > 0
  ).length;
  const amended = DATA.returns.filter((r) => r.taxpayer_id === c.taxpayer_id && !r.current_flag).length;
  const history = Math.min(priorFindings * 0.5 + amended * 0.25, 1);

  const parts = { exposure, deadline, history, quickwin };
  const score = pyRound(Object.keys(WEIGHTS).reduce((s, k) => s + WEIGHTS[k] * parts[k], 0) * 100);

  let top = "exposure", best = -Infinity;
  for (const k of ["exposure", "deadline", "history", "quickwin"]) {
    const v = WEIGHTS[k] * parts[k];
    if (v > best) { best = v; top = k; }
  }
  const drivers = {
    exposure: "SAR " + Math.trunc(residual).toLocaleString("en-US") + " at stake",
    deadline: days === null ? "no deadline" : days < 0 ? "past SLA deadline" : "due in " + days + " days",
    history: priorFindings ? priorFindings + " prior finding(s)" : "clean history",
    quickwin: Math.round(explained * 100) + "% already explained",
  };
  return {
    score,
    band: score >= 60 ? "high" : score >= 35 ? "medium" : "low",
    driver: drivers[top],
    signals: { exposure: r3(exposure), deadline: r3(deadline), history: r3(history), quickwin: r3(quickwin) },
    residual: r2(residual),
    deadline_days: days,
    prior_findings: priorFindings,
  };
}
function r3(n) { return Math.round((n + 1e-9) * 1000) / 1000; }

/* ------------------------------------------- executive overview (routes.overview) */
function overviewData() {
  const cases = DATA.cases.filter((c) => c.status !== "closed");
  let exposure = 0, explained = 0, apparent = 0, supported = 0, findings = 0, review = 0;
  for (const c of cases) {
    let r;
    try { r = reconcileCase(c.case_id); } catch (e) { continue; }
    const combined = r.combined || {};
    apparent += Math.abs(r.apparent_gap);
    explained += Math.max(r.explained_total, 0);
    const state = combined.state != null ? combined.state : r.state;
    if (state === "potential-finding") {
      exposure += combined.total_exposure != null ? combined.total_exposure : Math.max(r.residual, 0);
      findings += 1;
    } else if (state === "unresolved") review += 1;
    else if (state === "supported") supported += 1;
  }
  const n = cases.length;
  return {
    open_cases: n,
    exposure_total: r2(exposure),
    explained_total: r2(explained),
    apparent_gap_total: r2(apparent),
    auto_clearable: supported,
    auto_clearable_pct: n ? r4(supported / n) : 0,
    needs_action: findings + review,
    findings,
    to_review: review,
  };
}

function listCases() {
  const rows = DATA.cases
    .filter((c) => c.status !== "closed")
    .map((c) => {
      const tp = taxpayerById(c.taxpayer_id);
      return {
        case_id: c.case_id, taxpayer: tp.name, vat_no: tp.vat_no, sector: tp.sector,
        period: c.period_from + " → " + c.period_to,
        reason: c.reason, risk: c.risk, referral_priority: c.vat_priority,
        status: c.status, scenario: c.scenario, priority: scoreCase(c),
      };
    });
  rows.sort((a, b) => b.priority.score - a.priority.score);
  return rows;
}

/* ------------------------------------------- deterministic AI fallbacks (llm/verify.py)
   These are the ENGINE-authored drafts the real app shows when no API key is set.
   Nothing here is model output. */
function fbNarration(recon) {
  const expl = recon.bridge.filter((b) => b.kind === "explain")
    .map((b) => b.rule + " " + b.label.toLowerCase() + " (" + sar(b.amount) + ")").join("; ") || "no reconciling items";
  const tail = recon.state === "supported"
    ? "leaving no material residual."
    : "leaving an unexplained residual of " + sar(recon.residual) + " (" + recon.band + ").";
  return "Reconstructing " + recon.box.toLowerCase() + " from " + recon.invoices_considered +
    " cleared e-invoices gives " + sar(recon.reconstructed_gross) + " against " + sar(recon.declared) +
    " declared — an apparent gap of " + sar(recon.apparent_gap) + ". The bridge explains it via " + expl + ", " + tail;
}

function fbNba(recon) {
  if (recon.state === "supported" || Math.abs(recon.residual) <= recon.materiality) {
    return {
      action_type: "no-action",
      document_requested: "None — residual within materiality.",
      addressed_to: "internal-review",
      rationale: "The reconstructed position reconciles to the declared box within materiality.",
      expected_yield: "Case can be closed as supported.",
      minimises_contact: true,
    };
  }
  return {
    action_type: "request-explanation",
    document_requested: "A written reconciliation of the unexplained residual for the period.",
    addressed_to: "taxpayer",
    rationale: "The bridge closes the known reconciling items; only the residual remains.",
    expected_yield: "Confirms or clears the residual of " + sar(recon.residual) + ".",
    minimises_contact: false,
  };
}

function fbSummary(caseId) {
  const c = caseById(caseId);
  const tp = taxpayerById(c.taxpayer_id);
  const priorReturns = DATA.returns.filter((r) => r.taxpayer_id === tp.id);
  const priorCases = DATA.cases.filter((o) => o.taxpayer_id === tp.id && o.case_id !== caseId);
  const amended = priorReturns.filter((r) => !r.current_flag);
  const pts = ["Sector: " + (tp.sector || "n/a") + "; size: " + (tp.size || "n/a") +
    "; accounting basis: " + (tp.accounting_method || "n/a") + "."];
  if (amended.length) pts.push(amended.length + " amended return(s) on file.");
  if (priorCases.length) pts.push(priorCases.length + " prior audit case(s) for this taxpayer.");
  while (pts.length < 2) pts.push("Limited prior history available.");
  return {
    headline: "Auditor brief assembled from profile and prior filings (deterministic).",
    points: pts.slice(0, 5),
    risk_flags: amended.length > 1 ? ["Repeated amendments"] : [],
    prior_pattern: priorCases.length ? "Recurring adjustments across periods." : "No prior audit findings recorded.",
  };
}

function fbReport(recon) {
  const concl = recon.state === "supported"
    ? "The reconstructed position reconciles to the declared box within materiality; the case is **supported** with no further action."
    : "An unexplained residual of " + sar(recon.residual) + " (" + recon.band + ") remains after the bridge; the case is a **potential finding** pending evidence.";
  const lines = recon.bridge
    .map((b) => "- " + b.label + ": " + sar(b.amount) + " (running " + sar(b.running) + ")")
    .join("\n");
  return "## Case summary\nDeclared " + sar(recon.declared) + " for " + recon.box + "; reconstructed " +
    sar(recon.reconstructed_gross) + " from " + recon.invoices_considered + " cleared e-invoices.\n\n" +
    "## Reconstruction & bridge\n" + lines + "\n\n" +
    "## Residual & conclusion\n" + concl + "\n\n" +
    "## Recommended next action\n" +
    (recon.state === "supported"
      ? "Close as supported."
      : "Request a written reconciliation of the residual from the taxpayer.");
}

    if (rulesQ && !hay.includes(rulesQ.toLowerCase())) return false;
    if (rulesFam && r.family !== rulesFam) return false;
    if (rulesSev && r.severity_band !== rulesSev) return false;
    if (rulesGap && r.gap_band !== rulesGap) return false;
    if (rulesKind && r.rule_kind !== rulesKind) return false;
    return true;
  });
  const active = rules.filter((r) => r.enabled).length;
  const wired = rules.filter((r) => r.wired).length;

  return '<div class="page">' +
    '<div class="page-head"><div><p class="eyebrow">Detection rules</p><h1>VAT Mistakes Rulebook</h1></div></div>' +
    '<div class="controls">' +
    '<div class="search"><input id="rule-q" placeholder="Search rules — reverse charge, late filing, credit note, Box 9…" value="' + esc(rulesQ) + '" /></div>' +
    families.map((f) => '<button class="chip' + (rulesFam === f ? " on" : "") + '" data-fam="' + esc(f) + '">' + esc(f) + '</button>').join("") +
    SEV.map((s) => '<button class="chip sev-' + s.v + (rulesSev === s.v ? " on" : "") + '" data-sev="' + s.v + '">' + s.l + '</button>').join("") +
    GAP.map((g) => '<button class="chip' + (rulesGap === g.v ? " on" : "") + '" data-gap="' + g.v + '">' + g.l + '</button>').join("") +
    KIND.map((k) => '<button class="chip kind-' + k.v + (rulesKind === k.v ? " on" : "") + '" data-kind="' + k.v +
      '" title="What kind of object this rule is — an explanation, a mistake, or a risk signal">' + k.l + '</button>').join("") +
    '<span class="rescount">' + active + ' active · ' + wired + ' wired · ' + shown.length + ' of ' + rules.length + ' shown</span>' +
    '</div>' +
    '<div class="cards">' + shown.map((r) =>
      '<div class="card sev-' + r.severity_band + (r.enabled ? "" : " off") + '">' +
      '<div class="card-top"><span class="code">' + esc(r.code) + '</span><span class="fam">' + esc(r.family) + '</span></div>' +
      '<h3>' + esc(r.title) + '</h3>' +
      '<div class="card-kind"><span class="kindtag kind-' + r.rule_kind + '">' + esc(r.rule_kind) + '</span>' +
      (r.reason_code ? '<span class="rc" title="' + esc(r.reason_label) + '">' + esc(r.reason_code) + '</span>' : "") +
      '<span class="stagetag" title="Stage in the evaluation precedence">' + esc(r.stage) + '</span></div>' +
      '<div class="card-badges"><span class="badge gap-' + r.gap_band + '">' +
      esc(r.gap_band === "no" ? "No direct gap" : r.explains_gap) + '</span>' +
      '<span class="pill sev-' + r.severity_band + '">' + esc(r.severity) + '</span></div>' +
      '<div class="card-foot">' +
      '<label class="switch"><input type="checkbox" data-toggle="' + esc(r.code) + '"' + (r.enabled ? " checked" : "") + ' />' +
      '<span class="switch-track"><span class="switch-thumb"></span></span>' +
      '<span class="switch-label">' + (r.enabled ? "Active" : "Disabled") + '</span></label>' +

        : '<button class="card-del" title="Delete rule" data-delask="' + esc(r.code) + '">×</button>') +

function waterfall(d, source) {
  const max = Math.max(d.reconstructed_gross, d.declared, 1);
  const explains = d.bridge.filter((b) => b.kind === "explain").map((b) => {
    const idx = d.bridge.findIndex((x) => x.seq === b.seq);
    return { rule: b.rule, label: b.label, amount: b.amount, before: d.bridge[idx - 1].running, after: b.running };
  });
  const rows = [
    { title: "Reconstructed from e-invoices", kind: "recon", start: 0, end: d.reconstructed_gross, amount: d.reconstructed_gross, key: "gap" },
    ...explains.map((e) => ({ title: e.label, rule: e.rule, kind: "explain", start: e.after, end: e.before, amount: e.amount, key: "explain:" + e.rule })),
    { title: "Declared by the taxpayer", kind: "declared", start: 0, end: d.declared, amount: d.declared, key: "anchor" },
    { title: "Unexplained residual", kind: "residual", start: d.declared, end: d.declared + d.residual, amount: d.residual, key: "residual" },
  ];

  return '<div class="bridge">' + rows.map((r) => {
    const left = (Math.min(r.start, r.end) / max) * 100;
    const width = Math.max((Math.abs(r.end - r.start) / max) * 100, 0.5);
    const sign = r.amount < 0 ? "−" : r.kind === "residual" && r.amount > 0 ? "+" : "";
    return '<div class="brow clickable" role="button" tabindex="0" data-drill="' + esc(source + "|" + r.key) + '" ' +
      'data-title="' + esc(r.title) + '" data-amount="' + r.amount + '">' +
      '<div class="lbl">' + (r.rule ? '<span class="rc">' + esc(r.rule) + '</span>' : "") + esc(r.title) +
      '<span class="rowhint">›</span></div>' +
      '<div class="track"><div class="bar ' + r.kind + '" style="left:' + left + '%;width:' + width + '%"></div></div>' +
      '<div class="amt ' + r.kind + '">' + sign + esc(sar(r.amount)) + '</div></div>';
  }).join("") + '</div>';
}

function verifyBadge(source) {
  if (source === null) return '<span class="pill">AI writing…</span>';
  if (source === "claude" || source === "engine-override")
    return '<span class="pill pri-low" title="Every figure traces to the reconciliation engine.">✓ Figures verified</span>';
  if (source === "deterministic-fallback")
    return '<span class="pill status" title="No AI configured — deterministic output.">∑ Deterministic (no AI)</span>';
  if (source === "pdpl-fallback")
    return '<span class="pill status" title="Hosted AI disabled for non-synthetic data (PDPL).">∑ Deterministic (PDPL)</span>';
  if (source === "blocked-refusal")
    return '<span class="pill pri-medium" title="The model declined; showing deterministic draft.">Model declined</span>';
  if (source === "api-error" || source === "stream-error")
    return '<span class="pill pri-high" title="AI call failed — check configuration.">⚠ AI unavailable — misconfigured</span>';
  return '<span class="pill pri-high">⚠ AI output withheld — deterministic draft</span>';
}

function renderMd(text) {
  const bold = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const out = [];
  let list = [];
  const flush = () => { if (list.length) { out.push("<ul>" + list.map((l) => "<li>" + bold(l) + "</li>").join("") + "</ul>"); list = []; } };
  text.split("\n").forEach((ln) => {
    if (ln.startsWith("## ")) { flush(); out.push("<h4>" + esc(ln.slice(3)) + "</h4>"); }
    else if (ln.startsWith("- ")) list.push(ln.slice(2));
    else if (ln.trim() === "") flush();
    else { flush(); out.push("<p>" + bold(ln) + "</p>"); }
  });
  flush();
  return out.join("");
}

function investigationPanel(caseId) {
  const inv = investigate(caseId);
  const byId = Object.fromEntries(inv.hypotheses.map((h) => [h.id, h]));
  const adj = Object.fromEntries(inv.adjudications.map((a) => [a.hypothesis_id, a]));
  const pill = { confirmed: "pri-low", refuted: "status", "insufficient-evidence": "pri-medium" };

  const rows = inv.hypotheses.map((h) => {
    const a = adj[h.id] || {};
    const lead = inv.leading === h.id;
    return '<div class="hyp' + (lead ? " lead" : "") + '">' +
      '<div><div class="hid">' + esc(h.id) + '</div>' +
      (h.reason_code ? '<span class="rc">' + esc(h.reason_code) + '</span>' : "") + '</div>' +
      '<div><div class="agent">' + esc(h.agent) + (lead ? " · leading" : "") + '</div>' +
      esc(h.claim) +
      (a.explanation ? '<div class="verdict">' + esc(a.explanation) + '</div>' : "") + '</div>' +
      '<div style="text-align:right"><span class="pill ' + (pill[a.status] || "status") + '">' +
      esc((a.status || "").replace(/-/g, " ")) + '</span>' +
      (a.amount ? '<div class="amt2">' + esc(sar(a.amount)) + '</div>' : "") + '</div></div>';
  }).join("");

  const objection = inv.entries.find((e) => e.kind === "objection");
  return '<div class="panel ai-panel"><div class="panel-head">' +
    '<div class="ai-h"><span class="ai-chip">AGENTS</span><h2>Investigation</h2></div>' +
    '<span class="pill status" title="Agents propose typed tests; a deterministic adjudicator settles them. No model states a figure.">∑ Adjudicated (no AI)</span></div>' +
    '<div class="ai-body">' +
    '<p class="inv-conc">' + esc(inv.conclusion) + '</p>' +
    (inv.hypotheses.length
      ? '<div class="inv-round">Round 1–2 · ' + inv.hypotheses.length +
        ' hypotheses proposed, each settled against the engine</div>' + rows +
        (objection ? '<div class="inv-round">Round 3 · Challenger</div>' +
          '<p class="detail-note" style="margin:0">' + esc(objection.payload.note) + '</p>' : "")
      : "") +
    '</div></div>';
}
